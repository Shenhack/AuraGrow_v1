                if (e.includes('curado')) return 'fa-jar';
                if (e.includes('cosechada') || e.includes('cosecha')) return 'fa-scissors';
                return 'fa-seedling';
            },
            getSystemIcon(sistema) {
                const s = (sistema || '').toLowerCase();
                if (s.includes('tierra') || s.includes('sustrato') || s.includes('soil')) return 'fa-mountain';
                if (s.includes('hidroponia') || s.includes('hidro') || s.includes('dwc')) return 'fa-droplet';
                if (s.includes('aeroponia') || s.includes('aero')) return 'fa-cloud';
                if (s.includes('coco') || s.includes('fibra')) return 'fa-layer-group';
                return 'fa-seedling';
            },
            getPlantStatusIcon(estado) {
                const e = (estado || '').toLowerCase();
                if (e === 'saludable' || e === 'sana' || e === 'sano' || e === 'optimal' || e === 'óptimo' || e === 'optimo' || e === 'excelente') return 'fa-circle-check';
                if (e === 'alerta' || e === 'advertencia' || e === 'riesgo' || e === 'alert') return 'fa-triangle-exclamation';
                if (e === 'critica' || e === 'critico' || e === 'enferma' || e === 'danger' || e === 'critical') return 'fa-circle-exclamation';
                return 'fa-circle-check';
            },
            getPlanEventIcon(tipo, accion) {
                const t = (tipo || '').toLowerCase();
                const a = (accion || '').toLowerCase();
                if (t === 'riego' || a.includes('riego') || a.includes('agua') || a.includes('flush') || a.includes('lavado')) return 'fa-droplet';
                if (t === 'nutricion' || a.includes('fertilizante') || a.includes('dosis') || a.includes('nutriente') || a.includes('calmag') || a.includes('bloom')) return 'fa-flask';
                if (t === 'poda' || a.includes('poda') || a.includes('topping') || a.includes('lst') || a.includes('defoliación') || a.includes('defoliacion')) return 'fa-scissors';
                if (t === 'cosecha' || a.includes('cosecha') || a.includes('cosechar') || a.includes('cortar')) return 'fa-basket-shopping';
                if (t === 'inicio' || a.includes('inicio') || a.includes('germinación') || a.includes('germinacion') || a.includes('semilla')) return 'fa-seedling';
                if (a.includes('trasplante') || a.includes('mover')) return 'fa-arrow-right-arrow-left';
                return 'fa-calendar-day';
            }
        };

        /* =========================================================================
           4. RENDER
           ========================================================================= */
        const render = {
            updateThemeColors() {
                const root = document.documentElement;
                
                // Si la vista es detalle de planta, mutar según su etapa
                if (state.activeView === 'plant-detail' && state.selectedPlantId) {
                    const plant = state.plants.find(p => p.id === state.selectedPlantId);
                    if (plant) {
                        const etapa = plant.etapa.toLowerCase();
                        if (etapa.includes('floración') || etapa.includes('floracion')) {
                            // Floración: violeta profundo / magenta electromagnético
                            root.style.setProperty('--accent-teal', '#ff007f');
                            root.style.setProperty('--accent-teal-hover', '#ff3399');
                            root.style.setProperty('--accent-teal-dim', 'rgba(255, 0, 127, 0.15)');
                            root.style.setProperty('--shadow-glow', '0 0 20px rgba(255, 0, 127, 0.25)');
                            return;
                        } else {
                            // Vegetativo o germinación: cian / verde neón ultra saturado
                            root.style.setProperty('--accent-teal', '#00ffcc');
                            root.style.setProperty('--accent-teal-hover', '#33ffdd');
                            root.style.setProperty('--accent-teal-dim', 'rgba(0, 255, 204, 0.15)');
                            root.style.setProperty('--shadow-glow', '0 0 20px rgba(0, 255, 204, 0.25)');
                            return;
                        }
                    }
                }
                
                // Si estamos en cualquier otra vista, o no hay planta activa seleccionada
                // Usamos el cian óptimo / verde neón como color de acento cyberpunk por defecto
                root.style.setProperty('--accent-teal', '#00ffcc');
                root.style.setProperty('--accent-teal-hover', '#33ffdd');
                root.style.setProperty('--accent-teal-dim', 'rgba(0, 255, 204, 0.15)');
                root.style.setProperty('--shadow-glow', '0 0 20px rgba(0, 255, 204, 0.25)');
            },

            app() {
                this.updateThemeColors(); // Muta la paleta según el contexto fenológico
                const container = document.getElementById('app-content');
                // Update active nav link
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.route === state.activeView);
                });

                let html = '';
                switch(state.activeView) {
                    case 'dashboard': html = this.dashboardView(); break;
                    case 'plants': html = this.plantsView(); break;
                    case 'log': html = this.logView(); break;
                    case 'tasks': html = this.tasksView(); break;
                    case 'planes': html = this.planesView(); break;
                    case 'metrics': html = this.metricsView(); break;
                    case 'plant-detail': html = this.plantDetailView(); break;
                    case 'aura-chat': html = this.auraChatView(); break;
                    case 'settings': html = this.settingsView(); break;
                    default: html = this.dashboardView();
                }
                
                // Add animation wrapper
                container.innerHTML = `<div class="animate-view">${html}</div>`;
            },

            dashboardView() {
                const activePlants = state.plants.filter(p => p.estado === 'activa');
                const vegCount = activePlants.filter(p => p.etapa === 'vegetativo').length;
                const floCount = activePlants.filter(p => p.etapa === 'floración' || p.etapa === 'floracion').length;
                
                // KPI 1: CALCULAR ALERTAS (VPD Amarillo o Rojo)
                let alertasCount = 0;
                activePlants.forEach(p => {
                    const logsPlant = state.logs.filter(l => l.plantId === p.id && l.tipo === 'medicion');
                    if (logsPlant.length > 0) {
                        const lastLog = logsPlant[0];
                        const vpdMatch = lastLog.nota.match(/VPD:\s*([0-9.]+)kPa/);
                        if (vpdMatch) {
                            const vpd = parseFloat(vpdMatch[1]);
                            const color = handlers.evaluarClima(vpd, p.etapa);
                            if (color === 'var(--status-alert)' || color === 'var(--status-critical)') {
                                alertasCount++;
                            }
                        }
                    }
                });

                // KPI 2: AUTOGENERAR TAREAS DE RIEGO (Lógica 72h / 3 Días)
                let autoTasks = [];
                const now = new Date();
                activePlants.forEach(p => {
                    if (p.etapa === 'vegetativo' || p.etapa.includes('flor')) {
                        const lastRiego = state.logs.find(l => l.plantId === p.id && l.tipo === 'riego');
                        let needsWater = false;
                        
                        if (!lastRiego) {
                            needsWater = true; 
                        } else {
                            const diffTime = Math.abs(now - new Date(lastRiego.fecha));
                            const diffDays = diffTime / (1000 * 60 * 60 * 24);
                            if (diffDays >= 3) needsWater = true;
                        }
                        
                        if (needsWater) {
                            autoTasks.push({
                                id: 'auto_' + p.id,
                                titulo: `Regar ${p.nombre}`,
                                fecha: now.toISOString(),
                                prioridad: 'alta',
                                completada: false,
                                plantId: p.id,
                                isAuto: true
                            });
                        }
                    }
                });

                // Fusionar tareas automáticas con tareas manuales
                const pendingTasks = [...autoTasks, ...state.tasks.filter(t => !t.completada)].slice(0, 5);
                const recentLogs = state.logs.slice(0, 4);
                
                const lunar = utils.getLunarPhase();

                // 1. GENERAR AGENDA SEMANAL
                const startOfWeek = new Date(now);
                const currentDayOfWeek = now.getDay();
                const distanceToMonday = currentDayOfWeek === 0 ? -6 : 1 - currentDayOfWeek;
                startOfWeek.setDate(now.getDate() + distanceToMonday); // Monday
                
                let weeklyDaysHtml = '';
                const dayNamesShort = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(startOfWeek);
                    d.setDate(startOfWeek.getDate() + i);
                    const isToday = d.toDateString() === now.toDateString();
                    weeklyDaysHtml += `
                        <div class="weekly-agenda-day ${isToday ? 'today' : ''}">
                            <span class="day-name">${dayNamesShort[i]}</span>
                            <span class="day-num">${d.getDate()}</span>
                        </div>
                    `;
                }

                const lunarWidgetHtml = `
                    <div class="lunar-widget" title="${lunar.name}">
                        <i class="fa-solid fa-moon"></i>
                        <span>${lunar.emoji}</span>
                        <span class="lunar-phase-name">${lunar.name}</span>
                    </div>
                `;

                const weeklyAgendaHtml = `
                    <div class="weekly-agenda-container">
                        <div class="weekly-agenda-strip">
                            ${weeklyDaysHtml}
                        </div>
                        ${lunarWidgetHtml}
                    </div>
                `;

                // 2. GENERAR ACCIONES RÁPIDAS
                let plantSelectorHtml = '';
                if (activePlants.length > 1) {
                    plantSelectorHtml = `
                        <select id="quick-action-plant-select" class="form-control" style="width: auto; padding: 4px 12px; font-size: 12px; background: var(--bg-surface-hover); border-radius: var(--radius-sm); border: 1px solid var(--border-color); color: var(--text-primary); outline: none;">
                            ${activePlants.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('')}
                        </select>
                    `;
                } else if (activePlants.length === 1) {
                    plantSelectorHtml = `<span style="font-size: 12px; color: var(--accent-teal); font-weight: 500;"><i class="fa-solid fa-seedling"></i> ${activePlants[0].nombre}</span>`;
                } else {
                    plantSelectorHtml = `<span style="font-size: 12px; color: var(--status-critical); font-weight: 500;">No hay plantas activas</span>`;
                }

                const quickActionsHtml = `
                    <div style="margin-bottom: 24px;">
                        <div class="quick-actions-header">
                            <span>Acciones Rápidas (Registro Express)</span>
                            ${plantSelectorHtml}
                        </div>
                        <div class="quick-actions-bar">
                            <button class="quick-action-btn" onclick="handlers.quickLog(null, 'Riego')" ${activePlants.length === 0 ? 'disabled' : ''}>
                                <i class="fa-solid fa-droplet"></i> Riego
                            </button>
                            <button class="quick-action-btn" onclick="handlers.quickLog(null, 'Nutrientes')" ${activePlants.length === 0 ? 'disabled' : ''}>
                                <i class="fa-solid fa-flask"></i> Nutrientes
                            </button>
                            <button class="quick-action-btn" onclick="handlers.quickLog(null, 'Poda')" ${activePlants.length === 0 ? 'disabled' : ''}>
                                <i class="fa-solid fa-scissors"></i> Poda
                            </button>
                            <button class="quick-action-btn" onclick="handlers.quickLog(null, 'Medicion')" ${activePlants.length === 0 ? 'disabled' : ''}>
                                <i class="fa-solid fa-chart-simple"></i> Medición
                            </button>
                        </div>
                    </div>
                `;

                // Lógica de Sugerencias de Aura
                let auraSuggestions = [];
                
                // 1. Plantas en floración > 42 días
                activePlants.filter(p => (p.etapa === 'floración' || p.etapa === 'floracion') && utils.daysBetween(p.fechaInicio, now) > 42).forEach(p => {
                    auraSuggestions.push(`${p.nombre} lleva ${utils.daysBetween(p.fechaInicio, now)} días en floración — revisá tricomas esta semana`);
                });
                
                // 2. Plantas sin logs en 3 días
                activePlants.forEach(p => {
                    const lastLog = state.logs.find(l => l.plantId === p.id);
                    if (!lastLog || utils.daysBetween(lastLog.fecha, now) > 3) {
                        auraSuggestions.push(`Sin registros recientes en ${p.nombre} — ¿todo bien?`);
                    }
                });
                
                // 3. Vegetativo sin poda en 14 días
                activePlants.filter(p => p.etapa === 'vegetativo').forEach(p => {
                    const lastPoda = state.logs.find(l => l.plantId === p.id && l.tipo === 'poda');
                    if (!lastPoda || utils.daysBetween(lastPoda.fecha, now) > 14) {
                        auraSuggestions.push(`${p.nombre} puede estar lista para defoliar`);
                    }
                });
                
                // 4. VPD elevado
                const highVpd = state.envRecords.some(e => parseFloat(e.vpd) > 1.4 && utils.daysBetween(e.fecha, now) <= 2);
                if (highVpd) {
                    auraSuggestions.push("VPD elevado detectado — revisá temperatura y humedad");
                }
                
                // Limitar a 3 sugerencias para no abrumar
                auraSuggestions = auraSuggestions.slice(0, 3);
                
                const suggestionsHtml = auraSuggestions.length > 0 
                    ? auraSuggestions.map(s => `<div style="margin-bottom: 8px; font-size: 14px;"><i class="fa-solid fa-circle-dot" style="color: var(--accent-teal); font-size: 8px; margin-right: 8px; vertical-align: middle;"></i>${s}</div>`).join('')
                    : `<div style="color: var(--text-secondary); font-size: 14px;">Todo parece estar en orden 🌿</div>`;

                return `
                    <div class="page-header" style="margin-bottom: 12px;">
                        <h1 class="page-title">Dashboard</h1>
                    </div>
                    
                    ${weeklyAgendaHtml}
                    
                    <div class="card cultivation-plan-entry" style="margin-bottom: 24px; border: 1px solid rgba(16, 185, 129, 0.3); background: linear-gradient(135deg, rgba(16,185,129,0.1) 0%, rgba(5,5,5,1) 100%); position: relative; overflow: hidden; padding: 32px 24px; box-shadow: 0 8px 32px rgba(16,185,129,0.05); transition: all 0.3s ease; cursor: pointer;" onclick="handlers.openCultivationPlanModal()">
                        <!-- Marca de agua icono grande -->
                        <i class="fa-solid fa-seedling" style="position: absolute; right: -20px; bottom: -20px; font-size: 140px; color: rgba(16,185,129,0.05); z-index: 0; transform: rotate(-15deg);"></i>
                        
                        <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; position: relative; z-index: 1; flex-wrap: wrap;">
                            <div style="flex: 1; min-width: 280px;">
                                <div style="display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-teal); margin-bottom: 12px; background: rgba(16,185,129,0.1); padding: 4px 10px; border-radius: 999px;">
                                    <i class="fa-solid fa-bolt"></i> Cultivo Guiado
                                </div>
                                <h2 style="font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 8px; letter-spacing: -0.02em;">Crear Plan de Cultivo</h2>
                                <p style="font-size: 15px; color: var(--text-secondary); margin: 0; max-width: 450px; line-height: 1.5;">Configurá un ciclo completo con seguimiento automatizado. Elegí tu espacio, asigná genéticas y dejá que Aura diseñe el cronograma óptimo.</p>
                            </div>
                            <div>
                                <button class="btn btn-primary" style="padding: 14px 28px; font-size: 15px; font-weight: 600; white-space: nowrap; box-shadow: 0 4px 15px rgba(16,185,129,0.2);">
                                    Arrancar Cultivo <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    ${quickActionsHtml}

                    <div class="card" style="margin-bottom: 24px; padding: 20px;">
                        <span class="kpi-label" style="margin-bottom: 8px; display: block;"><i class="fa-solid fa-microscope" style="color: var(--accent-teal); margin-right: 6px;"></i> Telemetría Ambiental del Laboratorio (Promedio Global)</span>
                        ${(() => {
                            const latestGlobalEnv = state.envRecords[0] || { temperatura: 24.2, humedad: 55 };
                            return this._renderEnvGauges(latestGlobalEnv.temperatura, latestGlobalEnv.humedad, 'vegetativo');
                        })()}
                    </div>

                    <div class="grid-kpi">
                        <div class="card kpi-card">
                            <span class="kpi-label">Plantas Activas</span>
                            <div class="kpi-value" id="kpi-plants">${activePlants.length}</div>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                                <span class="badge badge-veg">${vegCount} Veg</span>
                                <span class="badge badge-flower">${floCount} Flo</span>
                            </div>
                        </div>
                        <div class="card kpi-card">
                            <span class="kpi-label">Alertas Ambientales</span>
                            <div class="kpi-value" style="color: ${alertasCount > 0 ? 'var(--status-critical)' : 'var(--status-optimal)'}">
                                ${alertasCount} <span class="kpi-unit">plantas</span>
                            </div>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Basado en VPD de Bitácora</div>
                        </div>
                        <div class="card kpi-card">
                            <span class="kpi-label">Tareas Automáticas</span>
                            <div class="kpi-value">${autoTasks.length} <span class="kpi-unit">sugeridas</span></div>
                        </div>
                        <div class="card kpi-card">
                            <span class="kpi-label">Sistema General</span>
                            <div class="kpi-value" style="color: var(--status-optimal)">OK</div>
                        </div>
                    </div>

                    <div class="card" style="border-left: 3px solid var(--accent-teal); padding: 20px 24px; margin-bottom: 24px;">
                        <div class="section-title">
                            <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--accent-teal)"></i> Sugerencias de Aura
                        </div>
                        ${suggestionsHtml}
                    </div>

                    <div class="grid-2col">
                        <div class="card">
                            <div class="section-title">
                                <i class="fa-solid fa-list-check" style="color: var(--accent-teal)"></i> Próximas Tareas
                            </div>
                            ${pendingTasks.length > 0 ? `
                                <div class="task-list">
                                    ${pendingTasks.map(t => this._taskItem(t)).join('')}
                                </div>
                            ` : `<div class="empty-state">No hay tareas pendientes.</div>`}
                        </div>

                        <div class="card">
                            <div class="section-title">
                                <i class="fa-solid fa-book-open" style="color: var(--text-secondary)"></i> Últimos Logs
                            </div>
                            <div class="timeline">
                                ${recentLogs.map(l => this._logItem(l)).join('')}
                            </div>
                        </div>
                    </div>
                `;
            },

            plantsView() {
                // NIVEL 2: VISTA DENTRO DE UN ESPACIO
                if (state.selectedSpaceId) {
                    const space = state.spaces.find(s => s.id === state.selectedSpaceId);
                    if (!space) {
                        state.selectedSpaceId = null;
                    } else {
                        const tab = state.plantsTab || 'activas';
                        const spacePlants = state.plants.filter(p => p.spaceId === space.id && (tab === 'activas' ? p.estado !== 'Cosechada' : p.estado === 'Cosechada'));

                        let detailAttributes = '';
                        if (space.tipo === 'secado') {
                            const tempObj = space.temp_obj_secado ? `${space.temp_obj_secado}°C` : '16°C';
                            const hrObj = space.hr_obj_secado ? `${space.hr_obj_secado}%` : '60%';
                            const metodo = space.metodo_secado ? space.metodo_secado : 'colgado';
                            const cap = space.capacidad_secado ? space.capacidad_secado : '--';
                            const osc = space.modo_oscuro_secado === 'si' ? 'Modo Oscuro: Sí' : 'Modo Oscuro: No';
                            const ext = space.extraccion_secado ? `, Extracción: ${space.extraccion_secado}` : '';
                            detailAttributes = `
                                <span style="text-transform: capitalize;"><i class="fa-solid ${utils.getSpaceIcon(space.tipo)}"></i> ${space.tipo}</span>
                                <span><i class="fa-solid fa-temperature-half"></i> Obj: ${tempObj}</span>
                                <span><i class="fa-solid fa-droplet"></i> Obj: ${hrObj}</span>
                                <span><i class="fa-solid fa-weight-hanging"></i> Capacidad: ${cap} (${metodo})</span>
                                <span><i class="fa-solid fa-moon"></i> ${osc}${ext}</span>
                            `;
                        } else if (space.tipo === 'curado') {
                            const tempObj = space.temp_obj_curado ? `${space.temp_obj_curado}°C` : '18°C';
                            const hrObj = space.hr_obj_curado ? `${space.hr_obj_curado}%` : '62%';
                            const envase = space.envase_curado ? space.envase_curado.replace('_', ' ') : 'frasco';
                            const cap = space.capacidad_curado ? space.capacidad_curado : '--';
                            detailAttributes = `
                                <span style="text-transform: capitalize;"><i class="fa-solid ${utils.getSpaceIcon(space.tipo)}"></i> ${space.tipo}</span>
                                <span><i class="fa-solid fa-temperature-half"></i> Guarda: ${tempObj}</span>
                                <span><i class="fa-solid fa-droplet"></i> Obj: ${hrObj}</span>
                                <span><i class="fa-solid fa-jar"></i> Envase: ${envase} (${cap})</span>
                            `;
                        } else {
                            const sustrato = space.sustrato || 'tierra';
                            const luz = space.luz || 'N/A';
                            const m2 = space.m2 ? ` (${space.m2} m²)` : '';
                            const cap = space.capacidad_cultivo ? `, Cap: ${space.capacidad_cultivo}` : '';
                            const ext = space.extraccion_cultivo ? `, Extracción: ${space.extraccion_cultivo}` : '';
                            detailAttributes = `
                                <span style="text-transform: capitalize;"><i class="fa-solid ${utils.getSpaceIcon(space.tipo)}"></i> ${space.tipo}${m2}</span>
                                <span><i class="fa-solid ${utils.getSystemIcon(space.sustrato)}"></i> ${sustrato}</span>
                                <span><i class="fa-solid fa-lightbulb"></i> ${luz}${cap}${ext}</span>
                            `;
                        }

                        const viewMode = state.plantsViewMode || 'grid';
                        let plantsRendered = '';
                        if (spacePlants.length) {
                            const groupedPlants = {};
                            spacePlants.forEach(p => {
                                const sectorName = p.sector || 'Principal';
                                if (!groupedPlants[sectorName]) {
                                    groupedPlants[sectorName] = [];
                                }
                                groupedPlants[sectorName].push(p);
                            });

                            const sectors = Object.keys(groupedPlants).sort();
                            plantsRendered = sectors.map(sector => {
                                const sectorPlants = groupedPlants[sector];
                                const sectorHeader = `
                                    <div class="hud-sector-header" style="display: flex; align-items: center; justify-content: space-between; margin-top: 24px; margin-bottom: 16px; padding: 10px 16px; background: rgba(0, 255, 204, 0.02); border: 1px solid rgba(0, 255, 204, 0.08); border-left: 4px solid var(--accent-teal); border-radius: var(--radius-sm); font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700; color: #fff;">
                                        <div style="display: flex; align-items: center; gap: 8px;">
                                            <i class="fa-solid fa-layer-group" style="color: var(--accent-teal);"></i> 
                                            <span>SECTOR / LOTE: <span style="color: var(--accent-teal); text-transform: uppercase;">${sector}</span></span>
                                        </div>
                                        <span style="font-size: 12px; color: var(--text-secondary); font-family: var(--font-mono);">${sectorPlants.length} especímenes</span>
                                    </div>
                                `;

                                let sectorContent = '';
                                if (viewMode === 'grid') {
                                    sectorContent = this.renderPlantsGrid(sectorPlants);
                                } else {
                                    sectorContent = `
                                    <div class="card" style="padding: 0; overflow: hidden; margin-bottom: 24px;">
                                        <div class="table-wrapper" style="border: none; border-radius: 0;">
                                            ${this.renderPlantsTable(sectorPlants)}
                                        </div>
                                    </div>`;
                                }
                                
                                return sectorHeader + sectorContent;
                            }).join('');
                        } else {
                            plantsRendered = `<div class="card" style="margin-bottom: 24px;"><div class="empty-state">No hay plantas en este espacio. Agrega tu primera planta.</div></div>`;
                        }

                        let html = `
                        <div class="page-header">
                            <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                                <button class="btn btn-outline" onclick="handlers.backToSpaces()">
                                    <i class="fa-solid fa-arrow-left"></i> Atrás
                                </button>
                                <div>

                                <div style="position: relative; z-index: 2; width: 100%;">
                                    <h3 style="font-size: 18px; margin: 0; color: #fff; font-family: 'Outfit', sans-serif; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">${p.nombre}</h3>

                                <i class="fa-solid ${systemIcon}"></i>

                            <div>

                                <span style="font-weight: 600; color: var(--text-primary); font-size: 14px; text-transform: capitalize;">${space.sustrato}</span>

                        <div class="card" style="padding: 16px; display: flex; align-items: center; gap: 16px; background: var(--bg-surface-hover);">

                    <div style="display:flex; gap:4px; margin-bottom:24px; background:#0a0a0a; padding:4px; border-radius:12px; width:fit-content;">
                        <button onclick="handlers.setPlantTab('resumen')" id="tab-resumen" style="padding:8px 20px; border-radius:8px; font-size:13px; font-weight:500; background:${state.activePlantTab === 'resumen' ? '#10b981' : 'transparent'}; color:${state.activePlantTab === 'resumen' ? '#000' : '#a1a1aa'}; border:none; cursor:pointer; transition:all 0.2s;">Resumen</button>

                    <div id="tab-content-resumen" style="display: ${state.activePlantTab === 'resumen' ? 'block' : 'none'};">

                                            <div class="kpi-value">${latestEnv.ec || '--'}</div>

                                    <div class="card" style="display: flex; flex-direction: column; gap: 12px; padding: 20px;">

                                            <i class="fa-solid fa-gauge-high" style="color: var(--accent-teal)"></i> Instrumentación de Microclima (Ficha Técnica)

                    <div id="tab-content-log" style="display: ${state.activePlantTab === 'log' ? 'block' : 'none'};">

            renderPlantPlanTab(plantId) {
                const plant = state.plants.find(p => p.id === plantId);
                const plan = state.plans.find(p => p.plantId === plantId);

                if (!plan) {
                    return `
                    <div style="text-align:center; padding:40px 20px; background:#0a0a0a; border-radius:16px; border:1px dashed rgba(255,255,255,0.08);">
                        <div style="font-size:32px; margin-bottom:12px; color:var(--text-secondary);"><i class="fa-solid fa-calendar-days"></i></div>
                        <div style="font-size:16px; font-weight:600; margin-bottom:8px;">Sin plan de cultivo</div>
                        <div style="font-size:13px; color:#a1a1aa; margin-bottom:24px;">Generá un cronograma automático basado en la etapa actual de ${plant.nombre}</div>
                        <button onclick="handlers.generatePlan('${plantId}')" class="btn btn-primary">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Generar Plan
                        </button>
                    </div>`;
                }

                const today = new Date();
                const totalDias = utils.daysBetween(plant.fechaInicio, today);
                const lastEvent = plan.events[plan.events.length - 1];
                const totalPlan = lastEvent ? lastEvent.dia : 77;
                const progreso = Math.min(100, Math.round((totalDias / totalPlan) * 100));
                const completadas = plan.events.filter(e => e.completada).length;

                return `
                <div class="card" style="margin-bottom:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <div>
                        <span style="font-size:14px; font-weight:600;">Día ${totalDias} de ~${totalPlan} estimados</span>
                        <span style="font-size:12px; color:#a1a1aa; margin-left:12px;">${completadas}/${plan.events.length} eventos completados</span>
                    </div>
                    <span style="font-size:13px; color:#10b981; font-weight:600;">${progreso}%</span>
                    </div>
                    <div style="height:8px; background:rgba(255,255,255,0.06); border-radius:999px; overflow:hidden;">
                    <div style="height:100%; width:${progreso}%; background:#10b981; border-radius:999px; transition:width 0.6s ease;"></div>
                    </div>
                </div>

                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <div class="section-title" style="margin:0;">
                        <i class="fa-solid fa-calendar-days" style="color:#10b981"></i> Cronograma
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button onclick="handlers.addPlanEvent('${plantId}')" class="btn btn-outline" style="font-size:12px; padding:6px 12px;">
                        <i class="fa-solid fa-plus"></i> Evento
                        </button>
                        <button onclick="handlers.openEditPlanModal('${plan.id}')" class="btn btn-outline" style="font-size:12px; padding:6px 12px; color:var(--accent-teal); border-color:rgba(16,185,129,0.3);">
                        <i class="fa-solid fa-pen"></i> Editar Plan
                        </button>
                        <button onclick="handlers.regeneratePlan('${plantId}')" class="btn btn-outline" style="font-size:12px; padding:6px 12px; color:#a1a1aa;">
                        <i class="fa-solid fa-rotate"></i> Regenerar
                        </button>
                    </div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:0;">
                    ${plan.events.map((ev, i) => {
                        const evDate = new Date(ev.fecha);
                        const isPast = evDate < today && !ev.completada;
                        const isToday = ev.fecha === today.toISOString().split('T')[0];
                        
                        const dotColor = ev.completada ? 'var(--accent-teal)' : isToday ? 'var(--status-alert)' : isPast ? 'var(--status-critical)' : 'rgba(255,255,255,0.2)';
                        const dotIcon = ev.completada ? '<i class="fa-solid fa-check" style="font-size:10px;"></i>' : isToday ? '<i class="fa-solid fa-bolt" style="font-size:10px;"></i>' : isPast ? '<i class="fa-solid fa-triangle-exclamation" style="font-size:10px;"></i>' : '';
                        
                        const tipoColors = {
                        cosecha: '#f59e0b', poda: '#3b82f6', 
                        riego: '#06b6d4', nutricion: '#8b5cf6',
                        inicio: '#10b981', otro: '#a1a1aa'
                        };
                        
                        return `
                        <div style="display:flex; gap:16px; position:relative; ${i < plan.events.length-1 ? 'padding-bottom:0;' : ''}">
                            ${i < plan.events.length-1 ? `<div style="position:absolute; left:11px; top:24px; bottom:0; width:2px; background:rgba(255,255,255,0.06); z-index:0;"></div>` : ''}
                            <div style="width:24px; height:24px; border-radius:50%; background:${ev.completada || isToday || isPast ? dotColor : 'var(--bg-surface-active)'}; border:2px solid ${dotColor}; display:flex; align-items:center; justify-content:center; color:${ev.completada || isToday || isPast ? '#000' : 'var(--text-secondary)'}; flex-shrink:0; z-index:1; margin-top:14px;">
                            ${dotIcon}
                            </div>
                            <div style="flex:1; padding:12px 0; border-bottom: ${i < plan.events.length-1 ? '1px solid rgba(255,255,255,0.04)' : 'none'};">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
                                <div style="flex:1;">
                                <div style="font-size:13px; font-weight:${isToday ? '600' : '500'}; color:${ev.completada ? '#a1a1aa' : isToday ? '#f8f8f8' : '#d4d4d8'}; text-decoration:${ev.completada ? 'line-through' : 'none'}; margin-bottom:4px; display:inline-flex; align-items:center; gap:6px;">
                                    ${ev.accion}
                                </div>
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <span style="font-size:11px; color:#a1a1aa; display:inline-flex; align-items:center; gap:4px;">
                                    ${isToday ? '<span style="color:var(--status-alert); font-weight:600;"><i class="fa-solid fa-bolt"></i> Hoy</span>' : isPast && !ev.completada ? '<span style="color:var(--status-critical); font-weight:600;"><i class="fa-solid fa-triangle-exclamation"></i> Vencido</span>' : 'Día ' + ev.dia} · ${new Date(ev.fecha).toLocaleDateString('es-ES', {day:'2-digit', month:'short'})}
                                    </span>
                                    <span style="font-size:10px; padding:2px 6px; border-radius:999px; background:${tipoColors[ev.tipo] || '#a1a1aa'}22; color:${tipoColors[ev.tipo] || '#a1a1aa'}; text-transform:uppercase; letter-spacing:0.04em; font-weight:600; display:inline-flex; align-items:center; gap:4px;">
                                    <i class="fa-solid ${utils.getPlanEventIcon(ev.tipo, ev.accion)}"></i> ${ev.tipo}
                                    </span>
                                </div>
                                </div>
                                <div style="display:flex; align-items:center; gap:12px; flex-shrink:0; margin-top:2px;">
                                    <button onclick="handlers.openEditEventModal('${plan.id}', '${ev.id}')" title="Editar Evento" class="btn btn-outline" style="padding:4px 8px; font-size:11px; color:var(--text-secondary); border-color:rgba(255,255,255,0.08); background:transparent;">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                    <button onclick="handlers.deletePlanEvent('${plan.id}', '${ev.id}')" title="Eliminar Evento" class="btn btn-outline" style="padding:4px 8px; font-size:11px; color:var(--status-critical); border-color:rgba(239,68,68,0.15); background:transparent;">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                    <input type="checkbox" ${ev.completada ? 'checked' : ''} 
                                    onchange="handlers.togglePlanEvent('${plan.id}', '${ev.id}', this.checked)"
                                    style="width:18px; height:18px; accent-color:#10b981; cursor:pointer; flex-shrink:0;">
                                </div>
                            </div>
                            </div>
                        </div>`;
                    }).join('')}
                    </div>
                </div>`;
            },

            _renderEnvGauges(temp, hum, etapa = 'vegetativo') {
                const tempVal = parseFloat(temp);
                const humVal = parseFloat(hum);
                
                const hasData = !isNaN(tempVal) && !isNaN(humVal);
                const vpd = hasData ? handlers.calcularVPD(tempVal, humVal) : 0;
                
                // Evaluar clima con handlers.evaluarClima para determinar color neón
                const colorVar = hasData ? handlers.evaluarClima(vpd, etapa) : 'var(--border-color)';
                
                let color = '#00ffcc'; // cian óptimo
                let pulseClass = '';
                
                if (colorVar === 'var(--status-alert)') {
                    color = '#f59e0b'; // amarillo
                    pulseClass = 'hud-pulse-yellow';
                } else if (colorVar === 'var(--status-critical)') {
                    color = '#ef4444'; // rojo
                    pulseClass = 'hud-pulse-red';
                } else if (!hasData) {
                    color = 'rgba(255,255,255,0.15)';
                }
                
                // Calcular offsets de circunferencia
                const tempPercent = hasData ? Math.min(100, Math.max(0, (tempVal / 50) * 100)) : 0;
                const humPercent = hasData ? Math.min(100, Math.max(0, humVal)) : 0;
                const vpdPercent = hasData ? Math.min(100, Math.max(0, (vpd / 3) * 100)) : 0;
                
                const circ = 2 * Math.PI * 34; // r=34 => ~213.6
                const tempOffset = circ * (1 - (tempPercent / 100));
                const humOffset = circ * (1 - (humPercent / 100));
                const vpdOffset = circ * (1 - (vpdPercent / 100));
                
                const tempStr = hasData ? tempVal.toFixed(1) : '--';
                const humStr = hasData ? humVal.toFixed(0) : '--';
                const vpdStr = hasData ? vpd.toFixed(2) : '--';
                
                return `
                <div class="hud-gauges-container ${pulseClass}" style="display: flex; justify-content: space-around; gap: 16px; width: 100%; padding: 12px 0;">
                    <!-- Temperatura Gauge -->
                    <div class="hud-gauge-card" style="display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1;">
                        <span class="kpi-label" style="font-size: 10px; font-family: var(--font-mono);">TEMP</span>
                        <div class="hud-gauge-wrapper" style="position: relative; width: 84px; height: 84px;">
                            <svg viewBox="0 0 80 80" style="width: 100%; height: 100%; transform: rotate(-90deg);">
                                <circle cx="40" cy="40" r="34" stroke="rgba(255,255,255,0.04)" stroke-width="4" fill="transparent" />
                                <circle class="gauge-path" cx="40" cy="40" r="34" stroke="${color}" stroke-width="5" fill="transparent" 
                                        stroke-dasharray="${circ}" stroke-dashoffset="${tempOffset}" stroke-linecap="round"
                                        style="transition: stroke-dashoffset 0.8s ease-in-out, stroke 0.4s ease; filter: drop-shadow(0 0 3px ${color}88);" />
                            </svg>
                            <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                                <span style="font-size: 16px; font-weight: 700; font-family: var(--font-mono); color: #fff;">${tempStr}</span>
                                <span style="font-size: 9px; color: var(--text-secondary); margin-top: -2px;">°C</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Humedad Gauge -->
                    <div class="hud-gauge-card" style="display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1;">
                        <span class="kpi-label" style="font-size: 10px; font-family: var(--font-mono);">HUMEDAD</span>
                        <div class="hud-gauge-wrapper" style="position: relative; width: 84px; height: 84px;">
                            <svg viewBox="0 0 80 80" style="width: 100%; height: 100%; transform: rotate(-90deg);">
                                <circle cx="40" cy="40" r="34" stroke="rgba(255,255,255,0.04)" stroke-width="4" fill="transparent" />
                                <circle class="gauge-path" cx="40" cy="40" r="34" stroke="${color}" stroke-width="5" fill="transparent" 
                                        stroke-dasharray="${circ}" stroke-dashoffset="${humOffset}" stroke-linecap="round"
                                        style="transition: stroke-dashoffset 0.8s ease-in-out, stroke 0.4s ease; filter: drop-shadow(0 0 3px ${color}88);" />
                            </svg>
                            <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                                <span style="font-size: 16px; font-weight: 700; font-family: var(--font-mono); color: #fff;">${humStr}</span>
                                <span style="font-size: 9px; color: var(--text-secondary); margin-top: -2px;">%</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- VPD Gauge -->
                    <div class="hud-gauge-card" style="display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1;">
                        <span class="kpi-label" style="font-size: 10px; font-family: var(--font-mono);">VPD</span>
                        <div class="hud-gauge-wrapper" style="position: relative; width: 84px; height: 84px;">
                            <svg viewBox="0 0 80 80" style="width: 100%; height: 100%; transform: rotate(-90deg);">
                                <circle cx="40" cy="40" r="34" stroke="rgba(255,255,255,0.04)" stroke-width="4" fill="transparent" />
                                <circle class="gauge-path" cx="40" cy="40" r="34" stroke="${color}" stroke-width="5" fill="transparent" 
                                        stroke-dasharray="${circ}" stroke-dashoffset="${vpdOffset}" stroke-linecap="round"
                                        style="transition: stroke-dashoffset 0.8s ease-in-out, stroke 0.4s ease; filter: drop-shadow(0 0 3px ${color}88);" />
                            </svg>
                            <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                                <span style="font-size: 16px; font-weight: 700; font-family: var(--font-mono); color: #fff;">${vpdStr}</span>
                                <span style="font-size: 9px; color: var(--text-secondary); margin-top: -2px;">kPa</span>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            },

            _renderLifecycleTimeline(plant) {
                const timeline = utils.getLifecycleTimeline(plant);
                return timeline.map(s => {
                    const statusClass = s.status; // 'completed' | 'active' | 'future'
                    let statusLabel = '';
                    if (s.status === 'completed') {
                        statusLabel = `<span class="lifecycle-badge">${s.days} días</span>`;
                    } else if (s.status === 'active') {
                        statusLabel = `<span class="lifecycle-badge active">Activa (${s.days}d)</span>`;
                    } else {
                        statusLabel = `<span class="lifecycle-badge">Futuro</span>`;
                    }
                    
                    let dotIcon = 'fa-circle';
                    if (s.status === 'completed') dotIcon = 'fa-check';
                    else if (s.status === 'active') dotIcon = 'fa-play';
                    
                    return `
                        <div class="lifecycle-node ${statusClass}">
                            <div class="lifecycle-dot">
                                <i class="fa-solid ${dotIcon}"></i>
                            </div>
                            <div class="lifecycle-node-header">
                                <span class="lifecycle-title">${s.name}</span>
                                ${statusLabel}
                            </div>
                            <div class="lifecycle-details">
                                ${s.status === 'active' ? `Iniciada el ${s.dateStr}.` : s.status === 'completed' ? `Completada el ${s.dateStr}.` : `Fecha estimada: ${s.dateStr}.`}
                            </div>
                        </div>
                    `;
                }).join('');
            },

            planesView() {
                const plantas = state.plants.filter(p => p.estado === 'activa');
                const planesActivos = state.plans.filter(p =>
                    plantas.some(pl => pl.id === p.plantId)
                );

                if (planesActivos.length === 0) {
                    return `
                    <div class="page-header">
                        <h1 class="page-title">Planes de Cultivo</h1>
                    </div>
                    <div class="empty-state">
                        <i class="fa-solid fa-calendar-days"></i><br>
                        No hay planes activos. Creá un plan desde el detalle de cada planta.
                    </div>`;
                }

                let html = `
                    <div class="page-header">
                    <h1 class="page-title">Planes de Cultivo</h1>
                    <div style="display:flex; gap:8px; align-items:center;">

                                <span style="font-size:11px; color:#a1a1aa; min-width:56px; font-variant-numeric:tabular-nums;">
                                ${new Date(ev.fecha).toLocaleDateString('es-ES', {day:'2-digit', month:'short'})}
                                </span>
                                <span style="font-size:12px; padding:1px 6px; border-radius:999px; background:${tipoColors[ev.tipo] || '#a1a1aa'}15; color:${tipoColors[ev.tipo] || '#a1a1aa'}; min-width:64px; text-align:center; font-size:10px; text-transform:uppercase; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:4px;">

                                </button>
                            </div>`;
                        }).join('')}
                        </div>
                        <div style="display:flex; justify-content:flex-end; gap:8px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.05); margin-top:12px;">
                            <button onclick="handlers.openEditPlanModal('${plan.id}')" class="btn btn-outline" style="font-size:12px; padding:6px 14px; color:var(--accent-teal); border-color:rgba(16,185,129,0.3);">
                                <i class="fa-solid fa-pen"></i> Editar Plan

                            <button onclick="handlers.deletePlan('${plan.id}')" class="btn btn-outline" style="font-size:12px; padding:6px 14px; color:var(--status-critical); border-color:var(--status-critical);">

                return html;

                const currentPlantFilter = state.logPlantFilter || 'Todos';
                const filters = ['Todos', 'Riego', 'Nutrientes', 'Medicion', 'Poda', 'Cosecha', 'Secado', 'Curado', 'Final'];
                
                const filterHtml = filters.map(f => `

                `).join('');

                let logsToShow = currentFilter === 'Todos' 
                    ? state.logs 
                    : state.logs.filter(l => {
                        const tipoLower = l.tipo.toLowerCase();
                        const filterLower = currentFilter.toLowerCase();
                        if (filterLower === 'medicion') {

                        if (filterLower === 'secado') {

                        if (filterLower === 'curado') {

                        if (filterLower === 'final') {
                            return tipoLower.includes('punto final');
                        }
                        return tipoLower === filterLower;

                    if (currentPlantFilter === 'General') {

                    }

                        <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; flex: 1;">

                            <select class="form-control" style="width: auto; padding: 4px 12px; font-size: 13px; height: 32px;" onchange="handlers.setLogPlantFilter(this.value)">

                                <option value="General" ${currentPlantFilter === 'General' ? 'selected' : ''}>General (Sin planta)</option>
                                ${state.plants.map(p => `<option value="${p.id}" ${currentPlantFilter === p.id ? 'selected' : ''}>${p.nombre}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="timeline">
                            ${logsToShow.length ? logsToShow.map(l => this._logItem(l)).join('') : '<div class="empty-state">No hay registros para este filtro.</div>'}
                        </div>
                    </div>
                `;
            },

            tasksView() {
                state.taskFilters = state.taskFilters || {
                    tipo: 'Todos',
                    prioridad: 'Todos',
                    planta: 'Todos',
                    estado: 'Todos'
                };
                
                // Aplicar filtros a state.tasks
                let filteredTasks = [...state.tasks];
                
                if (state.taskFilters.tipo !== 'Todos') {
                    filteredTasks = filteredTasks.filter(t => t.tipo === state.taskFilters.tipo);
                }
                if (state.taskFilters.prioridad !== 'Todos') {
                    filteredTasks = filteredTasks.filter(t => t.prioridad === state.taskFilters.prioridad);
                }
                if (state.taskFilters.planta !== 'Todos') {
                    filteredTasks = filteredTasks.filter(t => t.plantId === state.taskFilters.planta);
                }
                if (state.taskFilters.estado !== 'Todos') {
                    const onlyCompleted = state.taskFilters.estado === 'Completadas';
                    filteredTasks = filteredTasks.filter(t => t.completada === onlyCompleted);
                }

                const viewMode = state.tasksViewMode || 'list';
                
                // Tipos de tarea para el filtro
                const taskTypes = [
                    { value: 'Todos', label: 'Todos los tipos' },
                    { value: 'riego', label: '💧 Riego' },
                    { value: 'nutricion', label: '🧪 Nutrición' },
                    { value: 'poda', label: '✂️ Poda' },
                    { value: 'cosecha', label: '🪓 Cosecha' },
                    { value: 'trasplante', label: '🌱 Trasplante' },
                    { value: 'medicion', label: '📊 Medición' },
                    { value: 'otro', label: '📌 Otro' }
                ];
                
                // Prioridades
                const priorities = [
                    { value: 'Todos', label: 'Todas las prioridades' },
                    { value: 'alta', label: 'Alta' },
                    { value: 'media', label: 'Media' },
                    { value: 'baja', label: 'Baja' }
                ];
                
                // Estados
                const states = ['Todos', 'Pendientes', 'Completadas'];
                
                // Plantas
                const plantOptions = [{ id: 'Todos', nombre: 'Todas las plantas' }, ...state.plants];
                
                const filterBarHtml = `
                    <div class="task-filters-bar">
                        <div class="filter-group">
                            <label>Filtrar por Tipo</label>
                            <select class="form-control" style="width: auto; padding: 6px 12px; font-size: 13px; background: var(--bg-surface-hover);" onchange="handlers.setTaskFilter('tipo', this.value)">
                                ${taskTypes.map(t => `<option value="${t.value}" ${state.taskFilters.tipo === t.value ? 'selected' : ''}>${t.label}</option>`).join('')}
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Prioridad</label>
                            <select class="form-control" style="width: auto; padding: 6px 12px; font-size: 13px; background: var(--bg-surface-hover);" onchange="handlers.setTaskFilter('prioridad', this.value)">
                                ${priorities.map(p => `<option value="${p.value}" ${state.taskFilters.prioridad === p.value ? 'selected' : ''}>${p.label}</option>`).join('')}
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Planta</label>
                            <select class="form-control" style="width: auto; padding: 6px 12px; font-size: 13px; background: var(--bg-surface-hover);" onchange="handlers.setTaskFilter('planta', this.value)">
                                ${plantOptions.map(p => `<option value="${p.id}" ${state.taskFilters.planta === p.id ? 'selected' : ''}>${p.nombre}</option>`).join('')}
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Estado</label>
                            <select class="form-control" style="width: auto; padding: 6px 12px; font-size: 13px; background: var(--bg-surface-hover);" onchange="handlers.setTaskFilter('estado', this.value)">
                                ${states.map(s => `<option value="${s}" ${state.taskFilters.estado === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                        </div>
                        
                        <div style="margin-left: auto; display: flex; gap: 8px;">
                            <button class="btn ${viewMode === 'list' ? 'btn-primary' : 'btn-outline'}" style="padding: 8px 16px; font-size: 13px; border-radius: var(--radius-md);" onclick="handlers.setTasksViewMode('list')">
                                <i class="fa-solid fa-list"></i> Lista
                            </button>
                            <button class="btn ${viewMode === 'calendar' ? 'btn-primary' : 'btn-outline'}" style="padding: 8px 16px; font-size: 13px; border-radius: var(--radius-md);" onclick="handlers.setTasksViewMode('calendar')">
                                <i class="fa-solid fa-calendar-days"></i> Calendario
                            </button>
                        </div>
                    </div>
                `;

                let contentHtml = '';
                
                if (viewMode === 'calendar') {
                    if (state.calendarYear === undefined) {
                        const today = new Date();
                        state.calendarYear = today.getFullYear();
                        state.calendarMonth = today.getMonth();
                    }
                    
                    const monthNames = [
                        'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                        'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
                    ];
                    
                    const firstDay = new Date(state.calendarYear, state.calendarMonth, 1);
                    const totalDays = new Date(state.calendarYear, state.calendarMonth + 1, 0).getDate();
                    const prevTotalDays = new Date(state.calendarYear, state.calendarMonth, 0).getDate();
                    
                    let startDay = firstDay.getDay(); 
                    startDay = startDay === 0 ? 6 : startDay - 1;
                    
                    let gridHtml = '';
                    
                    // 1. Días del mes anterior (padding)
                    for (let i = startDay - 1; i >= 0; i--) {
                        const prevDayNum = prevTotalDays - i;
                        const prevMonthNum = state.calendarMonth === 0 ? 11 : state.calendarMonth - 1;
                        const prevYearNum = state.calendarMonth === 0 ? state.calendarYear - 1 : state.calendarYear;
                        const dateStr = `${prevYearNum}-${String(prevMonthNum + 1).padStart(2, '0')}-${String(prevDayNum).padStart(2, '0')}`;
                        
                        gridHtml += this._calendarCell(dateStr, prevDayNum, true);
                    }
                    
                    // 2. Días del mes actual
                    const today = new Date();
                    const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                    
                    for (let i = 1; i <= totalDays; i++) {
                        const dateStr = `${state.calendarYear}-${String(state.calendarMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                        const isToday = dateStr === todayStr;
                        
                        gridHtml += this._calendarCell(dateStr, i, false, isToday);
                    }
                    
                    // 3. Días del mes siguiente (padding)
                    const totalCells = startDay + totalDays;
                    const nextMonthPadding = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
                    
                    for (let i = 1; i <= nextMonthPadding; i++) {
                        const nextMonthNum = state.calendarMonth === 11 ? 0 : state.calendarMonth + 1;
                        const nextYearNum = state.calendarMonth === 11 ? state.calendarYear + 1 : state.calendarYear;
                        const dateStr = `${nextYearNum}-${String(nextMonthNum + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                        
                        gridHtml += this._calendarCell(dateStr, i, true);
                    }
                    
                    const dayLabels = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
                    
                    contentHtml = `
                        <div class="calendar-nav-bar">
                            <span class="calendar-nav-title">${monthNames[state.calendarMonth]} ${state.calendarYear}</span>
                            <div class="calendar-nav-buttons">
                                <button class="btn btn-outline" style="padding: 6px 12px; font-size: 13px; border-radius: var(--radius-md);" onclick="handlers.prevMonth()"><i class="fa-solid fa-chevron-left"></i> Anterior</button>
                                <button class="btn btn-outline" style="padding: 6px 12px; font-size: 13px; border-radius: var(--radius-md);" onclick="handlers.todayMonth()">Hoy</button>
                                <button class="btn btn-outline" style="padding: 6px 12px; font-size: 13px; border-radius: var(--radius-md);" onclick="handlers.nextMonth()">Siguiente <i class="fa-solid fa-chevron-right"></i></button>
                            </div>
                        </div>
                        
                        <div class="calendar-grid" style="grid-template-columns: repeat(7, 1fr); margin-bottom: 8px;">
                            ${dayLabels.map(d => `<div class="calendar-header-day">${d}</div>`).join('')}
                        </div>
                        
                        <div class="calendar-grid">
                            ${gridHtml}
                        </div>
                    `;
                } else {

                    const complete = filteredTasks.filter(t => t.completada);
                    
                    contentHtml = `
                        <div class="grid-2col">
                            <div>
                                <h3 style="margin-bottom: 16px;"><i class="fa-solid fa-circle-question" style="color: var(--accent-teal); margin-right: 8px;"></i> Pendientes (${incomplete.length})</h3>
                                <div class="task-list">
                                    ${incomplete.length ? incomplete.map(t => this._taskItem(t)).join('') : '<div class="empty-state">Todo al día</div>'}
                                </div>
                            </div>
                            <div>
                                <h3 style="margin-bottom: 16px; color: var(--text-secondary)"><i class="fa-solid fa-circle-check" style="color: var(--accent-teal); margin-right: 8px;"></i> Completadas (${complete.length})</h3>
                                <div class="task-list">
                                    ${complete.length ? complete.map(t => this._taskItem(t)).join('') : '<div class="empty-state">No hay tareas completadas bajo estos filtros</div>'}
                                </div>
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="page-header">
                        <h1 class="page-title">Gestor de Tareas</h1>
                        <button class="btn btn-primary" onclick="document.getElementById('edit-task-id').value=''; document.querySelector('#task-modal form').reset(); document.querySelector('#task-modal .modal-header h2').textContent='Nueva Tarea'; handlers.openModal('task-modal')">
                            <i class="fa-solid fa-plus"></i> Nueva Tarea
                        </button>
                    </div>
                    
                    ${filterBarHtml}
                    ${contentHtml}
                `;
            },

            _calendarCell(dateStr, dayNum, isOtherMonth, isToday) {
                const dayTasks = state.tasks.filter(t => {
                    const taskDateStr = t.fecha ? t.fecha.split('T')[0] : '';
                    const matchesDate = taskDateStr === dateStr;
                    
                    if (!matchesDate) return false;
                    
                    state.taskFilters = state.taskFilters || {
                        tipo: 'Todos',
                        prioridad: 'Todos',
                        planta: 'Todos',
                        estado: 'Todos'
                    };
                    
                    if (state.taskFilters.tipo !== 'Todos' && t.tipo !== state.taskFilters.tipo) return false;
                    if (state.taskFilters.prioridad !== 'Todos' && t.prioridad !== state.taskFilters.prioridad) return false;
                    if (state.taskFilters.planta !== 'Todos' && t.plantId !== state.taskFilters.planta) return false;
                    if (state.taskFilters.estado !== 'Todos' && t.completada !== (state.taskFilters.estado === 'Completadas')) return false;
                    
                    return true;
                });

        const handlers = {
            toggleSpaceFields(tipo) {
                const isSecado = tipo === 'secado';
                const isCurado = tipo === 'curado';
                const isCultivo = !isSecado && !isCurado;
                
                const divCultivo = document.getElementById('space-fields-cultivo');
                const divSecado = document.getElementById('space-fields-secado');
                const divCurado = document.getElementById('space-fields-curado');
                
                if (divCultivo) divCultivo.style.display = isCultivo ? 'block' : 'none';
                if (divSecado) divSecado.style.display = isSecado ? 'block' : 'none';
                if (divCurado) divCurado.style.display = isCurado ? 'block' : 'none';
                
                const reqCultivo = divCultivo ? divCultivo.querySelectorAll('[data-required]') : [];
                const reqSecado = divSecado ? divSecado.querySelectorAll('[data-required]') : [];
                const reqCurado = divCurado ? divCurado.querySelectorAll('[data-required]') : [];
                
                reqCultivo.forEach(el => el.required = isCultivo);
                reqSecado.forEach(el => el.required = isSecado);
                reqCurado.forEach(el => el.required = isCurado);
            },
            prevMonth() {
                if (state.calendarMonth === 0) {
                    state.calendarMonth = 11;
                    state.calendarYear--;
                } else {
                    state.calendarMonth--;
                }
                render.app();
            },
            nextMonth() {
                if (state.calendarMonth === 11) {
                    state.calendarMonth = 0;
                    state.calendarYear++;
                } else {
                    state.calendarMonth++;
                }
                render.app();
            },
            todayMonth() {

            handlePhotoUpload(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        // Comprimir la imagen para no romper el localStorage (max 5MB)
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600; // Resolución máxima
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.6); // 60% calidad
                        
                        document.getElementById('log-photo-data').value = dataUrl;
                        const preview = document.getElementById('log-photo-preview');
                        preview.src = dataUrl;
                        preview.style.display = 'block';
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            },

                state.selectedPlantId = id;
                window.location.hash = 'plant-detail';
            },

            async toggleTask(id) {
                const task = state.tasks.find(t => t.id === id);
                if(task) {
                    task.completada = !task.completada;
                    
                    // Si está enlazada a un plan event, sincronizar hacia atrás
                    if (task.planEventId) {
                        state.plans.forEach(plan => {
                            const ev = plan.events.find(e => e.id === task.planEventId);
                            if (ev) {
                                ev.completada = task.completada;
                            }
                        });
                    }

                    // Manejar la recurrencia al completar
                    if (task.completada && task.recurrencia && task.recurrencia !== 'puntual') {
                        const current = new Date(task.fecha + 'T12:00:00');
                        const next = new Date(current);
                        if (task.recurrencia === 'diario') {
                            next.setDate(current.getDate() + 1);
                        } else if (task.recurrencia === 'semanal') {
                            next.setDate(current.getDate() + 7);
                        } else if (task.recurrencia === 'quincenal') {
                            next.setDate(current.getDate() + 15);
                        } else if (task.recurrencia === 'mensual') {
                            next.setMonth(current.getMonth() + 1);
                        }
                        
                        const nextDateStr = next.toISOString().split('T')[0];
                        
                        const isDuplicate = state.tasks.some(t => 
                            t.titulo === task.titulo && 
                            t.fecha === nextDateStr && 
                            !t.completada && 
                            t.plantId === task.plantId
                        );
                        
                        if (!isDuplicate) {
                            state.tasks.unshift({
                                id: utils.generateId(),
                                titulo: task.titulo,
                                fecha: nextDateStr,
                                prioridad: task.prioridad,
                                tipo: task.tipo || 'otro',
                                recurrencia: task.recurrencia,
                                completada: false,
                                plantId: task.plantId || null
                            });
                        }
                    }

                    await saveState();
                    if(state.activeView === 'tasks' || state.activeView === 'dashboard') {
                        render.app();
                    }
                }
            },

            renderDashboardPlanPreview() {

                const listDiv = document.getElementById('cp-preview-list');

                listDiv.innerHTML = plan.map((item, index) => {
                    const taskDate = new Date(item.fecha);
                    // Íconos por tipo (heuristicos)
                    let icon = 'fa-check';
                    if(item.accion.toLowerCase().includes('trasplante')) icon = 'fa-arrow-right-arrow-left';
                    else if(item.accion.toLowerCase().includes('floración')) icon = 'fa-sun';
                    else if(item.accion.toLowerCase().includes('defoliación') || item.accion.toLowerCase().includes('poda')) icon = 'fa-scissors';
                    else if(item.accion.toLowerCase().includes('lavado') || item.accion.toLowerCase().includes('flush')) icon = 'fa-shower';
                    else if(item.accion.toLowerCase().includes('cosecha')) icon = 'fa-basket-shopping';
                    else if(item.accion.toLowerCase().includes('germinación')) icon = 'fa-seedling';
                    
                    return `
                        <div class="premium-timeline-item">
                            <div class="premium-timeline-date">${formatter.format(taskDate)}</div>

            async submitDashboardPlan() {
                const spaceId = document.getElementById('cp-wizard-space').value;
                const mode = document.getElementById('cp-plant-mode').value;
                const etapa = document.getElementById('cp-wizard-etapa').value;
                const fechaInicio = document.getElementById('cp-wizard-fecha').value || new Date().toISOString();
                const floracionSemanasInput = document.getElementById('cp-wizard-floracion-semanas');
                const floracionSemanas = floracionSemanasInput ? parseInt(floracionSemanasInput.value) || 8 : 8;
                
                let plantIdsToPlan = [];
                
                if (mode === 'existing') {
                    const checked = document.querySelectorAll('input[name="cpExistingPlants"]:checked');
                    checked.forEach(cb => plantIdsToPlan.push(cb.value));
                } else {
                    const cant = parseInt(document.getElementById('cp-new-cantidad').value) || 1;
                    const nombreBase = document.getElementById('cp-new-nombre').value;
                    const variedad = document.getElementById('cp-new-variedad').value;
                    const sistema = document.getElementById('cp-new-sistema').value;
                    
                    for (let i = 0; i < cant; i++) {
                        let nombrePlanta = nombreBase;
                        if (cant > 1) {
                            nombrePlanta = `${nombreBase} #${i + 1}`;
                        }
                        const pId = utils.generateId();
                        state.plants.unshift({ 
                            id: pId, 
                            nombre: nombrePlanta, 
                            variedad: variedad, 
                            etapa: etapa, 
                            sistema: sistema, 
                            spaceId: spaceId, 
                            fechaInicio: fechaInicio, 
                            floracionSemanas: floracionSemanas,
                            estado: 'activa' 
                        });
                        plantIdsToPlan.push(pId);
                    }
                }
                
                // Crear los planes y manejar sobreescritura si existe
                plantIdsToPlan.forEach(pId => {
                    const plant = state.plants.find(p => p.id === pId);
                    if (plant) {
                        plant.etapa = etapa; // Sincronizamos etapa inicial y fecha en plantas existentes tmb
                        plant.fechaInicio = fechaInicio;
                        plant.floracionSemanas = floracionSemanas;
                        
                        const existingPlanIndex = state.plans.findIndex(p => p.plantId === pId);
                        if (existingPlanIndex > -1) {
                            if (confirm(`La planta ${plant.nombre} ya tiene un plan. ¿Querés reemplazarlo?`)) {
                                state.plans.splice(existingPlanIndex, 1);
                                handlers.createPlanForPlant(pId);
                            }
                        } else {
                            handlers.createPlanForPlant(pId);
                        }
                    }
                });
                
                await saveState();
                handlers.closeModal(null, 'cultivation-plan-modal', true);
                
                // Redirigir a vista global de planes
                window.location.hash = 'planes';
                render.app();
            },
