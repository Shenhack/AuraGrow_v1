            async createPlanForPlant(plantId) {
                const plant = state.plants.find(p => p.id === plantId);
                if (!plant) return null;
                const existing = state.plans.find(p => p.plantId === plantId);
                if (existing) return existing;
                
                const events = utils.getPlanTemplate(plant.etapa, plant.fechaInicio, plant.floracionSemanas || 8);
                const planId = 'plan_' + Math.random().toString(36).substr(2, 9);
                const plan = {
                    id: planId,
                    plantId,
                    createdAt: new Date().toISOString().split('T')[0],
                    events
                };
                
                state.plans.push(plan);
                
                // Integración Plan -> Tareas
                events.forEach(ev => {
                    let taskTipo = 'otro';
                    const actLower = ev.accion.toLowerCase();
                    if (actLower.includes('riego') || actLower.includes('agua') || actLower.includes('lavado') || actLower.includes('flush')) {
                        taskTipo = 'riego';
                    } else if (actLower.includes('nutri') || actLower.includes('abono') || actLower.includes('fertil') || actLower.includes('floración')) {
                        taskTipo = 'nutricion';
                    } else if (actLower.includes('poda') || actLower.includes('defol') || actLower.includes('lst')) {
                        taskTipo = 'poda';
                    } else if (actLower.includes('cosecha') || actLower.includes('cortar')) {
                        taskTipo = 'cosecha';
                    } else if (actLower.includes('trasplante') || actLower.includes('mover')) {
                        taskTipo = 'trasplante';
                    } else if (actLower.includes('medicion') || actLower.includes('medir') || actLower.includes('ph') || actLower.includes('ec')) {
                        taskTipo = 'medicion';
                    }
                    
                    state.tasks.unshift({
                        id: utils.generateId(),
                        titulo: `${plant.nombre}: ${ev.accion}`,
                        fecha: ev.fecha,
                        prioridad: 'media',
                        tipo: taskTipo,
                        recurrencia: 'puntual',
                        completada: ev.completada || false,
                        plantId: plant.id,
                        planEventId: ev.id,
                        isPlan: true
                    });
                });
                
                await saveState();
                return plan;
            },

            async generatePlan(plantId) {
                await this.createPlanForPlant(plantId);
                render.app();
            },

            async regeneratePlan(plantId) {
                if (!confirm('¿Regenerar el plan? Se perderá el progreso actual.')) return;
                
                // Borrar tareas enlazadas al plan viejo
                const oldPlan = state.plans.find(p => p.plantId === plantId);
                if (oldPlan) {
                    const eventIds = oldPlan.events.map(e => e.id);
                    state.tasks = state.tasks.filter(t => !eventIds.includes(t.planEventId));
                }
                
                state.plans = state.plans.filter(p => p.plantId !== plantId);
                await this.createPlanForPlant(plantId);
                render.app();
            },

            async togglePlanEvent(planId, eventId, checked) {
                const plan = state.plans.find(p => p.id === planId);
                if (!plan) return;
                const ev = plan.events.find(e => e.id === eventId);
                if (ev) { 
                    ev.completada = checked; 
                    
                    // Sincronizar con la tarea correspondiente
                    const task = state.tasks.find(t => t.planEventId === eventId);
                    if (task) {
                        task.completada = checked;
                    }
                    
                    await saveState(); 
                }
                
                const container = document.getElementById('plan-tab-content');
                if (container) {
                    container.innerHTML = render.renderPlantPlanTab(plan.plantId);
                }
                if (state.activeView === 'planes') {
                    render.app();
                }
            },

                const plant = state.plants.find(p => p.id === plan.plantId);

                const plant = state.plants.find(p => p.id === plan.plantId);

            async quickLog(plantId, tipo) {
                // Si no se especifica plantId, buscar el selector de la barra de acciones rápidas
                if (!plantId) {
                    const select = document.getElementById('quick-action-plant-select');
                    if (select) {
                        plantId = select.value;
                    } else if (state.plants.filter(p => p.estado === 'activa').length === 1) {
                        plantId = state.plants.filter(p => p.estado === 'activa')[0].id;
                    }
                }
                
                if (!plantId) {
                    alert('Por favor, selecciona o crea una planta activa primero.');
                    return;
                }
                
                const plant = state.plants.find(p => p.id === plantId);
                if (!plant) return;
                
                let nota = '';
                let foto = '';
                
                if (tipo === 'Riego') {
                    nota = '[Volumen: 500ml, pH: 6.2, EC: 1.2] Riego rápido con agua pura y nutrientes base';
                } else if (tipo === 'Nutrientes') {
                    nota = '[Dosis: Fertilizantes de vegetación/floración en dosis moderada] Aplicación rápida de nutrientes';
                } else if (tipo === 'Poda') {
                    nota = 'Poda de mantenimiento y defoliación baja para mejorar penetración de luz';
                } else if (tipo === 'Medicion') {
                    const temp = 24.5;
                    const hum = 55;
                    const vpd = handlers.calcularVPD(temp, hum);
                    nota = `[Temp: ${temp}°C, Hum: ${hum}%, VPD: ${vpd}kPa] Lectura rápida de clima`;
                }
                
                const newLog = {
                    id: utils.generateId(),
                    plantId: plantId,
                    fecha: new Date().toISOString(),
                    tipo: tipo.toLowerCase(),
                    nota: nota,
                    foto: foto
                };
                
                state.logs.unshift(newLog);
                
                // Mostrar notificación toast
                utils.showToast(`¡Registro express de ${tipo} guardado para ${plant.nombre}!`);
                
                await saveState();
                render.app();
            },

            askAura(plantId) {
                const input = document.getElementById(`ai-chat-input-${plantId}`);
                const logBox = document.getElementById(`ai-chat-log-${plantId}`);
                if (!input || !input.value.trim() || !logBox) return;
                
                const question = input.value.trim();
                const plant = state.plants.find(p => p.id === plantId);
                if (!plant) return;
                
                // 1. Calcular contexto
                const plantLogs = state.logs.filter(l => l.plantId === plantId);
                const riegoLogs = plantLogs.filter(l => l.tipo === 'riego');
                let phSum = 0, phCount = 0;
                let ecSum = 0, ecCount = 0;
                
                riegoLogs.forEach(l => {
                    const phMatch = l.nota.match(/pH:\s*([0-9.]+)/i);
                    const ecMatch = l.nota.match(/EC:\s*([0-9.]+)/i);
                    if (phMatch) {
                        phSum += parseFloat(phMatch[1]);
                        phCount++;
                    }
                    if (ecMatch) {
                        ecSum += parseFloat(ecMatch[1]);
                        ecCount++;
                    }
                });
                
                const avgPh = phCount > 0 ? (phSum / phCount).toFixed(2) : 'N/A';
                const avgEc = ecCount > 0 ? (ecSum / ecCount).toFixed(2) : 'N/A';
                
                // Desvíos del VPD
                const medicionLogs = plantLogs.filter(l => l.tipo === 'medicion');
                let desviosCount = 0;
                medicionLogs.slice(0, 5).forEach(l => {
                    const vpdMatch = l.nota.match(/VPD:\s*([0-9.]+)kPa/i);
                    if (vpdMatch) {
                        const vpd = parseFloat(vpdMatch[1]);
                        const evaluation = handlers.evaluarClima(vpd, plant.etapa);
                        if (evaluation === 'var(--status-alert)' || evaluation === 'var(--status-critical)') {
                            desviosCount++;
                        }
                    }
                });
                
                const vpdText = desviosCount > 0 ? `${desviosCount} desvíos detectados` : 'Estable / Óptimo';
                
                // Formar payload
                const contextPayload = {
                    pregunta: question,
                    planta: plant.nombre,
                    etapa: plant.etapa,
                    promedioPh: avgPh,
                    promedioEc: avgEc,
                    estadoVpd: vpdText,
                    timestamp: new Date().toISOString()
                };
                
                console.log("AI Direct Context Payload:", contextPayload);
                
                // Mostrar respuesta simulada super interactiva
                logBox.style.display = 'block';
                logBox.innerHTML = `
                    <div style="font-size: 11px; text-transform: uppercase; color: var(--accent-teal); font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;">
                        <i class="fa-solid fa-microchip"></i> Contexto Enviado a la IA
                    </div>
                    <div style="font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.4); padding: 8px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); margin-bottom: 8px; word-break: break-all; line-height: 1.4;">
                        {<br>
                        &nbsp;&nbsp;"etapa": "${contextPayload.etapa}",<br>
                        &nbsp;&nbsp;"pH_promedio": "${contextPayload.promedioPh}",<br>
                        &nbsp;&nbsp;"EC_promedio": "${contextPayload.promedioEc}",<br>
                        &nbsp;&nbsp;"VPD_historico": "${contextPayload.estadoVpd}"<br>
                        }
                    </div>
                    <div style="font-size: 12px; color: var(--text-primary); line-height: 1.4;">
                        <strong>Aura responde:</strong> Para tu planta <em>${plant.nombre}</em> en etapa de <strong>${plant.etapa}</strong>, con un pH histórico promedio de <strong>${avgPh}</strong> y un VPD <strong>${vpdText.toLowerCase()}</strong>, te sugiero mantener ${plant.etapa === 'floración' ? 'la humedad en torno al 45-50% y los nutrientes en alta concentración de PK (Fósforo y Potasio)' : 'el fotoperiodo en 18/6 y la humedad relativa elevada al 60-70% para maximizar el crecimiento foliar'}. ¿Querés que simulemos un ajuste del plan?
                    </div>
                `;
                
                input.value = '';
            },

            async deletePlant(id) {
                const p = state.plants.find(plant => plant.id === id);
                if (!p) return;
                if (confirm(`¿Estás seguro de eliminar PERMANENTEMENTE la planta "${p.nombre}"?`)) {
                    state.plants = state.plants.filter(plant => plant.id !== id);
                    
                    state.logs = state.logs.filter(l => l.plantId !== id);
                    state.tasks = state.tasks.filter(t => t.plantId !== id);
                    state.plans = state.plans.filter(plan => plan.plantId !== id);
                    
                    if (state.selectedPlantId === id) {
                        state.selectedPlantId = null;
                        state.activeView = 'plants';
                    }
                    await saveState();
                    render.app();
                }
            },

            async submitForm(e, modalId) {
                e.preventDefault();
                const form = e.target;
                const data = Object.fromEntries(new FormData(form).entries());

                if (modalId === 'task-modal') {
                    if (state._editingTaskId) {
                        const task = state.tasks.find(t => t.id === state._editingTaskId);
                        if (task) {
                            task.titulo = data.titulo;
                            task.fecha = data.fecha;
                            task.prioridad = data.prioridad;
                            task.tipo = data.tipo || 'otro';
                            task.recurrencia = data.recurrencia || 'puntual';
                            task.plantId = data.plantId || null;
                            
                            // Si está enlazada a un plan event, sincronizar hacia atrás
                            if (task.planEventId) {
                                state.plans.forEach(plan => {
                                    const ev = plan.events.find(e => e.id === task.planEventId);
                                    if (ev) {
                                        const plantName = utils.getPlantName(task.plantId);
                                        let cleanAction = task.titulo;
                                        if (plantName && cleanAction.startsWith(`${plantName}: `)) {
                                            cleanAction = cleanAction.substring(plantName.length + 2);
                                        }
                                        ev.accion = cleanAction;
                                        ev.fecha = task.fecha;
                                        ev.tipo = task.tipo;
                                    }
                                });
                            }
                        }
                        state._editingTaskId = null;
                        document.querySelector('#task-modal .modal-header h2').textContent = 'Nueva Tarea';
                    } else {
                        state.tasks.unshift({ 
                            id: utils.generateId(), 
                            titulo: data.titulo, 
                            fecha: data.fecha, 
                            prioridad: data.prioridad, 
                            tipo: data.tipo || 'otro',
                            recurrencia: data.recurrencia || 'puntual',
                            completada: false, 
                            plantId: data.plantId || null 
                        });
                    }
                    await saveState();
                } else if (modalId === 'space-modal') {
                    if (!state.spaces) state.spaces = [];
                    
                    if (data.spaceId) {
                        // Editando existente
                        const space = state.spaces.find(s => s.id === data.spaceId);
                        if (space) {
                            space.nombre = data.nombre;
                            space.tipo = data.tipo;
                            
                            // Cultivo
                            space.sustrato = data.sustrato || '';
                            space.luz = data.luz || '';
                            space.m2 = data.m2 || '';
                            space.capacidad_cultivo = data.capacidad_cultivo || '';
                            space.extraccion_cultivo = data.extraccion_cultivo || '';
                            
                            // Secado
                            space.metodo_secado = data.metodo_secado || '';
                            space.capacidad_secado = data.capacidad_secado || '';
                            space.temp_obj_secado = data.temp_obj_secado || '';
                            space.hr_obj_secado = data.hr_obj_secado || '';
                            space.extraccion_secado = data.extraccion_secado || '';
                            space.modo_oscuro_secado = data.modo_oscuro_secado || '';
                            
                            // Curado
                            space.envase_curado = data.envase_curado || '';
                            space.capacidad_curado = data.capacidad_curado || '';
                            space.temp_obj_curado = data.temp_obj_curado || '';
                            space.hr_obj_curado = data.hr_obj_curado || '';
                        }
                    } else {
                        // Creando nuevo
                        const newSpaceId = utils.generateId();
                        state.spaces.push({ 
                            id: newSpaceId, 
                            nombre: data.nombre,
                            tipo: data.tipo,
                            
                            // Cultivo
                            sustrato: data.sustrato || '',
                            luz: data.luz || '',
                            m2: data.m2 || '',
                            capacidad_cultivo: data.capacidad_cultivo || '',
                            extraccion_cultivo: data.extraccion_cultivo || '',
                            
                            // Secado
                            metodo_secado: data.metodo_secado || '',
                            capacidad_secado: data.capacidad_secado || '',
                            temp_obj_secado: data.temp_obj_secado || '',
                            hr_obj_secado: data.hr_obj_secado || '',
                            extraccion_secado: data.extraccion_secado || '',
                            modo_oscuro_secado: data.modo_oscuro_secado || '',
                            
                            // Curado
                            envase_curado: data.envase_curado || '',
                            capacidad_curado: data.capacidad_curado || '',
                            temp_obj_curado: data.temp_obj_curado || '',
                            hr_obj_curado: data.hr_obj_curado || ''
                        });
                        state._lastCreatedSpaceId = newSpaceId;
                    }
                    render.setupModals();
                    await saveState();
                } else if (modalId === 'plant-modal') {
                    const cantidad = parseInt(data.cantidad) || 1;
                    const startMode = document.getElementById('wizard-start-mode') ? document.getElementById('wizard-start-mode').value : 'plant-only';
                    
                    for (let i = 0; i < cantidad; i++) {
                        let nombrePlanta = data.nombre;
                        if (cantidad > 1) {
                            nombrePlanta = `${data.nombre} #${i + 1}`;
                        }
                        
                        const nuevaPlantaId = utils.generateId();
                        state.plants.unshift({ 
                            id: nuevaPlantaId, 
                            nombre: nombrePlanta, 
                            variedad: data.variedad, 
                            etapa: data.etapa, 
                            sistema: data.sistema, 
                            spaceId: data.spaceId, 
                            sector: data.sector || 'Principal',
                            fechaInicio: data.fecha_inicio || new Date().toISOString(), 
                            floracionSemanas: parseInt(data.floracion_semanas) || 8,
                            estado: 'activa' 
                        });

                        // Generar plan
                        if (startMode === 'plant-plus-plan') {
                            handlers.createPlanForPlant(nuevaPlantaId);
                        }
                    }
                    render.setupModals();
                    await saveState();
                } else if (modalId === 'log-modal') {
                    const tipo = data.tipo;
                    let notaAdicional = data.nota || '';
                    
                    if (tipo === 'Riego') {
                        notaAdicional = `[Volumen: ${data.volumen_ml || 0}ml, pH: ${data.ph || '-'}, EC: ${data.ec || '-'}] ${notaAdicional}`;
                    } else if (tipo === 'Medicion') {
                        const vpd = handlers.calcularVPD(parseFloat(data.temperatura), parseFloat(data.humedad));
                        notaAdicional = `[Temp: ${data.temperatura}°C, Hum: ${data.humedad}%, VPD: ${vpd}kPa] ${notaAdicional}`;
                    } else if (tipo === 'Nutrientes') {
                        notaAdicional = `[Dosis: ${data.notas_nutrientes}] ${notaAdicional}`;
                    } else if (tipo === 'Cosecha') {
                        const espacio = state.spaces.find(s => s.id === data.cosecha_espacio_secado);
                        const espacioNombre = espacio ? espacio.nombre : 'Sin especificar';
                        notaAdicional = `[Cosecha: ${data.cosecha_peso_humedo_total || 0}g húmedos, ${data.cosecha_num_plantas || 1} plantas, Destino: ${espacioNombre}, Método: ${data.cosecha_metodo || '-'}] ${data.cosecha_notas_visuales || ''} ${notaAdicional}`;
                    } else if (tipo === 'Inicio Secado') {
                        const espacio = state.spaces.find(s => s.id === data.secado_espacio);
                        const espacioNombre = espacio ? espacio.nombre : 'Sin especificar';
                        notaAdicional = `[Inicio Secado: ${data.secado_peso_humedo || 0}g, Obj: ${data.secado_temp_obj || '-'}°C / ${data.secado_hr_obj || '-'}% HR, Sistema: ${data.secado_sistema || '-'}, Espacio: ${espacioNombre}] ${notaAdicional}`;
                    } else if (tipo === 'Control Secado') {
                        let perdidaStr = '';
                        const pesoActual = parseFloat(data.control_secado_peso_actual);
                        if (!isNaN(pesoActual)) {
                            const logsPlant = state.logs.filter(l => l.plantId === data.plantId);
                            let pesoInicial = null;
                            const secadoLog = logsPlant.find(l => l.tipo === 'inicio secado' && l.secado_peso_humedo);
                            if (secadoLog) {
                                pesoInicial = parseFloat(secadoLog.secado_peso_humedo);
                            } else {
                                const cosechaLog = logsPlant.find(l => l.tipo === 'cosecha' && l.cosecha_peso_humedo_total);
                                if (cosechaLog) {
                                    pesoInicial = parseFloat(cosechaLog.cosecha_peso_humedo_total);
                                }
                            }
                            if (pesoInicial && pesoInicial > 0) {
                                const perdida = ((pesoInicial - pesoActual) / pesoInicial) * 100;
                                perdidaStr = `, Pérdida agua: ${perdida.toFixed(1)}%`;
                            }
                        }
                        notaAdicional = `[Control Secado: ${data.control_secado_temp || '-'}°C, ${data.control_secado_hr || '-'}% HR, Día ${data.control_secado_dias || 0}, Peso: ${data.control_secado_peso_actual || 0}g${perdidaStr}, Estado: ${data.control_secado_estado || '-'}] ${data.control_secado_notas || ''} ${notaAdicional}`;
                    } else if (tipo === 'Inicio Curado') {
                        let rendStr = '';
                        const pesoSeco = parseFloat(data.curado_peso_seco_final);
                        if (!isNaN(pesoSeco)) {
                            const logsPlant = state.logs.filter(l => l.plantId === data.plantId);
                            let pesoInicial = null;
                            const secadoLog = logsPlant.find(l => l.tipo === 'inicio secado' && l.secado_peso_humedo);
                            if (secadoLog) {
                                pesoInicial = parseFloat(secadoLog.secado_peso_humedo);
                            } else {
                                const cosechaLog = logsPlant.find(l => l.tipo === 'cosecha' && l.cosecha_peso_humedo_total);
                                if (cosechaLog) {
                                    pesoInicial = parseFloat(cosechaLog.cosecha_peso_humedo_total);
                                }
                            }
                            if (pesoInicial && pesoInicial > 0) {
                                const rend = (pesoSeco / pesoInicial) * 100;
                                rendStr = `, Rendimiento: ${rend.toFixed(1)}% peso húmedo`;
                            }
                        }
                        notaAdicional = `[Inicio Curado: ${data.curado_peso_seco_final || 0}g seco${rendStr}, Envase: ${data.curado_recipiente || '-'} x${data.curado_cantidad_recipientes || 1}, HR Obj: ${data.curado_hr_objetivo || '-'}%] ${notaAdicional}`;
                    } else if (tipo === 'Control Curado') {
                        notaAdicional = `[Control Curado: ${data.control_curado_hr || '-'}% HR frasco, ${data.control_curado_temp || '-'}°C, Burp: ${data.control_curado_burpeo || '-'}, Organoléptico: ${data.control_curado_notas_organolepticas || '-'}] ${notaAdicional}`;
                    } else if (tipo === 'Punto Final') {
                        let rendStr = '';
                        const pesoCured = parseFloat(data.punto_final_peso_cured);
                        if (!isNaN(pesoCured)) {
                            const logsPlant = state.logs.filter(l => l.plantId === data.plantId);
                            let numPlantas = 1;
                            const cosechaLog = logsPlant.find(l => l.tipo === 'cosecha' && l.cosecha_num_plantas);
                            if (cosechaLog) {
                                numPlantas = parseInt(cosechaLog.cosecha_num_plantas) || 1;
                            }
                            const rendPlanta = pesoCured / numPlantas;
                            rendStr = `, Rendimiento total: ${pesoCured.toFixed(1)}g, Rend/Planta: ${rendPlanta.toFixed(1)}g/planta`;
                        }
                        notaAdicional = `[Punto Final: Calificación: ${data.punto_final_calificacion || 0}/10${rendStr}] ${data.punto_final_notas || ''} ${notaAdicional}`;
                    }

                    const isBatch = (data.plantId === 'BATCH' || document.getElementById('log_planta_id').disabled);
                    const plantIds = isBatch ? (state.batchPlantIds || []) : [data.plantId];
                    
                    plantIds.forEach(pId => {
                        state.logs.unshift({ 
                            id: utils.generateId(), 
                            plantId: pId, 
                            tipo: tipo.toLowerCase(), 
                            fecha: new Date().toISOString(), 
                            nota: notaAdicional,
                            foto: data.fotoData || null,
                            ...data
                        });
                    });

                    // Reset Batch State
                    document.getElementById('log_planta_id').disabled = false;
                    state.batchPlantIds = [];
                    const optBatch = document.getElementById('opt-batch');
                    if (optBatch) optBatch.remove();
                    // Limpiar el preview para el proximo uso
                    document.getElementById('log-photo-data').value = '';
                    document.getElementById('log-photo-preview').style.display = 'none';
                    document.getElementById('log-photo-preview').src = '';
                    await saveState();
                } else if (modalId === 'move-plant-modal') {
                    const plant = state.plants.find(p => p.id === state.selectedPlantId);
                    if (plant) {
                        plant.spaceId = data.spaceId;
                        plant.etapa = data.etapa;
                        plant.sector = data.sector || 'Principal';
                        await saveState();
                    }
                } else if (modalId === 'metric-modal') {
                    const temp = parseFloat(data.temperatura);
                    const hum = parseFloat(data.humedad);
                    const vpd = (temp && hum) ? handlers.calcularVPD(temp, hum) : '0.00';
                    const record = {
                        id: data.metricId || utils.generateId(),
                        fecha: new Date().toISOString(),
                        zona: data.zona || 'General',
                        temperatura: temp || 0,
                        humedad: hum || 0,
                        vpd: vpd,
                        ph: parseFloat(data.ph) || 0,
                        ec: parseFloat(data.ec) || 0,
                        dli: parseInt(data.dli) || 0,
                        tempAgua: parseFloat(data.tempAgua) || 0
                    };
                    if (data.metricId) {
                        const idx = state.envRecords.findIndex(e => e.id === data.metricId);
                        if (idx !== -1) state.envRecords[idx] = record;
                    } else {
                        state.envRecords.unshift(record);
                    }
                    document.getElementById('edit-metric-id').value = '';
                    await saveState();
                } else if (modalId === 'plan-event-modal') {
                    const plan = state.plans.find(p => p.id === data.planId);
                    if (plan) {
                        const eventData = {
                            id: data.eventId || 'ev_' + Math.random().toString(36).substr(2, 9),
                            dia: parseInt(data.dia) || 0,
                            accion: data.accion,
                            tipo: data.tipo,
                            fecha: data.fecha,
                            completada: data.eventId ? (plan.events.find(e => e.id === data.eventId)?.completada || false) : false
                        };
                        
                        if (data.eventId) {
                            const idx = plan.events.findIndex(e => e.id === data.eventId);
                            if (idx !== -1) {
                                plan.events[idx] = eventData;
                            }
                            
                            // Sincronizar tarea existente
                            const task = state.tasks.find(t => t.planEventId === data.eventId);
                            if (task) {
                                const plant = state.plants.find(p => p.id === plan.plantId);
                                const plantName = plant ? plant.nombre : 'Planta';
                                task.titulo = `${plantName}: ${eventData.accion}`;
                                task.fecha = eventData.fecha;
                                
                                let taskTipo = 'otro';
                                const actLower = eventData.accion.toLowerCase();
                                if (actLower.includes('riego') || actLower.includes('agua') || actLower.includes('lavado') || actLower.includes('flush')) {
                                    taskTipo = 'riego';
                                } else if (actLower.includes('nutri') || actLower.includes('abono') || actLower.includes('fertil') || actLower.includes('floración')) {
                                    taskTipo = 'nutricion';
                                } else if (actLower.includes('poda') || actLower.includes('defol') || actLower.includes('lst')) {
                                    taskTipo = 'poda';
                                } else if (actLower.includes('cosecha') || actLower.includes('cortar')) {
                                    taskTipo = 'cosecha';
                                } else if (actLower.includes('trasplante') || actLower.includes('mover')) {
                                    taskTipo = 'trasplante';
                                } else if (actLower.includes('medicion') || actLower.includes('medir') || actLower.includes('ph') || actLower.includes('ec')) {
                                    taskTipo = 'medicion';
                                }
                                task.tipo = taskTipo;
                            }
                        } else {
                            plan.events.push(eventData);
                            
                            // Crear nueva tarea
                            const plant = state.plants.find(p => p.id === plan.plantId);
                            const plantName = plant ? plant.nombre : 'Planta';
                            
                            let taskTipo = 'otro';
                            const actLower = eventData.accion.toLowerCase();
                            if (actLower.includes('riego') || actLower.includes('agua') || actLower.includes('lavado') || actLower.includes('flush')) {
                                taskTipo = 'riego';
                            } else if (actLower.includes('nutri') || actLower.includes('abono') || actLower.includes('fertil') || actLower.includes('floración')) {
                                taskTipo = 'nutricion';
                            } else if (actLower.includes('poda') || actLower.includes('defol') || actLower.includes('lst')) {
                                taskTipo = 'poda';
                            } else if (actLower.includes('cosecha') || actLower.includes('cortar')) {
                                taskTipo = 'cosecha';
                            } else if (actLower.includes('trasplante') || actLower.includes('mover')) {
                                taskTipo = 'trasplante';
                            } else if (actLower.includes('medicion') || actLower.includes('medir') || actLower.includes('ph') || actLower.includes('ec')) {
                                taskTipo = 'medicion';
                            }
                            
                            state.tasks.unshift({
                                id: utils.generateId(),
                                titulo: `${plantName}: ${eventData.accion}`,
                                fecha: eventData.fecha,
                                prioridad: 'media',
                                tipo: taskTipo,
                                recurrencia: 'puntual',
                                completada: false,
                                plantId: plan.plantId,
                                planEventId: eventData.id,
                                isPlan: true
                            });
                        }
                        
                        plan.events.sort((a, b) => a.dia - b.dia);
                        await saveState();
                    }
                } else if (modalId === 'edit-plan-modal') {
                    const plan = state.plans.find(p => p.id === data.planId);
                    if (plan) {
                        const plant = state.plants.find(p => p.id === plan.plantId);
                        if (plant) {
                            const oldStart = new Date(plant.fechaInicio.split('T')[0]);
                            const newStart = new Date(data.fechaInicio);
                            const diffTime = newStart - oldStart;
                            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
                            
                            const originalTime = plant.fechaInicio.includes('T') ? plant.fechaInicio.split('T')[1] : '12:00:00';
                            plant.fechaInicio = data.fechaInicio + 'T' + originalTime;
                            
                            if (diffDays !== 0) {
                                plan.events.forEach(ev => {
                                    const evDate = new Date(ev.fecha);
                                    evDate.setDate(evDate.getDate() + diffDays);
                                    ev.fecha = evDate.toISOString().split('T')[0];
                                    
                                    // Sincronizar tarea correspondiente
                                    const task = state.tasks.find(t => t.planEventId === ev.id);
                                    if (task) {
                                        task.fecha = ev.fecha;
                                    }
                                });
                            }
                            
                            await saveState();
                        }
                    }
                }

                form.reset();
                this.closeModal(null, modalId, true);
                // Reset modal titles for next use
                if (modalId === 'metric-modal') {
                    document.querySelector('#metric-modal .modal-header h2').textContent = 'Registrar Medición';
                }
                if (modalId === 'task-modal') {
                    document.querySelector('#task-modal .modal-header h2').textContent = 'Nueva Tarea';
                }
                render.app();

                if (modalId === 'space-modal' && state._wizardReturn) {
                    state._wizardReturn = false;
                    setTimeout(() => handlers.openCultivationPlanModal(), 50);
                }
            },

            exportarDatos() {
                const dataStr = JSON.stringify(state, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `auragrow_backup_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
            },

            importarDatos(event) {
                const file = event.target.files[0];
                if (!file) return;

                if (confirm("⚠️ ADVERTENCIA CRÍTICA: Vas a importar un archivo de respaldo. Esto BORRARÁ e intercambiará TODO tu cultivo actual. ¿Estás absolutamente seguro?")) {
                    const reader = new FileReader();
                    reader.onload = async function(e) {
                        try {
                            const parsed = JSON.parse(e.target.result);
                            if (parsed && (parsed.plants || parsed.spaces)) {
                                Object.assign(state, parsed);
                                await saveState();
                                alert("✅ Datos importados correctamente. La aplicación se recargará.");
                                location.reload();
                            } else {
                                alert("❌ El archivo no parece ser un respaldo válido de AuraGrow.");
                            }
                        } catch (error) {
                            alert("❌ Error al leer el archivo JSON.");
                        }
                    };
                    reader.readAsText(file);
                }
                event.target.value = "";
            },

                    // Resetear el estado en memoria a colecciones vacías

                    state.plants = [];
                    state.logs = [];

                    state.envRecords = [];

            handleSearch(e) {
                const query = e.target.value.toLowerCase().trim();
                const dropdown = document.getElementById('search-results');
                
                if (query.length < 2) {
                    dropdown.style.display = 'none';
                    return;
                }

                let resultsHtml = '';
                let hasResults = false;

                // Search Plants
                const foundPlants = state.plants.filter(p => p.nombre.toLowerCase().includes(query) || p.variedad.toLowerCase().includes(query));
                if (foundPlants.length > 0) {
                    hasResults = true;
                    foundPlants.forEach(p => {
                        resultsHtml += `
                        <div class="search-result-item" onclick="handlers.viewPlantDetail('${p.id}'); document.getElementById('search-results').style.display='none'; document.getElementById('global-search').value='';">
                            <div class="search-result-icon"><i class="fa-solid fa-seedling"></i></div>
                            <div class="search-result-text">
                                <h4>${p.nombre}</h4>
                                <p>Planta • ${p.variedad}</p>
                            </div>
                        </div>`;
                    });
                }

                // Search Spaces
                const foundSpaces = state.spaces.filter(s => s.nombre.toLowerCase().includes(query));
                if (foundSpaces.length > 0) {
                    hasResults = true;
                    foundSpaces.forEach(s => {
                        resultsHtml += `
                        <div class="search-result-item" onclick="window.location.hash='plants'; handlers.viewSpace('${s.id}'); document.getElementById('search-results').style.display='none'; document.getElementById('global-search').value='';">
                            <div class="search-result-icon" style="color: var(--accent-blue); background: var(--status-info-dim);"><i class="fa-solid fa-layer-group"></i></div>
                            <div class="search-result-text">
                                <h4>${s.nombre}</h4>
                                <p>Espacio</p>
                            </div>
                        </div>`;
                    });
                }

                // Search Tasks
                const foundTasks = state.tasks.filter(t => t.titulo.toLowerCase().includes(query));
                if (foundTasks.length > 0) {
                    hasResults = true;
                    foundTasks.forEach(t => {
                        resultsHtml += `
                        <div class="search-result-item" onclick="window.location.hash='tasks'; document.getElementById('search-results').style.display='none'; document.getElementById('global-search').value='';">
                            <div class="search-result-icon" style="color: var(--status-alert); background: var(--status-alert-dim);"><i class="fa-solid fa-check"></i></div>
                            <div class="search-result-text">
                                <h4>${t.titulo}</h4>
                                <p>Tarea</p>
                            </div>
                        </div>`;
                    });
                }

                if (!hasResults) {
                    resultsHtml = `<div style="padding: 16px; text-align: center; color: var(--text-secondary); font-size: 13px;">No se encontraron resultados para "${query}".</div>`;
                }

                dropdown.innerHTML = resultsHtml;
                dropdown.style.display = 'block';
            },

                document.getElementById('fields-riego').style.display = tipo === 'Riego' ? 'block' : 'none';
                document.getElementById('fields-medicion').style.display = tipo === 'Medicion' ? 'block' : 'none';

                document.getElementById('fields-control-secado').style.display = tipo === 'Control Secado' ? 'block' : 'none';
                document.getElementById('fields-inicio-curado').style.display = tipo === 'Inicio Curado' ? 'block' : 'none';
                document.getElementById('fields-control-curado').style.display = tipo === 'Control Curado' ? 'block' : 'none';
                document.getElementById('fields-punto-final').style.display = tipo === 'Punto Final' ? 'block' : 'none';

                // Set default dates if empty
                const todayStr = new Date().toISOString().split('T')[0];
                if (tipo === 'Cosecha' && !document.getElementById('cosecha_fecha_corte').value) {
                    document.getElementById('cosecha_fecha_corte').value = todayStr;
                }
                if (tipo === 'Inicio Secado' && !document.getElementById('secado_fecha_inicio').value) {
                    document.getElementById('secado_fecha_inicio').value = todayStr;
                }
                if (tipo === 'Inicio Curado' && !document.getElementById('curado_fecha_jarring').value) {
                    document.getElementById('curado_fecha_jarring').value = todayStr;
                }
            },

            calcularPerdidaAguaSecado() {
                const pId = document.getElementById('log_planta_id').value;
                const pesoActual = parseFloat(document.getElementById('control_secado_peso_actual').value);
                const indicator = document.getElementById('perdida-agua-secado-indicator');
                const valueSpan = document.getElementById('perdida-agua-secado-value');
                const initialSpan = document.getElementById('perdida-agua-inicial-value');
                
                if (isNaN(pesoActual) || !pId) {
                    indicator.style.display = 'none';
                    return;
                }

                // Buscar peso húmedo inicial en Cosecha o Inicio Secado de esta planta
                const logsPlant = state.logs.filter(l => l.plantId === pId);
                let pesoInicial = null;

                const secadoLog = logsPlant.find(l => l.tipo === 'inicio secado' && l.secado_peso_humedo);
                if (secadoLog) {
                    pesoInicial = parseFloat(secadoLog.secado_peso_humedo);
                } else {
                    const cosechaLog = logsPlant.find(l => l.tipo === 'cosecha' && l.cosecha_peso_humedo_total);
                    if (cosechaLog) {
                        pesoInicial = parseFloat(cosechaLog.cosecha_peso_humedo_total);
                    }
                }

                if (pesoInicial && pesoInicial > 0) {
                    const perdida = ((pesoInicial - pesoActual) / pesoInicial) * 100;
                    initialSpan.textContent = pesoInicial.toFixed(1);
                    valueSpan.textContent = perdida.toFixed(1);
                    indicator.style.display = 'block';
                } else {
                    indicator.style.display = 'none';
                }
            },

            calcularRendimientoCurado() {
                const pId = document.getElementById('log_planta_id').value;
                const pesoSeco = parseFloat(document.getElementById('curado_peso_seco_final').value);
                const indicator = document.getElementById('rendimiento-curado-indicator');
                const valueSpan = document.getElementById('rendimiento-curado-value');

                if (isNaN(pesoSeco) || !pId) {
                    indicator.style.display = 'none';
                    return;
                }

                // Buscar peso húmedo inicial
                const logsPlant = state.logs.filter(l => l.plantId === pId);
                let pesoInicial = null;

                const secadoLog = logsPlant.find(l => l.tipo === 'inicio secado' && l.secado_peso_humedo);
                if (secadoLog) {
                    pesoInicial = parseFloat(secadoLog.secado_peso_humedo);
                } else {
                    const cosechaLog = logsPlant.find(l => l.tipo === 'cosecha' && l.cosecha_peso_humedo_total);
                    if (cosechaLog) {
                        pesoInicial = parseFloat(cosechaLog.cosecha_peso_humedo_total);
                    }
                }

                if (pesoInicial && pesoInicial > 0) {
                    const rendimiento = (pesoSeco / pesoInicial) * 100;
                    valueSpan.textContent = rendimiento.toFixed(1);
                    indicator.style.display = 'block';
                } else {
                    indicator.style.display = 'none';
                }
            },

            calcularRendimientoFinal() {
                const pId = document.getElementById('log_planta_id').value;
                const pesoCured = parseFloat(document.getElementById('punto_final_peso_cured').value);
                const indicator = document.getElementById('rendimiento-final-indicator');
                const totalSpan = document.getElementById('rendimiento-final-total-value');
                const porPlantaSpan = document.getElementById('rendimiento-final-por-planta-value');

                if (isNaN(pesoCured) || !pId) {
                    indicator.style.display = 'none';
                    return;
                }

                // Calcular rendimiento por planta
                const logsPlant = state.logs.filter(l => l.plantId === pId);
                let numPlantas = 1;
                const cosechaLog = logsPlant.find(l => l.tipo === 'cosecha' && l.cosecha_num_plantas);
                if (cosechaLog) {
                    numPlantas = parseInt(cosechaLog.cosecha_num_plantas) || 1;
                }

                const rendimientoPlanta = pesoCured / numPlantas;
                totalSpan.textContent = pesoCured.toFixed(1);
                porPlantaSpan.textContent = rendimientoPlanta.toFixed(1);
                indicator.style.display = 'block';
            },

            calcularVPD(temp, hum) {
                if (!temp || !hum) return 0;
                const svp = 0.61078 * Math.exp((17.27 * temp) / (temp + 237.3));
                const vpd = svp * (1 - (hum / 100));
                return parseFloat(vpd.toFixed(2));
            },

            evaluarClima(vpd, etapa) {
                let minOptimo, maxOptimo;
                const etapaStr = etapa ? etapa.toLowerCase() : '';

                if (etapaStr.includes('floración') || etapaStr.includes('floracion')) {
                    minOptimo = 1.2;
                    maxOptimo = 1.5;
                } else {
                    minOptimo = 0.8;
                    maxOptimo = 1.2;
                }

                if (vpd >= minOptimo && vpd <= maxOptimo) {
                    return 'var(--status-optimal)';
                } else if (vpd >= (minOptimo - 0.2) && vpd <= (maxOptimo + 0.2)) {
                    return 'var(--status-alert)';
                } else {
                    return 'var(--status-critical)';
                }
            },

            actualizarSemaforoVPD() {
                const tempInput = document.getElementById('log_temp');
                const humInput = document.getElementById('log_hum');
                const plantaId = document.getElementById('log_planta_id').value;
                const vpdIndicator = document.getElementById('vpd-indicator');
                const vpdValue = document.getElementById('vpd-value');

                if (!tempInput || !humInput) return;

                const temp = parseFloat(tempInput.value);
                const hum = parseFloat(humInput.value);
                
                // Buscar etapa de la planta seleccionada
                const planta = state.plants.find(p => p.id === plantaId);
                const etapa = planta ? planta.etapa : 'vegetativo';

                if (!isNaN(temp) && !isNaN(hum)) {
                    const vpd = handlers.calcularVPD(temp, hum);
                    const colorHex = handlers.evaluarClima(vpd, etapa);

                    vpdIndicator.style.display = 'block';
                    vpdValue.textContent = vpd;
                    
                    vpdIndicator.style.color = colorHex;
                    vpdIndicator.style.border = `1px solid ${colorHex}`;
                    vpdIndicator.style.backgroundColor = colorHex === 'var(--status-optimal)' ? 'var(--status-optimal-dim)' : 
                                                        colorHex === 'var(--status-alert)' ? 'var(--status-alert-dim)' : 
                                                        'var(--status-critical-dim)';
                    
                    tempInput.style.borderColor = colorHex;
                    humInput.style.borderColor = colorHex;
                } else {
                    vpdIndicator.style.display = 'none';
                    tempInput.style.borderColor = 'var(--border-color)';
                    humInput.style.borderColor = 'var(--border-color)';
                }
            }
        };

        /* =========================================================================
           6. ROUTER
           ========================================================================= */
        const router = {
            handleHashChange() {
                let hash = window.location.hash.replace('#', '') || 'dashboard';
                if(hash.startsWith('plant-detail')) hash = 'plant-detail';
                
                const validRoutes = ['dashboard', 'plants', 'log', 'tasks', 'planes', 'metrics', 'plant-detail', 'aura-chat', 'settings'];
                
                if (validRoutes.includes(hash)) {
                    state.activeView = hash;
                    render.app();
                } else {
                    window.location.hash = 'dashboard';
                }

                // Close mobile sidebar on navigation
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebar-overlay').classList.remove('active');
            },
            
            init() {
                window.addEventListener('hashchange', this.handleHashChange);
                // Trigger initial route
                this.handleHashChange();
            }
        };

        /* =========================================================================
           7. INIT
           ========================================================================= */
        async function initApp() {
            const hadData = await loadState();
            if (!hadData) loadSeedData();
            initPWA();
            render.setupModals();
            router.init();

            // Event Listeners for UI
            document.getElementById('theme-toggle').addEventListener('click', handlers.toggleTheme);
            document.getElementById('menu-toggle').addEventListener('click', handlers.toggleSidebar);
            document.getElementById('sidebar-overlay').addEventListener('click', handlers.toggleSidebar);
            
            // Global Escape key handler for modals
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal-overlay.active').forEach(modal => {
                        modal.classList.remove('active');
                    });
                    const dropdown = document.getElementById('search-results');
                    if (dropdown) dropdown.style.display = 'none';
                }
            });

            // Search Handlers
            const searchInput = document.getElementById('global-search');
            if (searchInput) {
                searchInput.addEventListener('input', handlers.handleSearch);
                searchInput.addEventListener('focus', handlers.handleSearch);
            }

            // Close search dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.header-search') && !e.target.closest('.search-results-dropdown')) {
                    const dropdown = document.getElementById('search-results');
                    if (dropdown) dropdown.style.display = 'none';
                }
            });
        }

        // Boot the application
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
