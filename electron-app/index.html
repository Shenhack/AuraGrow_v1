<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraGrow | Gestión de Cultivo Profesional</title>
    
    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <style>
        /* === CSS VARIABLES === */
        :root, [data-theme="dark"], [data-theme="light"] {
            /* Color Palette (Cyan Neon default) */
            --bg-main: #000000;
            --bg-surface: rgba(5, 5, 5, 0.65);
            --bg-surface-hover: rgba(16, 16, 16, 0.8);
            --bg-surface-active: rgba(25, 25, 25, 0.9);
            
            --border-color: rgba(255, 255, 255, 0.06);
            --border-light: rgba(255, 255, 255, 0.12);
            
            --text-primary: #f8f8f8;
            --text-secondary: #a1a1aa;
            
            --accent-teal: #00ffcc;
            --accent-teal-hover: #33ffdd;
            --accent-teal-dim: rgba(0, 255, 204, 0.15);
            
            --status-optimal: #00ffcc;
            --status-optimal-dim: rgba(0, 255, 204, 0.15);
            --status-alert: #f59e0b;
            --status-alert-dim: rgba(245, 158, 11, 0.15);
            --status-critical: #ef4444;
            --status-critical-dim: rgba(239, 68, 68, 0.15);
            --status-info: #3b82f6;
            --status-info-dim: rgba(59, 130, 246, 0.15);
            
            /* Geometry */
            --radius-sm: 4px;
            --radius-md: 4px;
            --radius-lg: 4px;
            --radius-pill: 9999px;
            
            /* Typography */
            --font-main: 'Outfit', system-ui, sans-serif;
            --font-mono: 'Roboto Mono', monospace;
            
            /* Layout */
            --sidebar-width: 280px;
            --topbar-height: 80px;
            --transition-speed: 0.3s;
            
            /* Effects */
            --shadow-card: 0 8px 32px rgba(0,0,0,0.5);
            --shadow-modal: 0 20px 50px rgba(0, 0, 0, 0.8);
            --shadow-glow: 0 0 20px rgba(0, 255, 204, 0.15);
        }

        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main);
        }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            overflow: hidden;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            position: relative;
        }

        /* CRT Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(0, 255, 204, 0.02), rgba(0, 255, 0, 0.01), rgba(255, 0, 127, 0.02));
            z-index: 9999;
            background-size: 100% 4px, 4px 100%;
            pointer-events: none;
            opacity: 0.4;
        }

        a { text-decoration: none; color: inherit; }
        button, input, select, textarea { font-family: inherit; font-size: inherit; }
        button { cursor: pointer; border: none; background: transparent; }
        
        /* === LAYOUT === */
        .app-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar Glassmorphism */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(5, 5, 5, 0.6) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            z-index: 40;
            transition: transform var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 150px;
            background: radial-gradient(circle at top left, rgba(0, 255, 204, 0.08), transparent 70%);
            pointer-events: none;
        }

        .brand {
            height: var(--topbar-height);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(3, 3, 3, 0.4);
            backdrop-filter: blur(8px);
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 8px var(--accent-teal));
        }
        
        .brand:hover .brand-logo {
            transform: scale(1.05);
            filter: drop-shadow(0 0 12px var(--accent-teal));
        }

        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .brand-name span {
            color: var(--accent-teal);
            font-weight: 300;
        }

        .nav-menu {
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .nav-item:hover {
            color: var(--text-primary);
            background-color: var(--bg-surface-hover);
            border-color: rgba(255, 255, 255, 0.04);
        }

        .nav-item.active {
            color: var(--accent-teal);
            background-color: var(--accent-teal-dim);
            border-color: rgba(0, 255, 204, 0.25);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.05);
        }
        
        .nav-item i { width: 20px; text-align: center; }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-speed);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

        .topbar {
            height: var(--topbar-height);
            background: rgba(5, 5, 5, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 10;
            position: sticky;
            top: 0;
        }

        .header-search {
            display: flex;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 8px 16px;
            width: 300px;
            transition: var(--transition-speed);
        }

        .header-search:focus-within {
            border-color: var(--accent-teal);
            box-shadow: 0 0 10px var(--accent-teal-dim);
        }

        .header-search input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            outline: none;
            margin-left: 10px;
            width: 100%;
            font-family: var(--font-main);
        }

        .search-results-dropdown {
            position: absolute;
            top: calc(var(--topbar-height) - 10px);
            left: 40px;
            width: 400px;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-modal);
            max-height: 400px;
            overflow-y: auto;
            z-index: 50;
            display: none;
            padding: 8px 0;
            backdrop-filter: blur(12px);
        }

        .search-result-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid var(--border-color);
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover { background: var(--bg-surface-hover); }
        .search-result-icon { width: 32px; height: 32px; border-radius: 4px; background: var(--accent-teal-dim); color: var(--accent-teal); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .search-result-text { flex: 1; min-width: 0; }
        .search-result-text h4 { font-size: 14px; margin-bottom: 2px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .search-result-text p { font-size: 12px; color: var(--text-secondary); margin: 0; }

        .menu-toggle {
            display: none;
            font-size: 20px;
            color: var(--text-primary);
            padding: 8px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .btn-icon:hover {
            background-color: var(--bg-surface-hover);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .view-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
        }

        /* === ANIMATIONS === */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-view { animation: fadeIn 0.4s ease-out forwards; }

        /* === COMPONENTS === */
        h1, h2, h3 { font-weight: 700; color: var(--text-primary); }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-title { font-size: 24px; letter-spacing: -0.01em; text-transform: uppercase; font-family: var(--font-mono); }
        .section-title { font-size: 14px; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }

        /* Buttons with kinetics */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 13px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: 1px solid transparent;
            text-transform: uppercase;
            font-family: var(--font-mono);
            letter-spacing: 0.02em;
        }
        .btn-primary { background-color: var(--accent-teal); color: #000000; font-weight: 700; box-shadow: 0 0 10px var(--accent-teal-dim); }
        .btn-primary:hover { background-color: var(--accent-teal-hover); box-shadow: 0 0 20px var(--accent-teal); transform: translateY(-2px); }
        .btn-outline { background-color: transparent; border-color: var(--border-color); color: var(--text-primary); }
        .btn-outline:hover { background-color: var(--bg-surface-hover); border-color: var(--accent-teal); color: var(--accent-teal); }
        .btn:active { transform: scale(0.95); }

        /* HUD Scientific Cards */
        .card {
            background: rgba(5, 5, 5, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            padding: 24px;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: relative;
            transition: border-color var(--transition-speed), box-shadow var(--transition-speed);
        }
        .card::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            width: 12px; height: 12px;
            border-top: 2px solid var(--accent-teal);
            border-left: 2px solid var(--accent-teal);
            border-top-left-radius: 2px;
            pointer-events: none;
            transition: all var(--transition-speed);
            filter: drop-shadow(0 0 3px var(--accent-teal));
        }
        .card::after {
            content: '';
            position: absolute;
            bottom: -1px; right: -1px;
            width: 12px; height: 12px;
            border-bottom: 2px solid var(--accent-teal);
            border-right: 2px solid var(--accent-teal);
            border-bottom-right-radius: 2px;
            pointer-events: none;
            transition: all var(--transition-speed);
            filter: drop-shadow(0 0 3px var(--accent-teal));
        }

        /* Grid Layouts */
        .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .grid-2col { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }

        /* KPI Card */
        .kpi-card { display: flex; flex-direction: column; gap: 12px; }
        .kpi-label { color: var(--text-secondary); font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font-mono); }
        .kpi-value { font-size: 32px; font-weight: 700; font-family: var(--font-mono); line-height: 1; display: flex; align-items: baseline; gap: 4px; color: #fff; }
        .kpi-unit { font-size: 13px; color: var(--text-secondary); font-weight: 500; font-family: var(--font-main); }

        /* Aura IA Chat */
        .chat-container { display: flex; flex-direction: column; height: calc(100vh - 180px); background: rgba(5,5,5,0.7); border-radius: 4px; border: 1px solid var(--border-color); overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .chat-bubble { max-width: 80%; padding: 16px; border-radius: 4px; font-size: 14px; line-height: 1.5; border: 1px solid transparent; }
        .chat-bubble.user { align-self: flex-end; background: var(--bg-surface-hover); color: var(--text-primary); border-color: rgba(255,255,255,0.05); }
        .chat-bubble.ai { align-self: flex-start; background: rgba(0, 255, 204, 0.03); color: var(--text-primary); border-color: var(--accent-teal); box-shadow: 0 0 15px var(--accent-teal-dim); }
        .chat-input-area { padding: 16px; border-top: 1px solid var(--border-color); display: flex; gap: 12px; background: rgba(5,5,5,0.8); }
        .chat-input { flex: 1; padding: 12px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-primary); }
        .chat-input:focus { outline: none; border-color: var(--accent-teal); box-shadow: 0 0 8px var(--accent-teal-dim); }

        /* Badges & Status */
        .badge {
            padding: 4px 10px;
            border-radius: var(--radius-md);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            font-family: var(--font-mono);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge-veg { background-color: rgba(0, 255, 204, 0.1); color: #00ffcc; border: 1px solid rgba(0, 255, 204, 0.25); }
        .badge-flower { background-color: rgba(255, 0, 127, 0.1); color: #ff007f; border: 1px solid rgba(255, 0, 127, 0.25); }
        .badge-germ { background-color: var(--status-info-dim); color: var(--status-info); border: 1px solid rgba(59, 130, 246, 0.2); }
        .badge-harvest { background-color: var(--status-alert-dim); color: var(--status-alert); border: 1px solid rgba(245, 158, 11, 0.2); }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-optimal { background-color: var(--status-optimal); box-shadow: 0 0 8px var(--status-optimal-dim); }
        .status-alert { background-color: var(--status-alert); box-shadow: 0 0 8px var(--status-alert-dim); }
        .status-critical { background-color: var(--status-critical); box-shadow: 0 0 8px var(--status-critical-dim); }

        /* Tables */
        .table-wrapper { overflow-x: auto; border-radius: 4px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; text-align: left; background-color: rgba(5,5,5,0.7); }
        th { 
            padding: 16px; 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--text-secondary); 
            text-transform: uppercase; 
            letter-spacing: 0.08em;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(5,5,5,0.9);
            position: sticky; top: 0; z-index: 5;
            font-family: var(--font-mono);
        }
        td { padding: 16px; border-bottom: 1px solid var(--border-color); font-size: 13px; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background-color: var(--bg-surface-hover); }

        /* Tasks */
        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-item {
            display: flex; align-items: flex-start; gap: 16px;
            padding: 16px; background: var(--bg-surface-hover);
            border-radius: var(--radius-md); border: 1px solid var(--border-color);
            transition: opacity 0.3s;
        }
        .task-item.completed { opacity: 0.6; }
        .task-item.completed .task-title { text-decoration: line-through; color: var(--text-secondary); }
        
        .checkbox-wrapper { padding-top: 2px; }
        .custom-checkbox {
            appearance: none; width: 20px; height: 20px;
            border: 2px solid var(--border-color); border-radius: 4px;
            cursor: pointer; position: relative; transition: all 0.2s;
            background: var(--bg-surface);
        }
        .custom-checkbox:checked { background-color: var(--accent-teal); border-color: var(--accent-teal); }
        .custom-checkbox:checked::after {
            content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            color: black; font-size: 12px; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .task-content { flex: 1; }
        .task-title { font-weight: 500; margin-bottom: 4px; transition: color 0.2s; }
        .task-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 12px; font-family: var(--font-mono); }
        .priority-alta { color: var(--status-critical); }
        .priority-media { color: var(--status-alert); }
        .priority-baja { color: var(--status-info); }

        /* =========================================================================
           UX IMPROVEMENTS (MEJORA 4)
           ========================================================================= */
        .weekly-agenda-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5,5,5,0.7);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
        }
        .weekly-agenda-container::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; width: 10px; height: 10px;
            border-top: 2px solid var(--accent-teal);
            border-left: 2px solid var(--accent-teal);
        }
        .weekly-agenda-strip {
            display: flex;
            gap: 6px;
            flex: 1;
            min-width: 280px;
        }
        .weekly-agenda-day {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 4px;
            border-radius: var(--radius-sm);
            background: rgba(255,255,255,0.01);
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .weekly-agenda-day.today {
            background: var(--accent-teal-dim);
            border-color: var(--accent-teal);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.15);
        }
        .weekly-agenda-day.today .day-num {
            color: var(--accent-teal);
            font-weight: 700;
        }
        .weekly-agenda-day .day-name {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: bold;
            font-family: var(--font-mono);
        }
        .weekly-agenda-day .day-num {
            font-size: 14px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            margin-top: 2px;
        }
        
        /* Lunar Widget */
        .lunar-widget {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            font-size: 12px;
            color: var(--text-primary);
        }
        .lunar-widget i {
            color: var(--accent-teal);
            font-size: 14px;
            text-shadow: 0 0 8px var(--accent-teal);
        }
        .lunar-phase-name {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: var(--font-mono);
        }

        /* 2. Quick Actions CSS */
        .quick-actions-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        @media (max-width: 640px) {
            .quick-actions-bar {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .quick-action-btn {
            background: rgba(5, 5, 5, 0.7);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .quick-action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(0, 255, 204, 0.15),
                transparent
            );
            transition: 0.5s;
        }
        .quick-action-btn:hover::before {
            left: 100%;
        }
        .quick-action-btn:hover {
            background: rgba(0, 255, 204, 0.04);
            border-color: var(--accent-teal);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.15);
            transform: translateY(-2px);
            color: var(--accent-teal);
        }
        .quick-action-btn i {
            font-size: 14px;
            color: var(--accent-teal);
            transition: transform 0.2s;
        }
        .quick-action-btn:hover i {
            transform: scale(1.15);
        }
        .quick-actions-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            font-weight: 700;
            font-family: var(--font-mono);
        }

        /* 3. Lifecycle Timeline CSS */
        .lifecycle-timeline {
            position: relative;
            padding-left: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin: 20px 0;
        }
        .lifecycle-timeline::before {
            content: '';
            position: absolute;
            left: 9px;
            top: 6px;
            bottom: 6px;
            width: 2px;
            background: var(--border-color);
        }
        .lifecycle-node {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .lifecycle-dot {
            position: absolute;
            left: -32px;
            top: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--bg-main);
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 2;
        }
        .lifecycle-node.active .lifecycle-dot {
            border-color: var(--accent-teal);
            background: var(--accent-teal-dim);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        .lifecycle-node.completed .lifecycle-dot {
            border-color: var(--accent-teal);
            background: var(--accent-teal);
            box-shadow: 0 0 6px rgba(0, 255, 204, 0.3);
        }
        .lifecycle-dot i {
            font-size: 8px;
            color: transparent;
            transition: all 0.2s;
        }
        .lifecycle-node.completed .lifecycle-dot i {
            color: #000;
        }
        .lifecycle-node.active .lifecycle-dot i {
            color: var(--accent-teal);
        }
        .lifecycle-node-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .lifecycle-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: capitalize;
        }
        .lifecycle-node.active .lifecycle-title {
            color: #fff;
        }
        .lifecycle-node.completed .lifecycle-title {
            color: var(--text-primary);
        }
        .lifecycle-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.02);
            color: var(--text-secondary);
            font-weight: 700;
            border: 1px solid var(--border-color);
            font-family: var(--font-mono);
        }
        .lifecycle-node.active .lifecycle-badge {
            background: rgba(0, 255, 204, 0.15);
            color: var(--accent-teal);
            border-color: rgba(0, 255, 204, 0.3);
        }
        .lifecycle-node.completed .lifecycle-badge {
            background: rgba(255,255,255,0.05);
            color: var(--text-secondary);
        }
        .lifecycle-details {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* 4. Chat contextual IA */
        .ai-chat-card {
            background: rgba(5, 5, 5, 0.65);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 16px;
            margin-top: 24px;
            box-shadow: var(--shadow-card);
        }
        .ai-chat-card::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; width: 8px; height: 8px;
            border-top: 2px solid var(--accent-teal);
            border-left: 2px solid var(--accent-teal);
        }
        .ai-chat-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-weight: 600;
            color: #fff;
            font-size: 13px;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .ai-chat-header i {
            color: var(--accent-teal);
            font-size: 16px;
            text-shadow: 0 0 8px var(--accent-teal);
        }
        .ai-chat-input-wrapper {
            display: flex;
            gap: 8px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
            align-items: center;
            transition: all 0.2s;
        }
        .ai-chat-input-wrapper:focus-within {
            border-color: var(--accent-teal);
            box-shadow: 0 0 8px var(--accent-teal-dim);
        }
        .ai-chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-family: var(--font-main);
            font-size: 13px;
            padding: 6px 4px;
            outline: none;
        }
        .ai-chat-send {
            background: transparent;
            border: none;
            color: var(--accent-teal);
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ai-chat-send:hover {
            background: var(--accent-teal-dim);
        }
        .ai-chat-log {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            background: rgba(255,255,255,0.01);
            padding: 8px 12px;
            border-radius: 2px;
            border-left: 2px solid var(--accent-teal);
            display: none;
            font-family: var(--font-mono);
            line-height: 1.4;
        }

        /* Toast Notification Styles */
        .toast-notification {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid var(--accent-teal);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.25);
            color: #fff;
            padding: 12px 24px;
            border-radius: 4px;
            z-index: 9999;
            font-family: var(--font-mono);
            font-size: 12px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }
        .toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Calendar CSS */
        .calendar-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: rgba(5,5,5,0.7); padding: 12px 20px; border-radius: 4px; border: 1px solid var(--border-color); flex-wrap: wrap; gap: 12px; }
        .calendar-nav-buttons { display: flex; gap: 8px; align-items: center; }
        .calendar-nav-title { font-size: 15px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 0.05em; font-family: var(--font-mono); }
        .calendar-mode-toggle { display: flex; gap: 8px; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 24px; }
        .calendar-header-day { text-align: center; font-weight: 700; font-size: 11px; text-transform: uppercase; color: var(--accent-teal); padding: 8px 0; background: rgba(5,5,5,0.9); border-radius: 2px; border: 1px solid rgba(0, 255, 204, 0.1); font-family: var(--font-mono); }
        
        .calendar-cell {
            min-height: 120px; background: rgba(5,5,5,0.65); border: 1px solid var(--border-color);
            border-radius: 4px; padding: 8px; display: flex; flex-direction: column;
            transition: all 0.2s; position: relative; cursor: pointer;
        }
        .calendar-cell:hover { border-color: var(--accent-teal); background: var(--bg-surface-hover); }
        .calendar-cell.other-month { opacity: 0.15; }
        .calendar-cell.today { border-color: var(--accent-teal); box-shadow: 0 0 10px rgba(0, 255, 204, 0.15); background: rgba(0, 255, 204, 0.02); }
        .calendar-cell.today .calendar-cell-num { color: var(--accent-teal); font-weight: 700; }
        
        .calendar-cell-num { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; font-family: var(--font-mono); }
        .calendar-cell-tasks { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; max-height: 90px; }
        
        .calendar-task-strip {
            font-size: 10px; padding: 4px 6px; border-radius: 2px; background: var(--bg-surface-hover);
            border-left: 3px solid var(--text-secondary); color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: flex; align-items: center; justify-content: space-between; gap: 4px;
            transition: all 0.15s;
        }
        .calendar-task-strip:hover { transform: translateX(2px); background: var(--bg-surface-active); }
        .calendar-task-strip.completed { opacity: 0.5; text-decoration: line-through; }
        .calendar-task-strip.prio-alta { border-left-color: var(--status-critical); background: rgba(239, 68, 68, 0.05); }
        .calendar-task-strip.prio-media { border-left-color: var(--status-alert); background: rgba(245, 158, 11, 0.05); }
        .calendar-task-strip.prio-baja { border-left-color: var(--status-info); background: rgba(59, 130, 246, 0.05); }

        .calendar-task-checkbox { width: 10px; height: 10px; appearance: none; border: 1px solid var(--border-color); border-radius: 2px; cursor: pointer; transition: 0.1s; display: inline-block; vertical-align: middle; }
        .calendar-task-checkbox:checked { background: var(--accent-teal); border-color: var(--accent-teal); }
        
        /* Filters and task controls bar */
        .task-filters-bar { display: flex; gap: 12px; background: rgba(5,5,5,0.7); padding: 12px 20px; border-radius: 4px; border: 1px solid var(--border-color); margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 10px; text-transform: uppercase; color: var(--text-secondary); font-weight: bold; letter-spacing: 0.05em; font-family: var(--font-mono); }

        @media (max-width: 768px) {
            .calendar-grid { gap: 4px; }
            .calendar-cell { min-height: 70px; padding: 4px; }
            .calendar-cell-num { font-size: 10px; margin-bottom: 2px; }
            .calendar-task-strip { font-size: 8px; padding: 2px; }
            .calendar-cell-tasks { max-height: 50px; }
        }

        /* Logs Timeline */
        .timeline { position: relative; padding-left: 24px; display: flex; flex-direction: column; gap: 20px; }
        .timeline::before { content: ''; position: absolute; left: 7px; top: 8px; bottom: 0; width: 2px; background: var(--border-color); }
        .log-item { position: relative; }
        .log-marker {
            position: absolute; left: -24px; top: 4px; width: 16px; height: 16px;
            border-radius: 50%; background: var(--bg-surface); border: 2px solid var(--accent-teal); z-index: 1;
        }
        .log-type-nutrición .log-marker { border-color: var(--status-info); }
        .log-type-incidente .log-marker { border-color: var(--status-critical); }
        .log-type-poda .log-marker { border-color: var(--status-alert); }
        .log-type-cosecha .log-marker { border-color: #f59e0b; }
        .log-type-inicio-secado .log-marker, .log-type-control-secado .log-marker { border-color: #f97316; }
        .log-type-inicio-curado .log-marker, .log-type-control-curado .log-marker { border-color: #d97706; }
        .log-type-punto-final .log-marker { border-color: #10b981; }
        
        .log-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
        .log-date { color: var(--text-secondary); font-family: var(--font-mono); }
        .log-plant { color: var(--accent-teal); font-weight: 500; }
        .log-body { background: var(--bg-surface-hover); padding: 12px 16px; border-radius: 4px; font-size: 14px; border: 1px solid var(--border-color); }

        /* Forms */
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-size: 12px; font-weight: bold; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; font-family: var(--font-mono); }
        .form-control {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-color); border-radius: var(--radius-md);
            color: var(--text-primary); transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus { outline: none; border-color: var(--accent-teal); box-shadow: 0 0 8px var(--accent-teal-dim); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; }

        /* Modals Glassmorphic */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: rgba(10, 10, 10, 0.85); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px; width: 100%; max-width: 500px;
            padding: 32px; box-shadow: var(--shadow-modal);
            transform: scale(0.9) translateY(30px);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh; overflow-y: auto;
            position: relative;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .modal-overlay.active .modal-content { 
            transform: scale(1) translateY(0);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }
        .modal-content::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            width: 16px; height: 16px;
            border-top: 3px solid var(--accent-teal);
            border-left: 3px solid var(--accent-teal);
            pointer-events: none;
            filter: drop-shadow(0 0 3px var(--accent-teal));
        }
        .modal-content::after {
            content: '';
            position: absolute;
            bottom: -1px; right: -1px;
            width: 16px; height: 16px;
            border-bottom: 3px solid var(--accent-teal);
            border-right: 3px solid var(--accent-teal);
            pointer-events: none;
            filter: drop-shadow(0 0 3px var(--accent-teal));
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-close { color: var(--text-secondary); font-size: 20px; cursor: pointer; transition: color 0.2s; }
        .modal-close:hover { color: var(--text-primary); }

        /* === RESPONSIVE === */
        @media (max-width: 1024px) {
            .grid-2col { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 768px) {
            .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.active { opacity: 1; pointer-events: auto; }
            .menu-toggle { display: block; }
            .topbar { padding: 0 16px; }
            .view-container { padding: 16px; }
            .page-title { font-size: 20px; }
            .grid-kpi { grid-template-columns: 1fr 1fr; }
        }
        
        @media (max-width: 480px) {
            .grid-kpi { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }

        /* Empty States */
        .empty-state {
            padding: 40px 20px; text-align: center; color: var(--text-secondary);
            background: var(--bg-surface-hover); border-radius: 4px;
            border: 1px dashed var(--border-color);
        }
        .empty-state i { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }

        /* Kinetic wave & Gauges animations */
        @keyframes pulse-neon-wave {
            0% {
                box-shadow: 0 0 0 0px var(--accent-teal), 0 0 0 0px rgba(255, 255, 255, 0.1);
            }
            100% {
                box-shadow: 0 0 0 12px rgba(0, 0, 0, 0), 0 0 0 24px rgba(0, 0, 0, 0);
            }
        }
        .quick-action-btn:active {
            animation: pulse-neon-wave 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(0.95);
        }
        @keyframes hud-pulse-yellow {
            0% { filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.4)); }
            50% { filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.85)); }
            100% { filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.4)); }
        }
        @keyframes hud-pulse-red {
            0% { filter: drop-shadow(0 0 2px rgba(239, 68, 68, 0.4)); }
            50% { filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.85)); }
            100% { filter: drop-shadow(0 0 2px rgba(239, 68, 68, 0.4)); }
        }
        .hud-pulse-yellow .gauge-path {
            animation: hud-pulse-yellow 2s infinite ease-in-out;
        }
        .hud-pulse-red .gauge-path {
            animation: hud-pulse-red 1.5s infinite ease-in-out;
        }
        .hud-tech-code {
            font-family: var(--font-mono);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.02);
            padding: 4px 8px;
            border-radius: 2px;
            border-left: 2px solid var(--accent-teal);
        }
    </style>
</head>
<body>

    <div id="app" class="app-layout">
        
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="brand" style="cursor: pointer;" onclick="router.navigate('dashboard')">
                <svg class="brand-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 90V10" stroke="var(--accent-teal)" stroke-width="3" stroke-linecap="round"/>

                    <path d="M50 10L32 35H50L68 35L50 10Z" fill="var(--accent-teal)" fill-opacity="0.15" stroke="var(--accent-teal)" stroke-width="2" stroke-linejoin="round"/>

                    <path d="M32 35L15 52L36 54L50 35L32 35Z" fill="var(--accent-teal)" fill-opacity="0.1" stroke="var(--accent-teal)" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M68 35L85 52L64 54L50 35L68 35Z" fill="var(--accent-teal)" fill-opacity="0.1" stroke="var(--accent-teal)" stroke-width="2" stroke-linejoin="round"/>

                    <path d="M15 52L22 72L42 66L36 54L15 52Z" fill="var(--accent-teal)" fill-opacity="0.15" stroke="var(--accent-teal)" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M85 52L78 72L58 66L64 54L85 52Z" fill="var(--accent-teal)" fill-opacity="0.15" stroke="var(--accent-teal)" stroke-width="2" stroke-linejoin="round"/>

                    <path d="M32 35H50V54L36 54L32 35Z" fill="var(--accent-teal)" fill-opacity="0.2" stroke="var(--accent-teal)" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M68 35H50V54L64 54L68 35Z" fill="var(--accent-teal)" fill-opacity="0.2" stroke="var(--accent-teal)" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M36 54L50 54V66L42 66L36 54Z" fill="var(--accent-teal)" fill-opacity="0.25" stroke="var(--accent-teal)" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M64 54L50 54V66L58 66L64 54Z" fill="var(--accent-teal)" fill-opacity="0.25" stroke="var(--accent-teal)" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M42 66L50 66V82L42 66Z" fill="var(--accent-teal)" fill-opacity="0.3" stroke="var(--accent-teal)" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M58 66L50 66V82L58 66Z" fill="var(--accent-teal)" fill-opacity="0.3" stroke="var(--accent-teal)" stroke-width="2" stroke-linejoin="round"/>
                </svg>
                <span class="brand-name">Aura<span>Grow</span></span>
            </div>
            <nav class="nav-menu">
                <a href="#dashboard" class="nav-item active" data-route="dashboard">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </a>
                <a href="#plants" class="nav-item" data-route="plants">

                </a>
                <a href="#log" class="nav-item" data-route="log">
                    <i class="fa-solid fa-book-open"></i> Grow Log
                </a>
                <a href="#tasks" class="nav-item" data-route="tasks">
                    <i class="fa-solid fa-list-check"></i> Tareas
                </a>
                <a href="#planes" class="nav-item" data-route="planes">
                    <i class="fa-solid fa-calendar-days"></i> Planes
                </a>
                <a href="#metrics" class="nav-item" data-route="metrics">
                    <i class="fa-solid fa-temperature-half"></i> Métricas
                </a>
                <a href="#aura-chat" class="nav-item" data-route="aura-chat">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Aura IA
                </a>
                <a href="#settings" class="nav-item" data-route="settings" style="margin-top: auto;">
                    <i class="fa-solid fa-gear"></i> Configuración
                </a>
            </nav>
        </aside>
        
        <!-- Mobile Overlay -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <button id="menu-toggle" class="menu-toggle" aria-label="Toggle Menu">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="header-search">
                        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-secondary)"></i>
                        <input type="text" id="global-search" placeholder="Buscar plantas, tareas, espacios..." autocomplete="off">
                    </div>
                </div>
                
                <div class="topbar-actions">
                    <button id="theme-toggle" class="btn-icon" aria-label="Toggle Theme">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <button class="btn-icon" style="position: relative;">
                        <i class="fa-solid fa-bell"></i>

        // PERSISTENCIA
        const STORAGE_KEY = 'auraGrow_v1';

        async function saveState() {
            try {
                await localforage.setItem(STORAGE_KEY, state);
            } catch (e) {
                console.error('Error guardando el estado con localForage:', e);
            }
        }

        async function loadState() {
            try {
                const parsed = await localforage.getItem(STORAGE_KEY);
                if (parsed) {
                    Object.assign(state, parsed);
                    if (!state.spaces) state.spaces = [];
                    if (!state.plants) state.plants = [];
                    if (!state.logs) state.logs = [];
                    if (!state.tasks) state.tasks = [];
                    if (!state.envRecords) state.envRecords = [];
                    if (!state.cycles) state.cycles = [];
                    if (!state.plans) state.plans = [];
                    if (!state.activePlantTab) state.activePlantTab = 'resumen';
                    if (!state.plantsViewMode) state.plantsViewMode = 'grid';
                    return true;
                }
            } catch (e) {
                console.error('Error cargando el estado con localForage:', e);
            }
            return false;

                    sizes: "192x192",
                    type: "image/svg+xml"
                }]
            };
            
            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const manifestUrl = URL.createObjectURL(manifestBlob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestUrl;
            document.head.appendChild(link);

            const swCode = `
                const CACHE_NAME = 'auragrow-offline-v1';
                self.addEventListener('install', event => self.skipWaiting());
                self.addEventListener('activate', event => event.waitUntil(clients.claim()));
                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request).then(response => {
                            return response || fetch(event.request).catch(() => new Response('Offline'));
                        })
                    );
                });
            `;
            
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(swBlob);
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register(swUrl)
                    .then(reg => console.log('AuraGrow PWA Offline-Ready'))

            generateId() {

            getPlantName(id) {

                return plant ? plant.nombre : 'General';
            },
            getPlantStatusColor(plant) {
                // Mock logic for status
                if (plant.estado !== 'activa') return 'status-info';
                // Find recent logs for alerts
                const recentAlerts = state.logs.filter(l => l.plantId === plant.id && l.tipo === 'incidente');
                if (recentAlerts.length > 0) return 'status-alert';
                return 'status-optimal';
            },
            getLunarPhase() {
                const known = new Date(2000, 0, 6); // Luna nueva conocida: 6 enero 2000
                const now = new Date();
                const diff = (now - known) / (1000 * 60 * 60 * 24);
                const cycle = 29.53058867;
                const age = ((diff % cycle) + cycle) % cycle;
                
                if (age < 1.85)        return { emoji: '🌑', name: 'Luna Nueva' };
                else if (age < 7.38)   return { emoji: '🌒', name: 'Cuarto Creciente' };
                else if (age < 11.07)  return { emoji: '🌓', name: 'Cuarto Creciente' };
                else if (age < 14.77)  return { emoji: '🌔', name: 'Gibosa Creciente' };
                else if (age < 18.46)  return { emoji: '🌕', name: 'Luna Llena' };
                else if (age < 22.15)  return { emoji: '🌖', name: 'Gibosa Menguante' };
                else if (age < 25.84)  return { emoji: '🌗', name: 'Cuarto Menguante' };
                else                   return { emoji: '🌘', name: 'Luna Menguante' };
            },
            getLifecycleTimeline(plant) {
                const now = new Date();
                const start = new Date(plant.fechaInicio + 'T12:00:00');
                const elapsed = Math.max(0, Math.floor((now - start) / (1000 * 60 * 60 * 24)));
                
                const stages = [
                    { key: 'germinación', name: 'Germinación', icon: 'fa-seedling', defaultDays: 14 },
                    { key: 'plántula', name: 'Plántula', icon: 'fa-leaf', defaultDays: 7 },
                    { key: 'vegetativo', name: 'Vegetativo', icon: 'fa-plant-wilt', defaultDays: 28 },
                    { key: 'floración', name: 'Floración', icon: 'fa-sun', defaultDays: (plant.floracionSemanas || 8) * 7 }
                ];
                
                // Si es un clon, no pasa por Germinación
                const isClon = plant.origen === 'clon';
                const activeStages = isClon ? stages.filter(s => s.key !== 'germinación') : stages;
                
                // Determinar qué etapas están completas, activa o futuras
                let currentIdx = activeStages.findIndex(s => s.key === plant.etapa.toLowerCase());
                if (currentIdx === -1) {
                    currentIdx = activeStages.length; // Si la etapa es posterior (cosecha, etc.), todas están completadas
                }
                
                return activeStages.map((stage, idx) => {
                    let status = 'future';
                    let days = 0;
                    let date = new Date(start);
                    
                    if (idx < currentIdx) {
                        status = 'completed';
                        days = stage.defaultDays;
                        let offset = 0;
                        for (let j = idx + 1; j < currentIdx; j++) {
                            offset += activeStages[j].defaultDays;
                        }
                        date.setDate(start.getDate() - offset);
                    } else if (idx === currentIdx) {
                        status = 'active';
                        days = elapsed;
                        date = new Date(start);
                    } else {
                        status = 'future';
                        days = stage.defaultDays;
                        let offset = 0;
                        for (let j = currentIdx; j < idx; j++) {
                            offset += activeStages[j].defaultDays;
                        }
                        date.setDate(start.getDate() + offset);
                    }
                    
                    return {
                        ...stage,
                        status,
                        days,
                        dateStr: date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })
                    };
                });
            },
            showToast(message) {
                let toast = document.getElementById('aura-toast');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = 'aura-toast';
                    toast.className = 'toast-notification';
                    document.body.appendChild(toast);
                }
                toast.innerHTML = `<i class="fa-solid fa-circle-check" style="color: var(--accent-teal);"></i> <span>${message}</span>`;

                setTimeout(() => {

                }, 3000);

            getSpaceIcon(tipo) {

                if (t.includes('interior') || t.includes('indoor') || t.includes('sala')) return 'fa-warehouse';

                if (t.includes('invernadero') || t.includes('greenhouse')) return 'fa-leaf';

            getPlantStageIcon(etapa) {

                if (e.includes('germinacion') || e.includes('semilla')) return 'fa-circle-notch';
                if (e.includes('plantula')) return 'fa-seedling';
                if (e.includes('vegetativo')) return 'fa-leaf';
