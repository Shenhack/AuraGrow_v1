<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraGrow | Gestión de Cultivo Profesional</title>
    
    <!-- Fonts and Icons -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* === CSS VARIABLES === */
        :root {
            --font-main: 'Satoshi', system-ui, -apple-system, sans-serif;
            --sidebar-width: 260px;
            --topbar-height: 70px;
            --radius-md: 8px;
            --radius-lg: 16px;
            --radius-pill: 9999px;
            --transition-speed: 0.3s;
        }

        /* Dark Theme (Default) */
        [data-theme="dark"] {
            --bg-main: #171614;
            --bg-surface: #1c1b19;
            --bg-surface-hover: #262421;
            --bg-surface-active: #312e2a;
            
            --text-primary: #f5f5f5;
            --text-secondary: #a3a19e;
            --border-color: #33312e;
            
            --accent-teal: #4f98a3;
            --accent-teal-hover: #3d7983;
            --accent-teal-dim: rgba(79, 152, 163, 0.15);
            
            --status-optimal: #10b981;
            --status-optimal-dim: rgba(16, 185, 129, 0.15);
            --status-alert: #f59e0b;
            --status-alert-dim: rgba(245, 158, 11, 0.15);
            --status-critical: #ef4444;
            --status-critical-dim: rgba(239, 68, 68, 0.15);
            --status-info: #3b82f6;
            --status-info-dim: rgba(59, 130, 246, 0.15);
            
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }

        /* Light Theme */
        [data-theme="light"] {
            --bg-main: #fcfbf9;
            --bg-surface: #ffffff;
            --bg-surface-hover: #f0eee9;
            --bg-surface-active: #e6e4df;
            
            --text-primary: #171614;
            --text-secondary: #5c5a56;
            --border-color: #e5e3de;
            
            --accent-teal: #3b7b85;
            --accent-teal-hover: #2d626a;
            --accent-teal-dim: rgba(59, 123, 133, 0.1);
            
            --status-optimal: #059669;
            --status-optimal-dim: rgba(5, 150, 105, 0.1);
            --status-alert: #d97706;
            --status-alert-dim: rgba(217, 119, 6, 0.1);
            --status-critical: #dc2626;
            --status-critical-dim: rgba(220, 38, 38, 0.1);
            --status-info: #2563eb;
            --status-info-dim: rgba(37, 99, 235, 0.1);
            
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main);
        }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            overflow: hidden;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        a { text-decoration: none; color: inherit; }
        button, input, select, textarea { font-family: inherit; font-size: inherit; }
        button { cursor: pointer; border: none; background: transparent; }
        
        /* === LAYOUT === */
        .app-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 40;
            transition: transform var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
        }

        .brand {
            height: var(--topbar-height);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            color: var(--accent-teal);
            font-size: 24px;
        }
        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .nav-menu {
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-item:hover {
            color: var(--text-primary);
            background-color: var(--bg-surface-hover);
        }

        .nav-item.active {
            color: var(--accent-teal);
            background-color: var(--accent-teal-dim);
        }
        
        .nav-item i { width: 20px; text-align: center; }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-speed);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

        .topbar {
            height: var(--topbar-height);
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 10;
        }

        .menu-toggle {
            display: none;
            font-size: 20px;
            color: var(--text-primary);
            padding: 8px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .btn-icon:hover {
            background-color: var(--bg-surface-hover);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .view-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
        }

        /* === ANIMATIONS === */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-view { animation: fadeIn 0.4s ease-out forwards; }

        /* === COMPONENTS === */
        /* Typography */
        h1, h2, h3 { font-weight: 700; color: var(--text-primary); }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-title { font-size: 24px; letter-spacing: -0.02em; }
        .section-title { font-size: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .btn-primary { background-color: var(--accent-teal); color: #ffffff; }
        .btn-primary:hover { background-color: var(--accent-teal-hover); }
        .btn-outline { background-color: transparent; border-color: var(--border-color); color: var(--text-primary); }
        .btn-outline:hover { background-color: var(--bg-surface-hover); }

        /* Cards */
        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-card);
        }

        /* Grid Layouts */
        .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .grid-2col { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }

        /* KPI Card */
        .kpi-card { display: flex; flex-direction: column; gap: 12px; }
        .kpi-label { color: var(--text-secondary); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
        .kpi-value { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; display: flex; align-items: baseline; gap: 4px; }
        .kpi-unit { font-size: 14px; color: var(--text-secondary); font-weight: 500; }

        /* Badges & Status */
        .badge {
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge-veg { background-color: var(--status-optimal-dim); color: var(--status-optimal); }
        .badge-flower { background-color: var(--accent-teal-dim); color: var(--accent-teal); }
        .badge-germ { background-color: var(--status-info-dim); color: var(--status-info); }
        .badge-harvest { background-color: var(--status-alert-dim); color: var(--status-alert); }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-optimal { background-color: var(--status-optimal); box-shadow: 0 0 8px var(--status-optimal-dim); }
        .status-alert { background-color: var(--status-alert); box-shadow: 0 0 8px var(--status-alert-dim); }
        .status-critical { background-color: var(--status-critical); box-shadow: 0 0 8px var(--status-critical-dim); }

        /* Tables */
        .table-wrapper { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; text-align: left; background-color: var(--bg-surface); }
        th { 
            padding: 16px; 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--text-secondary); 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-surface);
            position: sticky; top: 0; z-index: 5;
        }
        td { padding: 16px; border-bottom: 1px solid var(--border-color); font-size: 14px; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background-color: var(--bg-surface-hover); }

        /* Tasks */
        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-item {
            display: flex; align-items: flex-start; gap: 16px;
            padding: 16px; background: var(--bg-surface-hover);
            border-radius: var(--radius-md); border: 1px solid var(--border-color);
            transition: opacity 0.3s;
        }
        .task-item.completed { opacity: 0.6; }
        .task-item.completed .task-title { text-decoration: line-through; color: var(--text-secondary); }
        
        .checkbox-wrapper { padding-top: 2px; }
        .custom-checkbox {
            appearance: none; width: 20px; height: 20px;
            border: 2px solid var(--border-color); border-radius: 4px;
            cursor: pointer; position: relative; transition: all 0.2s;
            background: var(--bg-surface);
        }
        .custom-checkbox:checked { background-color: var(--accent-teal); border-color: var(--accent-teal); }
        .custom-checkbox:checked::after {
            content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            color: white; font-size: 12px; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .task-content { flex: 1; }
        .task-title { font-weight: 500; margin-bottom: 4px; transition: color 0.2s; }
        .task-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 12px; }
        .priority-alta { color: var(--status-critical); }
        .priority-media { color: var(--status-alert); }
        .priority-baja { color: var(--status-info); }

        /* Logs Timeline */
        .timeline { position: relative; padding-left: 24px; display: flex; flex-direction: column; gap: 20px; }
        .timeline::before { content: ''; position: absolute; left: 7px; top: 8px; bottom: 0; width: 2px; background: var(--border-color); }
        .log-item { position: relative; }
        .log-marker {
            position: absolute; left: -24px; top: 4px; width: 16px; height: 16px;
            border-radius: 50%; background: var(--bg-surface); border: 2px solid var(--accent-teal); z-index: 1;
        }
        .log-type-nutrición .log-marker { border-color: var(--status-info); }
        .log-type-incidente .log-marker { border-color: var(--status-critical); }
        .log-type-poda .log-marker { border-color: var(--status-alert); }
        
        .log-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
        .log-date { color: var(--text-secondary); }
        .log-plant { color: var(--accent-teal); font-weight: 500; }
        .log-body { background: var(--bg-surface-hover); padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; border: 1px solid var(--border-color); }

        /* Modals */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: all 0.3s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--bg-surface); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); width: 100%; max-width: 500px;
            padding: 32px; box-shadow: var(--shadow-modal);
            transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-close { color: var(--text-secondary); font-size: 20px; cursor: pointer; transition: color 0.2s; }
        .modal-close:hover { color: var(--text-primary); }

        /* Forms */
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 500; color: var(--text-secondary); }
        .form-control {
            width: 100%; padding: 12px; background: var(--bg-main);
            border: 1px solid var(--border-color); border-radius: var(--radius-md);
            color: var(--text-primary); transition: border-color 0.2s;
        }
        .form-control:focus { outline: none; border-color: var(--accent-teal); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; }

        /* === RESPONSIVE === */
        @media (max-width: 1024px) {
            .grid-2col { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 768px) {
            .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.active { opacity: 1; pointer-events: auto; }
            .menu-toggle { display: block; }
            .topbar { padding: 0 16px; }
            .view-container { padding: 16px; }
            .page-title { font-size: 20px; }
            .grid-kpi { grid-template-columns: 1fr 1fr; }
        }
        
        @media (max-width: 480px) {
            .grid-kpi { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }

        /* Empty States */
        .empty-state {
            padding: 40px 20px; text-align: center; color: var(--text-secondary);
            background: var(--bg-surface-hover); border-radius: var(--radius-md);
            border: 1px dashed var(--border-color);
        }
        .empty-state i { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
    </style>
</head>
<body>

    <div id="app" class="app-layout">
        
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-leaf brand-logo"></i>
                <span class="brand-name">AuraGrow</span>
            </div>
            <nav class="nav-menu">
                <a href="#dashboard" class="nav-item active" data-route="dashboard">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </a>
                <a href="#plants" class="nav-item" data-route="plants">
                    <i class="fa-solid fa-seedling"></i> Plantas
                </a>
                <a href="#log" class="nav-item" data-route="log">
                    <i class="fa-solid fa-book-open"></i> Grow Log
                </a>
                <a href="#tasks" class="nav-item" data-route="tasks">
                    <i class="fa-solid fa-list-check"></i> Tareas
                </a>
                <a href="#metrics" class="nav-item" data-route="metrics">
                    <i class="fa-solid fa-temperature-half"></i> Métricas
                </a>
            </nav>
        </aside>
        
        <!-- Mobile Overlay -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <header class="topbar">
                <button id="menu-toggle" class="menu-toggle" aria-label="Toggle Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="topbar-actions">
                    <button id="theme-toggle" class="btn-icon" aria-label="Toggle Theme">
                        <i class="fa-solid fa-sun"></i>
                    </button>
                    <div class="btn-icon" style="background: var(--accent-teal-dim); color: var(--accent-teal);">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </header>

            <!-- View Container -->
            <div id="app-content" class="view-container">
                <!-- Content injected via JS -->
            </div>
        </main>
    </div>

    <!-- Modals Container -->
    <div id="modals-container"></div>

    <script>
        /* =========================================================================
           1. STATE
           ========================================================================= */
        const state = {
            plants: [],
            logs: [],
            tasks: [],
            envRecords: [],
            cycles: [],
            activeView: 'dashboard',
            theme: 'dark'
        };

        /* =========================================================================
           2. SEED_DATA
           ========================================================================= */
        function loadSeedData() {
            const today = new Date();
            const formatStr = (d) => d.toISOString();
            
            // Generate some dates relative to today
            const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
            const twoDaysAgo = new Date(today); twoDaysAgo.setDate(twoDaysAgo.getDate() - 2);
            const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);

            state.plants = [
                { id: 'p1', nombre: 'OG Kush Alpha', variedad: 'OG Kush', etapa: 'floración', fechaInicio: '2023-09-01', ubicacion: 'Carpa A', sistema: 'tierra', estado: 'activa' },
                { id: 'p2', nombre: 'Blue Dream #1', variedad: 'Blue Dream', etapa: 'floración', fechaInicio: '2023-09-10', ubicacion: 'Carpa A', sistema: 'hidro', estado: 'activa' },
                { id: 'p3', nombre: 'Amnesia Haze', variedad: 'Amnesia Haze', etapa: 'vegetativo', fechaInicio: '2023-10-15', ubicacion: 'Carpa B', sistema: 'aeropónico', estado: 'activa' },
                { id: 'p4', nombre: 'Gelato 41', variedad: 'Gelato 41', etapa: 'vegetativo', fechaInicio: '2023-10-20', ubicacion: 'Carpa B', sistema: 'tierra', estado: 'activa' }
            ];

            state.logs = [
                { id: 'l1', plantId: 'p1', fecha: formatStr(today), tipo: 'observación', nota: 'Aparición de tricomas lechosos. Muy buen aroma.' },
                { id: 'l2', plantId: 'p2', fecha: formatStr(yesterday), tipo: 'nutrición', nota: 'Cambio de solución hidropónica. EC subida a 1.8' },
                { id: 'l3', plantId: 'p3', fecha: formatStr(twoDaysAgo), tipo: 'poda', nota: 'Topping realizado en 4to nudo.' },
                { id: 'l4', plantId: 'p4', fecha: formatStr(twoDaysAgo), tipo: 'incidente', nota: 'Leve estrés hídrico detectado, riego aumentado.' },
                { id: 'l5', plantId: 'p1', fecha: formatStr(new Date(today.getTime() - 86400000*3)), tipo: 'observación', nota: 'Desarrollo floral vigoroso.' }
            ];

            state.tasks = [
                { id: 't1', titulo: 'Calibrar medidor de pH', fecha: formatStr(today), prioridad: 'alta', completada: false, plantId: null },
                { id: 't2', titulo: 'Defoliación de bajos', fecha: formatStr(tomorrow), prioridad: 'media', completada: false, plantId: 'p1' },
                { id: 't3', titulo: 'Limpiar filtros de aire', fecha: formatStr(tomorrow), prioridad: 'baja', completada: false, plantId: null },
                { id: 't4', titulo: 'Riego con bioestimulante', fecha: formatStr(yesterday), prioridad: 'alta', completada: true, plantId: 'p4' },
                { id: 't5', titulo: 'Revisar extractores', fecha: formatStr(twoDaysAgo), prioridad: 'media', completada: true, plantId: null },
                { id: 't6', titulo: 'Aplicar preventivo foliar', fecha: formatStr(today), prioridad: 'alta', completada: false, plantId: 'p3' }
            ];

            // 7 days of env records
            for(let i=0; i<7; i++) {
                let d = new Date(); d.setDate(d.getDate() - i);
                state.envRecords.push({
                    id: 'e'+i,
                    fecha: formatStr(d),
                    zona: 'Carpa A',
                    temperatura: (24 + Math.random()*2).toFixed(1),
                    humedad: (50 + Math.random()*10).toFixed(0),
                    vpd: (1.0 + Math.random()*0.3).toFixed(2),
                    ph: 6.2,
                    ec: 1.8,
                    dli: 38,
                    tempAgua: 21
                });
            }

            state.cycles = [
                { id: 'c1', nombre: 'Cosecha Otoño - Carpa A', fechaInicio: '2023-09-01', fechaFin: '2023-11-15', etapa: 'floración', plantIds: ['p1', 'p2'] },
                { id: 'c2', nombre: 'Vegetativo - Carpa B', fechaInicio: '2023-10-15', fechaFin: null, etapa: 'vegetativo', plantIds: ['p3', 'p4'] }
            ];
        }

        /* =========================================================================
           3. UTILS
           ========================================================================= */
        const utils = {
            formatDate(isoString) {
                const date = new Date(isoString);
                return date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
            },
            formatDateTime(isoString) {
                const date = new Date(isoString);
                return date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute:'2-digit' });
            },
            daysBetween(date1, date2 = new Date()) {
                const diffTime = Math.abs(new Date(date2) - new Date(date1));
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            },
            generateId() {
                return '_' + Math.random().toString(36).substr(2, 9);
            },
            getPlantName(id) {
                const plant = state.plants.find(p => p.id === id);
                return plant ? plant.nombre : 'General';
            },
            getPlantStatusColor(plant) {
                // Mock logic for status
                if (plant.estado !== 'activa') return 'status-info';
                // Find recent logs for alerts
                const recentAlerts = state.logs.filter(l => l.plantId === plant.id && l.tipo === 'incidente');
                if (recentAlerts.length > 0) return 'status-alert';
                return 'status-optimal';
            }
        };

        /* =========================================================================
           4. RENDER
           ========================================================================= */
        const render = {
            app() {
                const container = document.getElementById('app-content');
                // Update active nav link
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.route === state.activeView);
                });

                let html = '';
                switch(state.activeView) {
                    case 'dashboard': html = this.dashboardView(); break;
                    case 'plants': html = this.plantsView(); break;
                    case 'log': html = this.logView(); break;
                    case 'tasks': html = this.tasksView(); break;
                    case 'metrics': html = this.metricsView(); break;
                    default: html = this.dashboardView();
                }
                
                // Add animation wrapper
                container.innerHTML = `<div class="animate-view">${html}</div>`;
            },

            dashboardView() {
                const latestEnv = state.envRecords[0] || {};
                const activePlants = state.plants.filter(p => p.estado === 'activa');
                const vegCount = activePlants.filter(p => p.etapa === 'vegetativo').length;
                const floCount = activePlants.filter(p => p.etapa === 'floración').length;
                const pendingTasks = state.tasks.filter(t => !t.completada).slice(0, 3);
                const recentLogs = state.logs.slice(0, 4);

                return `
                    <div class="page-header">
                        <h1 class="page-title">Dashboard</h1>
                    </div>
                    
                    <div class="grid-kpi">
                        <div class="card kpi-card">
                            <span class="kpi-label">VPD Actual</span>
                            <div class="kpi-value" style="color: var(--status-optimal)">${latestEnv.vpd || '--'} <span class="kpi-unit">kPa</span></div>
                        </div>
                        <div class="card kpi-card">
                            <span class="kpi-label">Temperatura</span>
                            <div class="kpi-value">${latestEnv.temperatura || '--'} <span class="kpi-unit">°C</span></div>
                        </div>
                        <div class="card kpi-card">
                            <span class="kpi-label">Humedad</span>
                            <div class="kpi-value">${latestEnv.humedad || '--'} <span class="kpi-unit">%</span></div>
                        </div>
                        <div class="card kpi-card">
                            <span class="kpi-label">Plantas Activas</span>
                            <div class="kpi-value">${activePlants.length} <span class="kpi-unit">total</span></div>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                                <span class="badge badge-veg">${vegCount} Veg</span>
                                <span class="badge badge-flower">${floCount} Flo</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid-2col">
                        <div class="card">
                            <div class="section-title">
                                <i class="fa-solid fa-list-check" style="color: var(--accent-teal)"></i> Tareas de Hoy
                            </div>
                            ${pendingTasks.length > 0 ? `
                                <div class="task-list">
                                    ${pendingTasks.map(t => this._taskItem(t)).join('')}
                                </div>
                            ` : `<div class="empty-state">No hay tareas pendientes para hoy.</div>`}
                            <div style="margin-top: 16px; text-align: right;">
                                <a href="#tasks" class="btn btn-outline" style="padding: 6px 12px; font-size: 12px;">Ver todas</a>
                            </div>
                        </div>

                        <div class="card">
                            <div class="section-title">
                                <i class="fa-solid fa-book-open" style="color: var(--text-secondary)"></i> Últimos Logs
                            </div>
                            <div class="timeline">
                                ${recentLogs.map(l => this._logItem(l)).join('')}
                            </div>
                        </div>
                    </div>
                `;
            },

            plantsView() {
                return `
                    <div class="page-header">
                        <h1 class="page-title">Inventario de Plantas</h1>
                        <button class="btn btn-primary" onclick="handlers.openModal('plant-modal')">
                            <i class="fa-solid fa-plus"></i> Nueva Planta
                        </button>
                    </div>
                    
                    <div class="card" style="padding: 0; overflow: hidden;">
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Nombre</th>
                                        <th>Variedad</th>
                                        <th>Etapa</th>
                                        <th>Ubicación</th>
                                        <th>Días</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${state.plants.map(p => `
                                        <tr style="cursor: pointer;" onclick="alert('Detalle de planta próximamente')">
                                            <td style="font-weight: 500; color: var(--text-primary)">${p.nombre}</td>
                                            <td>${p.variedad}</td>
                                            <td>${this._badgeEtapa(p.etapa)}</td>
                                            <td><i class="fa-solid fa-location-dot" style="margin-right: 6px; color: var(--text-secondary)"></i>${p.ubicacion}</td>
                                            <td>${utils.daysBetween(p.fechaInicio)} d</td>
                                            <td>
                                                <div style="display: flex; align-items: center; gap: 6px;">
                                                    <div class="status-dot ${utils.getPlantStatusColor(p)}"></div>
                                                    <span style="text-transform: capitalize">${p.estado}</span>
                                                </div>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            logView() {
                return `
                    <div class="page-header">
                        <h1 class="page-title">Grow Log</h1>
                        <button class="btn btn-primary" onclick="handlers.openModal('log-modal')">
                            <i class="fa-solid fa-plus"></i> Nueva Entrada
                        </button>
                    </div>
                    
                    <div class="card">
                        <div class="timeline">
                            ${state.logs.map(l => this._logItem(l)).join('')}
                        </div>
                    </div>
                `;
            },

            tasksView() {
                const incomplete = state.tasks.filter(t => !t.completada);
                const complete = state.tasks.filter(t => t.completada);
                
                return `
                    <div class="page-header">
                        <h1 class="page-title">Gestor de Tareas</h1>
                        <button class="btn btn-primary" onclick="handlers.openModal('task-modal')">
                            <i class="fa-solid fa-plus"></i> Nueva Tarea
                        </button>
                    </div>
                    
                    <div class="grid-2col">
                        <div>
                            <h3 style="margin-bottom: 16px;">Pendientes (${incomplete.length})</h3>
                            <div class="task-list">
                                ${incomplete.length ? incomplete.map(t => this._taskItem(t)).join('') : '<div class="empty-state">Todo al día</div>'}
                            </div>
                        </div>
                        <div>
                            <h3 style="margin-bottom: 16px; color: var(--text-secondary)">Completadas (${complete.length})</h3>
                            <div class="task-list">
                                ${complete.map(t => this._taskItem(t)).join('')}
                            </div>
                        </div>
                    </div>
                `;
            },

            metricsView() {
                const latest = state.envRecords[0] || {};
                return `
                    <div class="page-header">
                        <h1 class="page-title">Métricas Ambientales</h1>
                        <button class="btn btn-primary" onclick="handlers.openModal('metric-modal')">
                            <i class="fa-solid fa-plus"></i> Registrar Medición
                        </button>
                    </div>

                    <div class="grid-kpi">
                        <div class="card kpi-card">
                            <span class="kpi-label">pH Suelo/Solución</span>
                            <div class="kpi-value">${latest.ph || '--'}</div>
                        </div>
                        <div class="card kpi-card">
                            <span class="kpi-label">EC (mS/cm)</span>
                            <div class="kpi-value">${latest.ec || '--'}</div>
                        </div>
                        <div class="card kpi-card">
                            <span class="kpi-label">DLI (mol/m²)</span>
                            <div class="kpi-value" style="color: var(--status-alert)">${latest.dli || '--'}</div>
                        </div>
                    </div>

                    <div class="card" style="padding: 0; overflow: hidden;">
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Zona</th>
                                        <th>Temp</th>
                                        <th>Humedad</th>
                                        <th>VPD</th>
                                        <th>pH</th>
                                        <th>EC</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${state.envRecords.map(e => `
                                        <tr>
                                            <td>${utils.formatDate(e.fecha)}</td>
                                            <td>${e.zona}</td>
                                            <td>${e.temperatura} °C</td>
                                            <td>${e.humedad} %</td>
                                            <td>${e.vpd} kPa</td>
                                            <td>${e.ph}</td>
                                            <td>${e.ec}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            // Sub-components
            _badgeEtapa(etapa) {
                const map = {
                    'vegetativo': '<span class="badge badge-veg">Vegetativo</span>',
                    'floración': '<span class="badge badge-flower">Floración</span>',
                    'germinación': '<span class="badge badge-germ">Germinación</span>',
                    'cosecha': '<span class="badge badge-harvest">Cosecha</span>'
                };
                return map[etapa] || `<span class="badge">${etapa}</span>`;
            },

            _taskItem(t) {
                return `
                    <div class="task-item ${t.completada ? 'completed' : ''}">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" class="custom-checkbox" 
                                ${t.completada ? 'checked' : ''} 
                                onchange="handlers.toggleTask('${t.id}')">
                        </div>
                        <div class="task-content">
                            <div class="task-title">${t.titulo}</div>
                            <div class="task-meta">
                                <span class="priority-${t.prioridad}">
                                    <i class="fa-solid ${t.prioridad==='alta'?'fa-flag':'fa-circle'}"></i> 
                                    ${t.prioridad.toUpperCase()}
                                </span>
                                <span><i class="fa-regular fa-calendar"></i> ${utils.formatDate(t.fecha)}</span>
                                ${t.plantId ? `<span><i class="fa-solid fa-tag"></i> ${utils.getPlantName(t.plantId)}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            },

            _logItem(l) {
                const iconMap = {
                    'observación': 'fa-eye', 'nutrición': 'fa-flask', 'poda': 'fa-scissors', 
                    'incidente': 'fa-triangle-exclamation', 'cosecha': 'fa-basket-shopping'
                };
                const icon = iconMap[l.tipo] || 'fa-note-sticky';
                
                return `
                    <div class="log-item log-type-${l.tipo}">
                        <div class="log-marker"></div>
                        <div class="log-header">
                            <span class="log-date">${utils.formatDateTime(l.fecha)}</span>
                            <span class="log-plant">${utils.getPlantName(l.plantId)} <span style="color:var(--text-secondary); margin-left:8px; font-size:11px; text-transform:uppercase;">${l.tipo}</span></span>
                        </div>
                        <div class="log-body">
                            <i class="fa-solid ${icon}" style="margin-right: 8px; color: var(--text-secondary);"></i>
                            ${l.nota}
                        </div>
                    </div>
                `;
            },

            // Modals Injection
            modalHtml(id, title, formBody) {
                return `
                    <div id="${id}" class="modal-overlay" onclick="handlers.closeModal(event, '${id}')">
                        <div class="modal-content" onclick="event.stopPropagation()">
                            <div class="modal-header">
                                <h2>${title}</h2>
                                <i class="fa-solid fa-xmark modal-close" onclick="handlers.closeModal(null, '${id}', true)"></i>
                            </div>
                            <form onsubmit="handlers.submitForm(event, '${id}')">
                                ${formBody}
                                <div class="form-actions">
                                    <button type="button" class="btn btn-outline" onclick="handlers.closeModal(null, '${id}', true)">Cancelar</button>
                                    <button type="submit" class="btn btn-primary">Guardar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            },

            plantOptions() {
                return state.plants.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
            },

            setupModals() {
                const container = document.getElementById('modals-container');
                
                const taskForm = `
                    <div class="form-group">
                        <label class="form-label">Título de Tarea</label>
                        <input type="text" class="form-control" name="titulo" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Fecha</label>
                            <input type="date" class="form-control" name="fecha" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Prioridad</label>
                            <select class="form-control" name="prioridad">
                                <option value="alta">Alta</option>
                                <option value="media" selected>Media</option>
                                <option value="baja">Baja</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Planta Asociada (Opcional)</label>
                        <select class="form-control" name="plantId">
                            <option value="">General (Ninguna en específico)</option>
                            ${this.plantOptions()}
                        </select>
                    </div>
                `;

                const plantForm = `
                    <div class="form-group">
                        <label class="form-label">Nombre Identificador</label>
                        <input type="text" class="form-control" name="nombre" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Variedad / Genética</label>
                            <input type="text" class="form-control" name="variedad" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Etapa Actual</label>
                            <select class="form-control" name="etapa">
                                <option value="germinación">Germinación</option>
                                <option value="vegetativo">Vegetativo</option>
                                <option value="floración">Floración</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Sistema</label>
                            <select class="form-control" name="sistema">
                                <option value="tierra">Tierra / Sustrato</option>
                                <option value="hidro">Hidroponía</option>
                                <option value="aeropónico">Aeroponía</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Ubicación</label>
                            <input type="text" class="form-control" name="ubicacion" placeholder="Ej: Carpa A" required>
                        </div>
                    </div>
                `;

                const logForm = `
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Tipo de Registro</label>
                            <select class="form-control" name="tipo">
                                <option value="observación">Observación</option>
                                <option value="nutrición">Nutrición / Riego</option>
                                <option value="poda">Poda / Entrenamiento</option>
                                <option value="incidente">Incidente / Plaga</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Planta Asociada</label>
                            <select class="form-control" name="plantId" required>
                                ${this.plantOptions()}
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Notas</label>
                        <textarea class="form-control" name="nota" rows="4" required></textarea>
                    </div>
                `;

                container.innerHTML = `
                    ${this.modalHtml('task-modal', 'Nueva Tarea', taskForm)}
                    ${this.modalHtml('plant-modal', 'Nueva Planta', plantForm)}
                    ${this.modalHtml('log-modal', 'Nuevo Registro', logForm)}
                    ${this.modalHtml('metric-modal', 'Próximamente', '<p style="color:var(--text-secondary)">Funcionalidad en desarrollo.</p>')}
                `;
            }
        };

        /* =========================================================================
           5. HANDLERS
           ========================================================================= */
        const handlers = {
            toggleTask(id) {
                const task = state.tasks.find(t => t.id === id);
                if(task) {
                    task.completada = !task.completada;
                    // Re-render only if in tasks or dashboard
                    if(state.activeView === 'tasks' || state.activeView === 'dashboard') {
                        render.app();
                    }
                }
            },
            
            toggleTheme() {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', state.theme);
                const icon = document.querySelector('#theme-toggle i');
                icon.className = state.theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            },

            toggleSidebar() {
                document.getElementById('sidebar').classList.toggle('open');
                document.getElementById('sidebar-overlay').classList.toggle('active');
            },

            openModal(modalId) {
                const modal = document.getElementById(modalId);
                if(modal) modal.classList.add('active');
            },

            closeModal(e, modalId, force = false) {
                // Close if forced (X button or Cancel) OR clicked exactly on overlay
                if(force || (e && e.target.id === modalId)) {
                    document.getElementById(modalId).classList.remove('active');
                }
            },

            submitForm(e, modalId) {
                e.preventDefault();
                const form = e.target;
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());
                
                if (modalId === 'task-modal') {
                    state.tasks.unshift({
                        id: utils.generateId(),
                        titulo: data.titulo,
                        fecha: data.fecha,
                        prioridad: data.prioridad,
                        completada: false,
                        plantId: data.plantId || null
                    });
                } else if (modalId === 'plant-modal') {
                    state.plants.unshift({
                        id: utils.generateId(),
                        nombre: data.nombre,
                        variedad: data.variedad,
                        etapa: data.etapa,
                        sistema: data.sistema,
                        ubicacion: data.ubicacion,
                        fechaInicio: new Date().toISOString(),
                        estado: 'activa'
                    });
                    render.setupModals(); // Rebuild modals to include new plant in selects
                } else if (modalId === 'log-modal') {
                    state.logs.unshift({
                        id: utils.generateId(),
                        plantId: data.plantId,
                        tipo: data.tipo,
                        fecha: new Date().toISOString(),
                        nota: data.nota
                    });
                }

                form.reset();
                this.closeModal(null, modalId, true);
                render.app();
            }
        };

        /* =========================================================================
           6. ROUTER
           ========================================================================= */
        const router = {
            handleHashChange() {
                const hash = window.location.hash.replace('#', '') || 'dashboard';
                const validRoutes = ['dashboard', 'plants', 'log', 'tasks', 'metrics'];
                
                if (validRoutes.includes(hash)) {
                    state.activeView = hash;
                    render.app();
                } else {
                    window.location.hash = 'dashboard';
                }

                // Close mobile sidebar on navigation
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebar-overlay').classList.remove('active');
            },
            
            init() {
                window.addEventListener('hashchange', this.handleHashChange);
                // Trigger initial route
                this.handleHashChange();
            }
        };

        /* =========================================================================
           7. INIT
           ========================================================================= */
        function initApp() {
            loadSeedData();
            render.setupModals();
            router.init();

            // Event Listeners for UI
            document.getElementById('theme-toggle').addEventListener('click', handlers.toggleTheme);
            document.getElementById('menu-toggle').addEventListener('click', handlers.toggleSidebar);
            document.getElementById('sidebar-overlay').addEventListener('click', handlers.toggleSidebar);
            
            // Global Escape key handler for modals
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal-overlay.active').forEach(modal => {
                        modal.classList.remove('active');
                    });
                }
            });
        }

        // Boot the application
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
