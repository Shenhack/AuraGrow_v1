<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraGrow | Gestión de Cultivo Profesional</title>
    
    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* === CSS VARIABLES === */
        :root, [data-theme="dark"], [data-theme="light"] {
            /* Color Palette */
            --bg-main: #050505;
            --bg-surface: #111111;
            --bg-surface-hover: #1a1a1a;
            --bg-surface-active: #222222;
            
            --border-color: rgba(255, 255, 255, 0.08);
            --border-light: rgba(255, 255, 255, 0.15);
            
            --text-primary: #f8f8f8;
            --text-secondary: #a1a1aa;
            
            --accent-teal: #10b981;
            --accent-teal-hover: #34d399;
            --accent-teal-dim: rgba(16, 185, 129, 0.15);
            
            --status-optimal: #10b981;
            --status-optimal-dim: rgba(16, 185, 129, 0.15);
            --status-alert: #f59e0b;
            --status-alert-dim: rgba(245, 158, 11, 0.15);
            --status-critical: #ef4444;
            --status-critical-dim: rgba(239, 68, 68, 0.15);
            --status-info: #3b82f6;
            --status-info-dim: rgba(59, 130, 246, 0.15);
            
            /* Geometry */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-pill: 9999px;
            
            /* Typography */
            --font-main: 'Outfit', system-ui, sans-serif;
            --font-mono: 'Roboto Mono', monospace;
            
            /* Layout */
            --sidebar-width: 280px;
            --topbar-height: 80px;
            --transition-speed: 0.3s;
            
            /* Effects */
            --shadow-card: 0 8px 30px rgba(0,0,0,0.4);
            --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 20px rgba(16, 185, 129, 0.15);
        }

        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main);
        }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            overflow: hidden;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        a { text-decoration: none; color: inherit; }
        button, input, select, textarea { font-family: inherit; font-size: inherit; }
        button { cursor: pointer; border: none; background: transparent; }
        
        /* === LAYOUT === */
        .app-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 40;
            transition: transform var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 150px;
            background: radial-gradient(circle at top left, rgba(16, 185, 129, 0.1), transparent 70%);
            pointer-events: none;
        }

        .brand {
            height: var(--topbar-height);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            color: var(--accent-teal);
            font-size: 24px;
        }
        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .nav-menu {
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-item:hover {
            color: var(--text-primary);
            background-color: var(--bg-surface-hover);
        }

        .nav-item.active {
            color: var(--accent-teal);
            background-color: var(--accent-teal-dim);
        }
        
        .nav-item i { width: 20px; text-align: center; }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-speed);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

        .topbar {
            height: var(--topbar-height);
            background: rgba(5, 5, 5, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 10;
            position: sticky;
            top: 0;
        }

        .header-search {
            display: flex;
            align-items: center;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-pill);
            padding: 8px 16px;
            width: 300px;
            transition: var(--transition-speed);
        }

        .header-search:focus-within {
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px var(--accent-teal-dim);
        }

        .header-search input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            outline: none;
            margin-left: 10px;
            width: 100%;
            font-family: var(--font-main);
        }

        .search-results-dropdown {
            position: absolute;
            top: calc(var(--topbar-height) - 10px);
            left: 40px;
            width: 400px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-modal);
            max-height: 400px;
            overflow-y: auto;
            z-index: 50;
            display: none;
            padding: 8px 0;
        }

        .search-result-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid var(--border-color);
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover { background: var(--bg-surface-hover); }
        .search-result-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--accent-teal-dim); color: var(--accent-teal); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .search-result-text { flex: 1; min-width: 0; }
        .search-result-text h4 { font-size: 14px; margin-bottom: 2px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .search-result-text p { font-size: 12px; color: var(--text-secondary); margin: 0; }

        .menu-toggle {
            display: none;
            font-size: 20px;
            color: var(--text-primary);
            padding: 8px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .btn-icon:hover {
            background-color: var(--bg-surface-hover);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .view-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
        }

        /* === ANIMATIONS === */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-view { animation: fadeIn 0.4s ease-out forwards; }

        /* === COMPONENTS === */
        /* Typography */
        h1, h2, h3 { font-weight: 700; color: var(--text-primary); }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-title { font-size: 24px; letter-spacing: -0.02em; }
        .section-title { font-size: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .btn-primary { background-color: var(--accent-teal); color: #ffffff; }
        .btn-primary:hover { background-color: var(--accent-teal-hover); }
        .btn-outline { background-color: transparent; border-color: var(--border-color); color: var(--text-primary); }
        .btn-outline:hover { background-color: var(--bg-surface-hover); }

        /* Cards */
        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-card);
        }

        /* Grid Layouts */
        .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .grid-2col { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }

        /* KPI Card */
        .kpi-card { display: flex; flex-direction: column; gap: 12px; }
        .kpi-label { color: var(--text-secondary); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
        .kpi-value { font-size: 36px; font-weight: 700; font-family: var(--font-mono); line-height: 1; display: flex; align-items: baseline; gap: 4px; }
        .kpi-unit { font-size: 14px; color: var(--text-secondary); font-weight: 500; font-family: var(--font-main); }

        /* Aura IA Chat */
        .chat-container { display: flex; flex-direction: column; height: calc(100vh - 180px); background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px solid var(--border-color); overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .chat-bubble { max-width: 80%; padding: 16px; border-radius: var(--radius-md); font-size: 14px; line-height: 1.5; }
        .chat-bubble.user { align-self: flex-end; background: var(--bg-surface-hover); color: var(--text-primary); border-bottom-right-radius: 4px; }
        .chat-bubble.ai { align-self: flex-start; background: var(--bg-surface-active); color: var(--text-primary); border: 1px solid var(--accent-teal); border-bottom-left-radius: 4px; box-shadow: 0 0 10px var(--accent-teal-dim); }
        .chat-input-area { padding: 16px; border-top: 1px solid var(--border-color); display: flex; gap: 12px; background: var(--bg-surface); }
        .chat-input { flex: 1; padding: 12px 16px; border-radius: var(--radius-pill); border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-primary); }
        .chat-input:focus { outline: none; border-color: var(--accent-teal); }

        /* Badges & Status */
        .badge {
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge-veg { background-color: var(--status-optimal-dim); color: var(--status-optimal); }
        .badge-flower { background-color: var(--accent-teal-dim); color: var(--accent-teal); }
        .badge-germ { background-color: var(--status-info-dim); color: var(--status-info); }
        .badge-harvest { background-color: var(--status-alert-dim); color: var(--status-alert); }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-optimal { background-color: var(--status-optimal); box-shadow: 0 0 8px var(--status-optimal-dim); }
        .status-alert { background-color: var(--status-alert); box-shadow: 0 0 8px var(--status-alert-dim); }
        .status-critical { background-color: var(--status-critical); box-shadow: 0 0 8px var(--status-critical-dim); }

        /* Tables */
        .table-wrapper { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; text-align: left; background-color: var(--bg-surface); }
        th { 
            padding: 16px; 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--text-secondary); 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-surface);
            position: sticky; top: 0; z-index: 5;
        }
        td { padding: 16px; border-bottom: 1px solid var(--border-color); font-size: 14px; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background-color: var(--bg-surface-hover); }

        /* Tasks */
        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-item {
            display: flex; align-items: flex-start; gap: 16px;
            padding: 16px; background: var(--bg-surface-hover);
            border-radius: var(--radius-md); border: 1px solid var(--border-color);
            transition: opacity 0.3s;
        }
        .task-item.completed { opacity: 0.6; }
        .task-item.completed .task-title { text-decoration: line-through; color: var(--text-secondary); }
        
        .checkbox-wrapper { padding-top: 2px; }
        .custom-checkbox {
            appearance: none; width: 20px; height: 20px;
            border: 2px solid var(--border-color); border-radius: 4px;
            cursor: pointer; position: relative; transition: all 0.2s;
            background: var(--bg-surface);
        }
        .custom-checkbox:checked { background-color: var(--accent-teal); border-color: var(--accent-teal); }
        .custom-checkbox:checked::after {
            content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            color: white; font-size: 12px; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .task-content { flex: 1; }
        .task-title { font-weight: 500; margin-bottom: 4px; transition: color 0.2s; }
        .task-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 12px; }
        .priority-alta { color: var(--status-critical); }
        .priority-media { color: var(--status-alert); }
        .priority-baja { color: var(--status-info); }

        /* Logs Timeline */
        .timeline { position: relative; padding-left: 24px; display: flex; flex-direction: column; gap: 20px; }
        .timeline::before { content: ''; position: absolute; left: 7px; top: 8px; bottom: 0; width: 2px; background: var(--border-color); }
        .log-item { position: relative; }
        .log-marker {
            position: absolute; left: -24px; top: 4px; width: 16px; height: 16px;
            border-radius: 50%; background: var(--bg-surface); border: 2px solid var(--accent-teal); z-index: 1;
        }
        .log-type-nutrición .log-marker { border-color: var(--status-info); }
        .log-type-incidente .log-marker { border-color: var(--status-critical); }
        .log-type-poda .log-marker { border-color: var(--status-alert); }
        
        .log-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
        .log-date { color: var(--text-secondary); }
        .log-plant { color: var(--accent-teal); font-weight: 500; }
        .log-body { background: var(--bg-surface-hover); padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; border: 1px solid var(--border-color); }

        /* Modals */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: all 0.3s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--bg-surface); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); width: 100%; max-width: 500px;
            padding: 32px; box-shadow: var(--shadow-modal);
            transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-close { color: var(--text-secondary); font-size: 20px; cursor: pointer; transition: color 0.2s; }
        .modal-close:hover { color: var(--text-primary); }

        /* Forms */
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 500; color: var(--text-secondary); }
        .form-control {
            width: 100%; padding: 12px; background: var(--bg-main);
            border: 1px solid var(--border-color); border-radius: var(--radius-md);
            color: var(--text-primary); transition: border-color 0.2s;
        }
        .form-control:focus { outline: none; border-color: var(--accent-teal); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; }

        /* === RESPONSIVE === */
        @media (max-width: 1024px) {
            .grid-2col { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 768px) {
            .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.active { opacity: 1; pointer-events: auto; }
            .menu-toggle { display: block; }
            .topbar { padding: 0 16px; }
            .view-container { padding: 16px; }
            .page-title { font-size: 20px; }
            .grid-kpi { grid-template-columns: 1fr 1fr; }
        }
        
        @media (max-width: 480px) {
            .grid-kpi { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }

        /* Empty States */
        .empty-state {
            padding: 40px 20px; text-align: center; color: var(--text-secondary);
            background: var(--bg-surface-hover); border-radius: var(--radius-md);
            border: 1px dashed var(--border-color);
        }
        .empty-state i { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
    </style>
</head>
<body>

    <div id="app" class="app-layout">
        
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-leaf brand-logo"></i>
                <span class="brand-name">AuraGrow</span>
            </div>
            <nav class="nav-menu">
                <a href="#dashboard" class="nav-item active" data-route="dashboard">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </a>
                <a href="#plants" class="nav-item" data-route="plants">
                    <i class="fa-solid fa-seedling"></i> Plantas
                </a>
                <a href="#log" class="nav-item" data-route="log">
                    <i class="fa-solid fa-book-open"></i> Grow Log
                </a>
                <a href="#tasks" class="nav-item" data-route="tasks">
                    <i class="fa-solid fa-list-check"></i> Tareas
                </a>
                <a href="#metrics" class="nav-item" data-route="metrics">
                    <i class="fa-solid fa-temperature-half"></i> Métricas
                </a>
                <a href="#aura-chat" class="nav-item" data-route="aura-chat">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Aura IA
                </a>
            </nav>
        </aside>
        
        <!-- Mobile Overlay -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <button id="menu-toggle" class="menu-toggle" aria-label="Toggle Menu">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="header-search">
                        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-secondary)"></i>
                        <input type="text" id="global-search" placeholder="Buscar plantas, tareas, espacios..." autocomplete="off">
                    </div>
                </div>
                
                <div class="topbar-actions">
                    <button id="theme-toggle" class="btn-icon" aria-label="Toggle Theme">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <button class="btn-icon" style="position: relative;">
                        <i class="fa-solid fa-bell"></i>
                        <span style="position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; background: var(--status-critical); border-radius: 50%;"></span>
                    </button>
                    <div style="display: flex; align-items: center; gap: 12px; padding: 6px 16px 6px 6px; background: var(--bg-surface-hover); border-radius: var(--radius-pill); cursor: pointer;">
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--accent-teal); color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold;">
                            MG
                        </div>
                        <span style="font-size: 13px; font-weight: 500;">Master Grower</span>
                    </div>
                </div>
                
                <!-- Search Results Dropdown -->
                <div id="search-results" class="search-results-dropdown"></div>
            </header>

            <!-- View Container -->
            <div id="app-content" class="view-container">
                <!-- Content injected via JS -->
            </div>
        </main>
    </div>

    <!-- Modals Container -->
    <div id="modals-container"></div>

    <script>
        /* =========================================================================
           1. STATE
           ========================================================================= */
        const state = {
            selectedSpaceId: null,
            spaces: [],
            plants: [],
            logs: [],
            tasks: [],
            envRecords: [],
            cycles: [],
            activeView: 'dashboard',
            theme: 'dark'
        };

        // PERSISTENCIA
        const STORAGE_KEY = 'auraGrow_v1';

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                Object.assign(state, parsed);
                return true;
            }
            return false;
        }

        /* =========================================================================
           2. SEED_DATA
           ========================================================================= */
        function loadSeedData() {
            const today = new Date();
            const formatStr = (d) => d.toISOString();
            
            // Generate some dates relative to today
            const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
            const twoDaysAgo = new Date(today); twoDaysAgo.setDate(twoDaysAgo.getDate() - 2);
            const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);

            state.spaces = [
                { id: 's1', nombre: 'Carpa A', tipo: 'interior', sustrato: 'tierra', luz: 'LED 300W' },
                { id: 's2', nombre: 'Sistema Hidro 1', tipo: 'interior', sustrato: 'hidroponía', luz: 'LED 400W' },
                { id: 's3', nombre: 'Invernadero Exterior', tipo: 'exterior', sustrato: 'tierra', luz: 'Sol' }
            ];

            state.plants = [
                { id: 'p1', nombre: 'OG Kush Alpha', variedad: 'OG Kush', etapa: 'floración', fechaInicio: '2023-09-01', spaceId: 's1', sistema: 'tierra', estado: 'activa' },
                { id: 'p2', nombre: 'Blue Dream #1', variedad: 'Blue Dream', etapa: 'floración', fechaInicio: '2023-09-10', spaceId: 's1', sistema: 'hidro', estado: 'activa' },
                { id: 'p3', nombre: 'Amnesia Haze', variedad: 'Amnesia Haze', etapa: 'vegetativo', fechaInicio: '2023-10-15', spaceId: 's2', sistema: 'aeropónico', estado: 'activa' },
                { id: 'p4', nombre: 'Gelato 41', variedad: 'Gelato 41', etapa: 'vegetativo', fechaInicio: '2023-10-20', spaceId: 's2', sistema: 'tierra', estado: 'activa' }
            ];

            state.logs = [
                { id: 'l1', plantId: 'p1', fecha: formatStr(today), tipo: 'observación', nota: 'Aparición de tricomas lechosos. Muy buen aroma.' },
                { id: 'l2', plantId: 'p2', fecha: formatStr(yesterday), tipo: 'nutrición', nota: 'Cambio de solución hidropónica. EC subida a 1.8' },
                { id: 'l3', plantId: 'p3', fecha: formatStr(twoDaysAgo), tipo: 'poda', nota: 'Topping realizado en 4to nudo.' },
                { id: 'l4', plantId: 'p4', fecha: formatStr(twoDaysAgo), tipo: 'incidente', nota: 'Leve estrés hídrico detectado, riego aumentado.' },
                { id: 'l5', plantId: 'p1', fecha: formatStr(new Date(today.getTime() - 86400000*3)), tipo: 'observación', nota: 'Desarrollo floral vigoroso.' }
            ];

            state.tasks = [
                { id: 't1', titulo: 'Calibrar medidor de pH', fecha: formatStr(today), prioridad: 'alta', completada: false, plantId: null },
                { id: 't2', titulo: 'Defoliación de bajos', fecha: formatStr(tomorrow), prioridad: 'media', completada: false, plantId: 'p1' },
                { id: 't3', titulo: 'Limpiar filtros de aire', fecha: formatStr(tomorrow), prioridad: 'baja', completada: false, plantId: null },
                { id: 't4', titulo: 'Riego con bioestimulante', fecha: formatStr(yesterday), prioridad: 'alta', completada: true, plantId: 'p4' },
                { id: 't5', titulo: 'Revisar extractores', fecha: formatStr(twoDaysAgo), prioridad: 'media', completada: true, plantId: null },
                { id: 't6', titulo: 'Aplicar preventivo foliar', fecha: formatStr(today), prioridad: 'alta', completada: false, plantId: 'p3' }
            ];

            // 7 days of env records
            for(let i=0; i<7; i++) {
                let d = new Date(); d.setDate(d.getDate() - i);
                state.envRecords.push({
                    id: 'e'+i,
                    fecha: formatStr(d),
                    zona: 'Carpa A',
                    temperatura: (24 + Math.random()*2).toFixed(1),
                    humedad: (50 + Math.random()*10).toFixed(0),
                    vpd: (1.0 + Math.random()*0.3).toFixed(2),
                    ph: 6.2,
                    ec: 1.8,
                    dli: 38,
                    tempAgua: 21
                });
            }

            state.cycles = [
                { id: 'c1', nombre: 'Cosecha Otoño - Carpa A', fechaInicio: '2023-09-01', fechaFin: '2023-11-15', etapa: 'floración', plantIds: ['p1', 'p2'] },
                { id: 'c2', nombre: 'Vegetativo - Carpa B', fechaInicio: '2023-10-15', fechaFin: null, etapa: 'vegetativo', plantIds: ['p3', 'p4'] }
            ];
        }

        /* =========================================================================
           3. UTILS
           ========================================================================= */
        const utils = {
            formatDate(isoString) {
                const date = new Date(isoString);
                return date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
            },
            formatDateTime(isoString) {
                const date = new Date(isoString);
                return date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute:'2-digit' });
            },
            daysBetween(date1, date2 = new Date()) {
                const diffTime = Math.abs(new Date(date2) - new Date(date1));
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            },
            generateId() {
                return '_' + Math.random().toString(36).substr(2, 9);
            },
            getPlantName(id) {
                const plant = state.plants.find(p => p.id === id);
                return plant ? plant.nombre : 'General';
            },
            getPlantStatusColor(plant) {
                // Mock logic for status
                if (plant.estado !== 'activa') return 'status-info';
                // Find recent logs for alerts
                const recentAlerts = state.logs.filter(l => l.plantId === plant.id && l.tipo === 'incidente');
                if (recentAlerts.length > 0) return 'status-alert';
                return 'status-optimal';
            }
        };

        /* =========================================================================
           4. RENDER
           ========================================================================= */

                    case 'aura-chat': html = this.auraChatView(); break;

            },

            dashboardView() {

                        </div>
                        <div class="card kpi-card">
                            <span class="kpi-label">Temperatura</span>
                            <div class="kpi-value">${latestEnv.temperatura || '--'} <span class="kpi-unit">°C</span></div>
                        </div>
                        <div class="card kpi-card">
                            <span class="kpi-label">Humedad</span>
                            <div class="kpi-value">${latestEnv.humedad || '--'} <span class="kpi-unit">%</span></div>
                        </div>
                        <div class="card kpi-card">
                            <span class="kpi-label">Plantas Activas</span>
                            <div class="kpi-value">${activePlants.length} <span class="kpi-unit">total</span></div>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                                <span class="badge badge-veg">${vegCount} Veg</span>
                                <span class="badge badge-flower">${floCount} Flo</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid-2col">

                            <div class="section-title">
                                <i class="fa-solid fa-list-check" style="color: var(--accent-teal)"></i> Tareas de Hoy
                            </div>
                            ${pendingTasks.length > 0 ? `
                                <div class="task-list">

                            <div class="timeline">
                                ${recentLogs.map(l => this._logItem(l)).join('')}
                            </div>
                        </div>
                    </div>
                `;
            },

            plantsView() {
                // NIVEL 2: VISTA DENTRO DE UN ESPACIO
                if (state.selectedSpaceId) {
                    const space = state.spaces.find(s => s.id === state.selectedSpaceId);
                    if (!space) return this.backToSpaces();
                    
                    const spacePlants = state.plants.filter(p => p.spaceId === space.id);

                    let html = `

                    </div>`;
                    return html;

                // NIVEL 1: DIRECTORIO DE ESPACIOS

                html += `</div>`;

                return html;

            renderPlantsTable(plants) {

                <table style="width: 100%;">

            },

            // Sub-components
            _badgeEtapa(etapa) {

                    'floración': '<span class="badge badge-flower">Floración</span>',

                                    ${t.prioridad.toUpperCase()}
                                </span>
                                <span><i class="fa-regular fa-calendar"></i> ${utils.formatDate(t.fecha)}</span>
                                ${t.plantId ? `<span><i class="fa-solid fa-tag"></i> ${utils.getPlantName(t.plantId)}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            },

            _logItem(l) {
                const iconMap = {
                    'observación': 'fa-eye', 'nutrición': 'fa-flask', 'poda': 'fa-scissors', 
                    'incidente': 'fa-triangle-exclamation', 'cosecha': 'fa-basket-shopping'
                };
                const icon = iconMap[l.tipo] || 'fa-note-sticky';
                
                return `
                    <div class="log-item log-type-${l.tipo}">
                        <div class="log-marker"></div>
                        <div class="log-header">
                            <span class="log-date">${utils.formatDateTime(l.fecha)}</span>
                            <span class="log-plant">${utils.getPlantName(l.plantId)} <span style="color:var(--text-secondary); margin-left:8px; font-size:11px; text-transform:uppercase;">${l.tipo}</span></span>
                        </div>
                        <div class="log-body">
                            <div style="margin-bottom: ${l.foto ? '12px' : '0'};">
                                <i class="fa-solid ${icon}" style="margin-right: 8px; color: var(--text-secondary);"></i>
                                ${l.nota}
                            </div>
                            ${l.foto ? `<img src="${l.foto}" style="max-width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border-color);">` : ''}
                        </div>
                    </div>
                `;
            },

            // Modals Injection
            modalHtml(id, title, formBody) {
                return `
                    <div id="${id}" class="modal-overlay" onclick="handlers.closeModal(event, '${id}')">
                        <div class="modal-content" onclick="event.stopPropagation()">
                            <div class="modal-header">
                                <h2>${title}</h2>
                                <i class="fa-solid fa-xmark modal-close" onclick="handlers.closeModal(null, '${id}', true)"></i>
                            </div>
                            <form onsubmit="handlers.submitForm(event, '${id}')">
                                ${formBody}
                                <div class="form-actions">
                                    <button type="button" class="btn btn-outline" onclick="handlers.closeModal(null, '${id}', true)">Cancelar</button>
                                    <button type="submit" class="btn btn-primary">Guardar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            },

            plantOptions() {
                return state.plants.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
            },

            spaceOptions() {
                if (!state.spaces || state.spaces.length === 0) return `<option value="" disabled selected>Crea un espacio primero</option>`;
                return state.spaces.map(s => `<option value="${s.id}">${s.nombre}</option>`).join('');
            },

            setupModals() {
                const container = document.getElementById('modals-container');

                const spaceForm = `
                    <input type="hidden" name="spaceId" id="edit-space-id" value="">
                    <div class="form-group">
                        <label class="form-label">Nombre del Espacio</label>
                        <input type="text" class="form-control" name="nombre" placeholder="Ej: Sala Vegetativo 1" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Entorno</label>
                            <select class="form-control" name="tipo" required>
                                <option value="interior">Interior (Indoor)</option>
                                <option value="exterior">Exterior (Outdoor)</option>
                                <option value="invernadero">Invernadero</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Medio de Cultivo</label>
                            <select class="form-control" name="sustrato" required>
                                <option value="tierra">Tierra / Sustrato</option>
                                <option value="coco">Fibra de Coco</option>
                                <option value="hidroponia">Hidroponía (DWC / NFT)</option>
                                <option value="aeroponia">Aeroponía</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Iluminación Principal</label>
                        <input type="text" class="form-control" name="luz" placeholder="Ej: LED Samsung 300W o Sol" required>
                    </div>
                `;

                const movePlantForm = `
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Mover a Espacio</label>
                            <select class="form-control" id="move-space-select" name="spaceId" required>
                                ${this.spaceOptions()}
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Actualizar Etapa</label>
                            <select class="form-control" id="move-etapa-select" name="etapa" required>
                                <option value="germinación">Germinación</option>
                                <option value="vegetativo">Vegetativo</option>
                                <option value="floración">Floración</option>
                                <option value="cosecha">Cosecha</option>
                            </select>
                        </div>
                    </div>
                `;
                
                const taskForm = `
                    <div class="form-group">
                        <label class="form-label">Título de Tarea</label>
                        <input type="text" class="form-control" name="titulo" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Fecha</label>
                            <input type="date" class="form-control" name="fecha" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Prioridad</label>
                            <select class="form-control" name="prioridad">
                                <option value="alta">Alta</option>
                                <option value="media" selected>Media</option>
                                <option value="baja">Baja</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Planta Asociada (Opcional)</label>
                        <select class="form-control" name="plantId">
                            <option value="">General (Ninguna en específico)</option>
                            ${this.plantOptions()}
                        </select>
                    </div>
                `;

                const plantForm = `
                    <div class="form-row">
                        <div class="form-group" style="flex: 3;">
                            <label class="form-label">Nombre Identificador</label>
                            <input type="text" class="form-control" name="nombre" placeholder="Ej: OG Kush" required>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label">Cantidad</label>
                            <input type="number" class="form-control" name="cantidad" value="1" min="1" max="100" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Variedad / Genética</label>
                            <input type="text" class="form-control" name="variedad" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Etapa Actual</label>
                            <select class="form-control" name="etapa">
                                <option value="germinación">Germinación</option>
                                <option value="vegetativo">Vegetativo</option>
                                <option value="floración">Floración</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Sistema</label>
                            <select class="form-control" name="sistema">
                                <option value="tierra">Tierra / Sustrato</option>
                                <option value="hidro">Hidroponía</option>
                                <option value="aeropónico">Aeroponía</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Espacio Asignado</label>
                            <select class="form-control" name="spaceId" required>
                                ${this.spaceOptions()}
                            </select>
                        </div>
                    </div>
                `;

                const logForm = `
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Tipo de Evento</label>
                            <select class="form-control" name="tipo" id="tipo_evento" onchange="handlers.toggleLogFields()" required>
                                <option value="">Seleccione una opción</option>
                                <option value="Riego">Riego</option>
                                <option value="Medicion">Medición Ambiental</option>
                                <option value="Nutrientes">Nutrientes</option>
                                <option value="Poda">Poda</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Planta Asociada</label>
                            <select class="form-control" name="plantId" id="log_planta_id" required>
                                ${this.plantOptions()}
                            </select>
                        </div>
                    </div>

                    <!-- Campos: Riego -->
                    <div id="fields-riego" style="display: none;">
                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                            <div class="form-group">
                                <label class="form-label">Volumen (ml)</label>
                                <input type="number" class="form-control" name="volumen_ml" placeholder="Ej: 500">
                            </div>
                            <div class="form-group">
                                <label class="form-label">pH</label>
                                <input type="number" step="0.1" class="form-control" name="ph" placeholder="Ej: 6.2">
                            </div>
                            <div class="form-group">
                                <label class="form-label">EC</label>
                                <input type="number" step="0.1" class="form-control" name="ec" placeholder="Ej: 1.2">
                            </div>
                        </div>
                    </div>

                    <!-- Campos: Medición Ambiental (con VPD) -->
                    <div id="fields-medicion" style="display: none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Temperatura (°C)</label>
                                <input type="number" step="0.1" class="form-control" id="log_temp" name="temperatura" placeholder="Ej: 24.5" oninput="handlers.actualizarSemaforoVPD()">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Humedad (%)</label>
                                <input type="number" step="0.1" class="form-control" id="log_hum" name="humedad" placeholder="Ej: 55" oninput="handlers.actualizarSemaforoVPD()">
                            </div>
                        </div>
                        <!-- Semáforo VPD en tiempo real -->
                        <div id="vpd-indicator" style="display: none; padding: 12px; border-radius: 8px; margin-top: 10px; text-align: center; font-weight: 600; font-family: var(--font-mono); border: 1px solid var(--border-color);">
                            VPD Calculado: <span id="vpd-value" style="font-size: 1.2em;">--</span> kPa
                        </div>
                    </div>

                    <!-- Campos: Nutrientes -->
                    <div id="fields-nutrientes" style="display: none;">
                        <div class="form-group">
                            <label class="form-label">Dosis y Notas</label>
                            <textarea class="form-control" name="notas_nutrientes" rows="3" placeholder="Ej: 2ml/L CalMag, 1ml/L Bloom"></textarea>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 16px;">
                        <label class="form-label">Notas Adicionales</label>
                        <textarea class="form-control" name="nota" rows="2" placeholder="Opcional..."></textarea>
                    </div>
                    
                    <div class="form-group" style="margin-top: 16px;">
                        <label class="form-label"><i class="fa-solid fa-camera"></i> Adjuntar Foto (Opcional)</label>
                        <input type="file" class="form-control" accept="image/*" onchange="handlers.handlePhotoUpload(event)" style="padding: 8px;">
                        <input type="hidden" name="fotoData" id="log-photo-data">
                        <img id="log-photo-preview" style="max-width: 100%; display: none; margin-top: 12px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                    </div>
                `;

                container.innerHTML = `
                    ${this.modalHtml('space-modal', 'Nuevo Espacio', spaceForm)}
                    ${this.modalHtml('move-plant-modal', 'Mover / Cambiar Etapa', movePlantForm)}
                    ${this.modalHtml('task-modal', 'Nueva Tarea', taskForm)}
                    ${this.modalHtml('plant-modal', 'Nueva Planta', plantForm)}
                    ${this.modalHtml('log-modal', 'Nuevo Registro', logForm)}
                    ${this.modalHtml('metric-modal', 'Próximamente', '<p style="color:var(--text-secondary)">Funcionalidad en desarrollo.</p>')}
                `;
            }
        };

        /* =========================================================================
           5. HANDLERS
           ========================================================================= */
        const handlers = {
            viewSpace(id) {
                state.selectedSpaceId = id;
                render.app();
            },
            backToSpaces() {
                state.selectedSpaceId = null;
                render.app();
            },
            handlePhotoUpload(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        // Comprimir la imagen para no romper el localStorage (max 5MB)
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600; // Resolución máxima
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.6); // 60% calidad
                        
                        document.getElementById('log-photo-data').value = dataUrl;
                        const preview = document.getElementById('log-photo-preview');
                        preview.src = dataUrl;
                        preview.style.display = 'block';
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            },
            viewPlantDetail(id) {
                state.selectedPlantId = id;
                window.location.hash = 'plant-detail';
            },

            toggleTask(id) {
                const task = state.tasks.find(t => t.id === id);
                if(task) {
                    task.completada = !task.completada;
                    saveState();
                    if(state.activeView === 'tasks' || state.activeView === 'dashboard') {
                        render.app();
                    }
                }
            },
            
            toggleTheme() {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', state.theme);
                const icon = document.querySelector('#theme-toggle i');
                icon.className = state.theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            },

            toggleSidebar() {
                document.getElementById('sidebar').classList.toggle('open');
                document.getElementById('sidebar-overlay').classList.toggle('active');
            },

            openModal(modalId) {
                const modal = document.getElementById(modalId);
                if(modal) modal.classList.add('active');
            },

            closeModal(e, modalId, force = false) {
                // Close if forced (X button or Cancel) OR clicked exactly on overlay
                if(force || (e && e.target.id === modalId)) {
                    document.getElementById(modalId).classList.remove('active');
                }
            },

            submitForm(e, modalId) {
                e.preventDefault();
                const form = e.target;
                const data = Object.fromEntries(new FormData(form).entries());

                if (modalId === 'task-modal') {
                    state.tasks.unshift({ id: utils.generateId(), titulo: data.titulo, fecha: data.fecha, prioridad: data.prioridad, completada: false, plantId: data.plantId || null });
                    saveState();
                } else if (modalId === 'space-modal') {
                    if (!state.spaces) state.spaces = [];
                    
                    if (data.spaceId) {
                        // Editando existente
                        const space = state.spaces.find(s => s.id === data.spaceId);
                        if (space) {
                            space.nombre = data.nombre;
                            space.tipo = data.tipo;
                            space.sustrato = data.sustrato;
                            space.luz = data.luz;
                        }
                    } else {
                        // Creando nuevo
                        state.spaces.push({ 
                            id: utils.generateId(), 
                            nombre: data.nombre,
                            tipo: data.tipo,
                            sustrato: data.sustrato,
                            luz: data.luz
                        });
                    }
                    render.setupModals();
                    saveState();
                } else if (modalId === 'plant-modal') {
                    const cantidad = parseInt(data.cantidad) || 1;
                    
                    for (let i = 0; i < cantidad; i++) {
                        let nombrePlanta = data.nombre;
                        if (cantidad > 1) {
                            nombrePlanta = `${data.nombre} #${i + 1}`;
                        }
                        
                        state.plants.unshift({ 
                            id: utils.generateId(), 
                            nombre: nombrePlanta, 
                            variedad: data.variedad, 
                            etapa: data.etapa, 
                            sistema: data.sistema, 
                            spaceId: data.spaceId, 
                            fechaInicio: new Date().toISOString(), 
                            estado: 'activa' 
                        });
                    }
                    render.setupModals();
                    saveState();
                } else if (modalId === 'log-modal') {
                    const tipo = data.tipo;
                    let notaAdicional = data.nota || '';
                    
                    if (tipo === 'Riego') {
                        notaAdicional = `[Volumen: ${data.volumen_ml || 0}ml, pH: ${data.ph || '-'}, EC: ${data.ec || '-'}] ${notaAdicional}`;
                    } else if (tipo === 'Medicion') {
                        const vpd = handlers.calcularVPD(parseFloat(data.temperatura), parseFloat(data.humedad));
                        notaAdicional = `[Temp: ${data.temperatura}°C, Hum: ${data.humedad}%, VPD: ${vpd}kPa] ${notaAdicional}`;
                    } else if (tipo === 'Nutrientes') {
                        notaAdicional = `[Dosis: ${data.notas_nutrientes}] ${notaAdicional}`;
                    }

                    state.logs.unshift({ 
                        id: utils.generateId(), 
                        plantId: data.plantId, 
                        tipo: tipo.toLowerCase(), 
                        fecha: new Date().toISOString(), 
                        nota: notaAdicional,
                        foto: data.fotoData || null
                    });
                    // Limpiar el preview para el proximo uso
                    document.getElementById('log-photo-data').value = '';
                    document.getElementById('log-photo-preview').style.display = 'none';
                    document.getElementById('log-photo-preview').src = '';
                    saveState();
                } else if (modalId === 'move-plant-modal') {
                    const plant = state.plants.find(p => p.id === state.selectedPlantId);
                    if (plant) {
                        plant.spaceId = data.spaceId;
                        plant.etapa = data.etapa;
                        saveState();
                    }
                }

                form.reset();
                this.closeModal(null, modalId, true);
                render.app();
            },

            openMoveModal() {
                const plant = state.plants.find(p => p.id === state.selectedPlantId);
                if (!plant) return;
                document.getElementById('move-space-select').value = plant.spaceId;
                document.getElementById('move-etapa-select').value = plant.etapa;
                this.openModal('move-plant-modal');
            },

            editSpace(spaceId) {
                const space = state.spaces.find(s => s.id === spaceId);
                if (!space) return;
                
                // Llenar el formulario con los datos actuales
                document.getElementById('edit-space-id').value = space.id;
                document.querySelector('#space-modal input[name="nombre"]').value = space.nombre;
                document.querySelector('#space-modal select[name="tipo"]').value = space.tipo;
                document.querySelector('#space-modal select[name="sustrato"]').value = space.sustrato;
                document.querySelector('#space-modal input[name="luz"]').value = space.luz;
                
                // Cambiar título del modal
                document.querySelector('#space-modal .modal-header h2').textContent = 'Editar Espacio';
                
                this.openModal('space-modal');
            },

            openPlantModalForSpace(spaceId) {
                // Pre-seleccionar el espacio en el formulario de nueva planta
                this.openModal('plant-modal');
                document.querySelector('#plant-modal select[name="spaceId"]').value = spaceId;
            },

            deleteSpace(spaceId) {
                const space = state.spaces.find(s => s.id === spaceId);
                if (!space) return;
                const hasPlants = state.plants.some(p => p.spaceId === spaceId);
                if (hasPlants) {
                    alert('No puedes eliminar un espacio que contiene plantas. Mueve o elimina las plantas primero.');
                    return;
                }
                if (confirm(`¿Estás seguro de eliminar el espacio "${space.nombre}"?`)) {
                    state.spaces = state.spaces.filter(s => s.id !== spaceId);
                    saveState();
                    render.setupModals();
                    render.app();
                }
            },

            resetData() {
                if (confirm('¿Borrar todos los datos y volver al estado inicial?')) {
                    localStorage.removeItem(STORAGE_KEY);
                    location.reload();
                }
            },

            handleSearch(e) {
                const query = e.target.value.toLowerCase().trim();
                const dropdown = document.getElementById('search-results');
                
                if (query.length < 2) {
                    dropdown.style.display = 'none';
                    return;
                }

                let resultsHtml = '';
                let hasResults = false;

                // Search Plants
                const foundPlants = state.plants.filter(p => p.nombre.toLowerCase().includes(query) || p.variedad.toLowerCase().includes(query));
                if (foundPlants.length > 0) {
                    hasResults = true;
                    foundPlants.forEach(p => {
                        resultsHtml += `
                        <div class="search-result-item" onclick="handlers.viewPlantDetail('${p.id}'); document.getElementById('search-results').style.display='none'; document.getElementById('global-search').value='';">
                            <div class="search-result-icon"><i class="fa-solid fa-seedling"></i></div>
                            <div class="search-result-text">
                                <h4>${p.nombre}</h4>
                                <p>Planta • ${p.variedad}</p>
                            </div>
                        </div>`;
                    });
                }

                // Search Spaces
                const foundSpaces = state.spaces.filter(s => s.nombre.toLowerCase().includes(query));
                if (foundSpaces.length > 0) {
                    hasResults = true;
                    foundSpaces.forEach(s => {
                        resultsHtml += `
                        <div class="search-result-item" onclick="window.location.hash='plants'; handlers.viewSpace('${s.id}'); document.getElementById('search-results').style.display='none'; document.getElementById('global-search').value='';">
                            <div class="search-result-icon" style="color: var(--accent-blue); background: var(--status-info-dim);"><i class="fa-solid fa-layer-group"></i></div>
                            <div class="search-result-text">
                                <h4>${s.nombre}</h4>
                                <p>Espacio</p>
                            </div>
                        </div>`;
                    });
                }

                // Search Tasks
                const foundTasks = state.tasks.filter(t => t.titulo.toLowerCase().includes(query));
                if (foundTasks.length > 0) {
                    hasResults = true;
                    foundTasks.forEach(t => {
                        resultsHtml += `
                        <div class="search-result-item" onclick="window.location.hash='tasks'; document.getElementById('search-results').style.display='none'; document.getElementById('global-search').value='';">
                            <div class="search-result-icon" style="color: var(--status-alert); background: var(--status-alert-dim);"><i class="fa-solid fa-check"></i></div>
                            <div class="search-result-text">
                                <h4>${t.titulo}</h4>
                                <p>Tarea</p>
                            </div>
                        </div>`;
                    });
                }

                if (!hasResults) {
                    resultsHtml = `<div style="padding: 16px; text-align: center; color: var(--text-secondary); font-size: 13px;">No se encontraron resultados para "${query}".</div>`;
                }

                dropdown.innerHTML = resultsHtml;
                dropdown.style.display = 'block';
            },

            toggleLogFields() {
                const tipo = document.getElementById('tipo_evento').value;
                document.getElementById('fields-riego').style.display = tipo === 'Riego' ? 'block' : 'none';
                document.getElementById('fields-medicion').style.display = tipo === 'Medicion' ? 'block' : 'none';
                document.getElementById('fields-nutrientes').style.display = tipo === 'Nutrientes' ? 'block' : 'none';
            },

            calcularVPD(temp, hum) {
                if (!temp || !hum) return 0;
                const svp = 0.61078 * Math.exp((17.27 * temp) / (temp + 237.3));
                const vpd = svp * (1 - (hum / 100));
                return parseFloat(vpd.toFixed(2));
            },

            evaluarClima(vpd, etapa) {
                let minOptimo, maxOptimo;
                const etapaStr = etapa ? etapa.toLowerCase() : '';

                if (etapaStr.includes('floración') || etapaStr.includes('floracion')) {
                    minOptimo = 1.2;
                    maxOptimo = 1.5;
                } else {
                    minOptimo = 0.8;
                    maxOptimo = 1.2;
                }

                if (vpd >= minOptimo && vpd <= maxOptimo) {
                    return 'var(--status-optimal)';
                } else if (vpd >= (minOptimo - 0.2) && vpd <= (maxOptimo + 0.2)) {
                    return 'var(--status-alert)';
                } else {
                    return 'var(--status-critical)';
                }
            },

            actualizarSemaforoVPD() {
                const tempInput = document.getElementById('log_temp');
                const humInput = document.getElementById('log_hum');
                const plantaId = document.getElementById('log_planta_id').value;
                const vpdIndicator = document.getElementById('vpd-indicator');
                const vpdValue = document.getElementById('vpd-value');

                if (!tempInput || !humInput) return;

                const temp = parseFloat(tempInput.value);
                const hum = parseFloat(humInput.value);
                
                // Buscar etapa de la planta seleccionada
                const planta = state.plants.find(p => p.id === plantaId);
                const etapa = planta ? planta.etapa : 'vegetativo';

                if (!isNaN(temp) && !isNaN(hum)) {
                    const vpd = handlers.calcularVPD(temp, hum);
                    const colorHex = handlers.evaluarClima(vpd, etapa);

                    vpdIndicator.style.display = 'block';
                    vpdValue.textContent = vpd;
                    
                    vpdIndicator.style.color = colorHex;
                    vpdIndicator.style.border = `1px solid ${colorHex}`;
                    vpdIndicator.style.backgroundColor = colorHex === 'var(--status-optimal)' ? 'var(--status-optimal-dim)' : 
                                                        colorHex === 'var(--status-alert)' ? 'var(--status-alert-dim)' : 
                                                        'var(--status-critical-dim)';
                    
                    tempInput.style.borderColor = colorHex;
                    humInput.style.borderColor = colorHex;
                } else {
                    vpdIndicator.style.display = 'none';
                    tempInput.style.borderColor = 'var(--border-color)';
                    humInput.style.borderColor = 'var(--border-color)';
                }
            }
        };

        /* =========================================================================
           6. ROUTER
           ========================================================================= */
        const router = {
            handleHashChange() {
                let hash = window.location.hash.replace('#', '') || 'dashboard';
                if(hash.startsWith('plant-detail')) hash = 'plant-detail';
                
                const validRoutes = ['dashboard', 'plants', 'log', 'tasks', 'metrics', 'plant-detail', 'aura-chat'];
                
                if (validRoutes.includes(hash)) {
                    state.activeView = hash;
                    render.app();
                } else {
                    window.location.hash = 'dashboard';
                }

                // Close mobile sidebar on navigation
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebar-overlay').classList.remove('active');
            },
            
            init() {
                window.addEventListener('hashchange', this.handleHashChange);
                // Trigger initial route
                this.handleHashChange();
            }
        };

        /* =========================================================================
           7. INIT
           ========================================================================= */
        function initApp() {
            const hadData = loadState();
            if (!hadData) loadSeedData();
            render.setupModals();
            router.init();

            // Event Listeners for UI
            document.getElementById('theme-toggle').addEventListener('click', handlers.toggleTheme);
            document.getElementById('menu-toggle').addEventListener('click', handlers.toggleSidebar);
            document.getElementById('sidebar-overlay').addEventListener('click', handlers.toggleSidebar);
            
            // Global Escape key handler for modals
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal-overlay.active').forEach(modal => {
                        modal.classList.remove('active');
                    });
                    const dropdown = document.getElementById('search-results');
                    if (dropdown) dropdown.style.display = 'none';
                }
            });

            // Search Handlers
            const searchInput = document.getElementById('global-search');
            if (searchInput) {
                searchInput.addEventListener('input', handlers.handleSearch);
                searchInput.addEventListener('focus', handlers.handleSearch);
            }

            // Close search dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.header-search') && !e.target.closest('.search-results-dropdown')) {
                    const dropdown = document.getElementById('search-results');
                    if (dropdown) dropdown.style.display = 'none';
                }
            });
        }

        // Boot the application
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
